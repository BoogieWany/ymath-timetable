function schedDiff(b,a,z){const out={add:[],del:[],ch:[]};const tn2=id=>(b.teachers.find(t=>t.id===id)||{}).name||'?';
  const pname2=(d,p)=>((b.days[d]||[])[p]||{}).name||'';const slot=(v,c)=>v.sessions.filter(o=>o.cls===c.id).map(o=>`${o.d} ${pname2(o.d,o.p).replace(/^(저녁|주말)\s*/,'')}(${tn2(o.t)})`).sort((x,y)=>x.localeCompare(y,'ko'));
  const mem=c=>[...new Set(Object.values(c.members||{}).flat())];const sn=id=>(b.students.find(s=>s.id===id)||{}).name||'?';
  const used=new Set();
  z.classes.forEach(c=>{let o=a.classes.find(x=>x.id===c.from&&!used.has(x.id))||a.classes.find(x=>x.name===c.name&&!used.has(x.id));
    if(!o){out.add.push({c,slots:slot(z,c),n:mem(c).length});return}used.add(o.id);
    const s1=slot(a,o),s2=slot(z,c);const m1=mem(o),m2=mem(c);const inS=m2.filter(x=>!m1.includes(x)).map(sn),outS=m1.filter(x=>!m2.includes(x)).map(sn);
    const sc=s1.join('|')!==s2.join('|'),ren=o.name!==c.name;if(sc||inS.length||outS.length||ren)out.ch.push({c,o,s1,s2,sc,inS,outS,ren})});
  a.classes.forEach(o=>{if(!used.has(o.id))out.del.push({c:o,slots:slot(a,o),n:mem(o).length})});return out}

  $('modal').hidden=false;$('modal').innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dfT" style="width:min(760px,100%)"><h2 id="dfT">바뀌는 점 · ${esc(a.name)} → ${esc(z.name)}</h2>

/* ===== 학년 올리기: 원하는 때 한 번 눌러 이 지점 학생 전체를 한 학년씩 (초6→중1, 중3→고1, 고3→졸업) · 미리 보고 올리고, 되돌리기 가능 ===== */
function gradeNext(g){const m=/^(초|중|고)\s*(\d)$/.exec(String(g||'').trim());if(!m)return null;const lv=m[1],n=+m[2];
  if(lv==='초')return n<6?`초${n+1}`:'중1';if(lv==='중')return n<3?`중${n+1}`:'고1';return n<3?`고${n+1}`:'졸업'}
function gradePlan(b,opt){const rows={},keep={};let n=0;
  b.students.forEach(s=>{if(!opt.away&&s.status==='휴원'){keep['휴원']=(keep['휴원']||0)+1;return}const g=String(s.grade||'').trim();let to=gradeNext(g);
    if(to==='졸업'&&!opt.grad)to=null;if(!to){const k=g||'(비어 있음)';keep[k]=(keep[k]||0)+1;return}const k=g+'→'+to;rows[k]=rows[k]||{from:g,to,n:0};rows[k].n++;n++});
  return {rows:Object.values(rows).sort((a,z)=>GRADE_ORDER(a.from)-GRADE_ORDER(z.from)),keep,n}}
function gradeUpDlg(){const b=B();const opt=UI.gu||(UI.gu={grad:true,away:true});const P=gradePlan(b,opt);const last=b.gradeUpAt||'';const recent=last&&(Date.now()-new Date(last).getTime())<300*86400e3;
  $('modal').hidden=false;$('modal').innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="guT" style="width:min(560px,100%)"><h2 id="guT">새 학년으로 올리기 · ${esc(b.name)}</h2>
  <div class="hint" style="line-height:1.6">이 지점 학생 전체의 학년을 한 단계 올려요 — 초6은 중1, 중3은 고1로. 원하는 때(보통 2월 말~3월 초)에 <b>한 번만</b> 누르면 돼요. 올린 뒤에도 [되돌리기]로 바로 전으로 돌릴 수 있어요.${last?`<br>마지막으로 올린 날: <b>${esc(last)}</b>`:''}</div>
  ${recent?'<div class="box warn"><span><b>올해 이미 올렸어요.</b> 한 번 더 올리면 두 학년이 올라가요. 실수가 아니면 계속하세요.</span></div>':''}
  <table class="tbl" style="max-width:360px"><thead><tr><th>지금</th><th style="width:28px"></th><th>올린 뒤</th><th class="num">인원</th></tr></thead><tbody>
  ${P.rows.map(r=>`<tr><td><b>${esc(r.from)}</b></td><td style="color:var(--muted)">→</td><td><b>${esc(r.to)}</b></td><td class="num">${r.n}명</td></tr>`).join('')||'<tr><td colspan="4" class="empty">올릴 학생이 없어요</td></tr>'}
  ${Object.entries(P.keep).map(([k,v])=>`<tr style="color:var(--muted)"><td>${esc(k)}</td><td>·</td><td>그대로</td><td class="num">${v}명</td></tr>`).join('')}</tbody></table>
  <div class="row" style="gap:18px"><label class="chk" style="width:auto;white-space:nowrap;font-size:13px;color:var(--fg)"><input type="checkbox" data-gu="grad" ${opt.grad?'checked':''}> 고3은 <b>졸업</b>으로 표시</label><label class="chk" style="width:auto;white-space:nowrap;font-size:13px;color:var(--fg)"><input type="checkbox" data-gu="away" ${opt.away?'checked':''}> 휴원생도 함께 올리기</label></div>
  <div class="row" style="justify-content:flex-end"><span class="hint" style="flex:1">${P.n}명이 바뀌어요 · 수정 모드가 아니어도 바로 저장돼요${typeof syOn==='function'&&syOn()?' · 다른 PC와 폰에도 전달돼요':''}</span><button class="btn" data-act="closeModal">취소</button><button class="btn pri" data-act="gradeUpGo" ${P.n?'':'disabled'}>${P.n}명 올리기</button></div></div>`}
async function gradeUpGo(){const b=B();const opt=UI.gu||{grad:true,away:true};const P=gradePlan(b,opt);if(!P.n)return;$('modal').hidden=true;
  await quickChange(()=>{const b=B();const undo={at:new Date().toISOString().slice(0,10),g:{}};
    b.students.forEach(s=>{if(!opt.away&&s.status==='휴원')return;let to=gradeNext(s.grade);if(to==='졸업'&&!opt.grad)to=null;if(!to)return;undo.g[s.id]=s.grade||'';s.grade=to});
    b.gradeUndo=undo;b.gradeUpAt=undo.at},`학년을 올렸어요 (${P.n}명)`);render()}
async function gradeUndoGo(){const b=B();const u=b.gradeUndo;if(!u)return;const n=Object.keys(u.g).length;
  await quickChange(()=>{const b=B();const u=b.gradeUndo;if(!u)return;b.students.forEach(s=>{if(u.g[s.id]!==undefined)s.grade=u.g[s.id]});delete b.gradeUndo;delete b.gradeUpAt},`학년을 올리기 전으로 되돌렸어요 (${n}명)`);render()}

/* ===== 학생·학부모 연락처 (폰 시간표에선 담당 선생님만 '연락처 코드'로 봄) ===== */
const phFmt=n=>{const d=String(n||'').replace(/\D/g,'');return d.length===11?`${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`:d.length===10?(d.startsWith('02')?`${d.slice(0,2)}-${d.slice(2,6)}-${d.slice(6)}`:`${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`):d.length===9?`${d.slice(0,2)}-${d.slice(2,5)}-${d.slice(5)}`:d};
function phCell(s){const n=(s.ph?1:0)+(s.pa||[]).length;return `<button class="phc${n?'':' none'}" data-phed="${s.id}" title="${n?esc([s.ph?'학생 '+phFmt(s.ph):'',...(s.pa||[]).map(x=>x.l+' '+phFmt(x.n))].filter(Boolean).join(' · ')):'연락처 넣기'}">${n?`<b>${s.ph?'학생':''}${s.ph&&(s.pa||[]).length?' · ':''}${(s.pa||[]).length?esc((s.pa||[]).map(x=>x.l).join('·')):''}</b>`:'+ 넣기'}</button>`}
function phDlg(id){const s=S(id);if(!s)return;const pa=(s.pa||[]).concat([{l:'',n:''},{l:'',n:''}]).slice(0,3);
  $('modal').hidden=false;$('modal').innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="phT" style="width:min(460px,100%)" data-ph="${id}"><h2 id="phT">연락처 · ${esc(sname(id))}</h2>
  <div class="hint">선생님 폰 시간표에선 <b>이 학생 담당 선생님</b>만 자기 로그인 코드로 로그인하면 볼 수 있어요. 번호를 누르면 바로 전화가 걸려요.</div>
  <div class="row"><label for="phS">학생</label><input id="phS" inputmode="tel" placeholder="010-0000-0000" value="${esc(phFmt(s.ph||''))}" style="flex:1"></div>
  ${pa.map((x,i)=>`<div class="row"><input data-pal="${i}" placeholder="${i===0?'어머니':i===1?'아버지':'관계'}" value="${esc(x.l||'')}" style="width:80px"><input data-pan="${i}" inputmode="tel" placeholder="010-0000-0000" value="${esc(phFmt(x.n||''))}" style="flex:1"></div>`).join('')}
  <div class="row" style="justify-content:flex-end"><span class="hint" style="flex:1">수정 모드가 아니어도 바로 저장돼요</span><button class="btn" data-act="closeModal">취소</button><button class="btn pri" data-act="phSave">저장</button></div></div>`;setTimeout(()=>{const i=$('phS');if(i)i.focus()},50)}
async function phSave(){const dlg=document.querySelector('[data-ph]');if(!dlg)return;const id=dlg.dataset.ph;const dg=v=>String(v||'').replace(/\D/g,'');const ok=d=>!d||/^0\d{8,10}$/.test(d);
  const ph=dg($('phS').value);const pa=[0,1,2].map(i=>({l:(document.querySelector(`[data-pal="${i}"]`).value||'').trim(),n:dg(document.querySelector(`[data-pan="${i}"]`).value)})).filter(x=>x.n).map((x,i)=>({l:x.l||(i===0?'어머니':i===1?'아버지':'학부모'),n:x.n}));
  if(!ok(ph)||pa.some(x=>!ok(x.n))){toast('번호를 확인해 주세요 (0으로 시작하는 9~11자리)');return}
  $('modal').hidden=true;await quickChange(()=>{const s=B().students.find(x=>x.id===id);if(!s)return;if(ph)s.ph=ph;else delete s.ph;if(pa.length)s.pa=pa;else delete s.pa},`${sname(id)} 연락처를 저장했어요`)}
/* 선생님 연락처 코드: 6자리 · 새로 만들면 예전 코드로 연 폰에선 다시 넣어야 함 */
/* 같은 이름 = 같은 선생님(지점을 오가며 수업하는 분은 여러 지점에 등록돼 있음) → 로그인 코드·연락처·모든 지점 보기는 한 사람 기준으로 */
const tnm=x=>String(x||'').replace(/\s+/g,'');
const sameT=name=>DB.branches.flatMap(b=>(b.teachers||[]).filter(t=>tnm(t.name)===tnm(name)).map(t=>({b,t})));
const sameTEd=name=>sameT(name).filter(x=>!(typeof syOn==='function'&&syOn())||canEditB(x.b.id)); // 이 PC가 고칠 수 있는 지점만
function ckCell(t){if(typeof isStaff==='function'&&isStaff())return '<span class="hint">—</span>';const ed=!(typeof syOn==='function'&&syOn())||canEditB(B().id);const diff=t.ck&&sameT(t.name).some(x=>x.t.ck&&x.t.ck!==t.ck);
  return t.ck?`<span class="ckc mono">${esc(t.ck)}</span>${diff?'<span class="hint" title="같은 이름 선생님인데 지점마다 코드가 달라요 · [바꾸기]를 누르면 전 지점이 같은 코드가 돼요"> · 지점마다 달라요</span>':''} <button class="btn sm" data-ckcopy="${t.id}" title="주소와 이 선생님 개인 코드를 복사 · 카톡 1:1로 보내 주세요">복사</button>${ed?` <button class="btn sm" data-cknew="${t.id}" data-label="바꾸기" title="새 코드로 바꾸면 그 선생님은 새 코드로 다시 로그인해야 해요">바꾸기</button>`:''}`:(ed?`<button class="btn sm" data-cknew="${t.id}" data-label="만들기">만들기</button>`:'<span class="hint">없음</span>')}
/* 로그인 코드: 6자리 · 전 지점에서 겹치지 않게 · 다른 지점에 같은 이름 선생님 코드가 있으면 처음 만들 땐 그 코드를 그대로(한 사람 = 한 코드) */
async function ckNew(tid){const t0=B().teachers.find(x=>x.id===tid);if(!t0)return;const me=sameT(t0.name),ed=sameTEd(t0.name);
  if(me.length>ed.length&&t0.ck){toast('다른 지점에도 등록된 선생님이에요 · 코드 바꾸기는 관리자 모드에서 해 주세요 (전 지점이 같은 코드여야 해요)',5000);return}
  const mine=new Set(me.map(x=>x.t));const used=new Set(DB.branches.flatMap(b=>(b.teachers||[]).concat(b.staff||[])).filter(x=>!mine.has(x)&&x.ck).map(x=>x.ck));
  const have=!t0.ck&&me.find(x=>x.t.ck);let c=have?have.t.ck:'';   // 처음 만들 땐 다른 지점에 이미 있는 그 사람 코드를 그대로
  while(!c||used.has(c))c=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);
  const bids=[...new Set(ed.map(x=>x.b.id))];
  await quickChange(()=>{sameT(t0.name).forEach(x=>{if(bids.includes(x.b.id))x.t.ck=c})},`${tn(tid)} 선생님 로그인 코드: ${c}${bids.length>1?` (${bids.length}개 지점 공통)`:''} · [복사]로 1:1로 보내 주세요`,bids)}
/* 모든 지점 보기: 관리자만 켜고 끔 */
async function tAllTg(name){if(!isOwner())return;const me=sameT(name);if(!me.length)return;const on=!me.some(x=>x.t.all);const bids=[...new Set(me.map(x=>x.b.id))];
  await quickChange(()=>{sameT(name).forEach(x=>{if(on)x.t.all=1;else delete x.t.all})},`${me[0].t.name} 선생님: 강사용에서 ${on?'모든 지점을 볼 수 있어요':'이름 있는 지점만 보여요'}`,bids)}

async function cnAsgGo(){const nm=($('caS').value||'').trim();const b=B();const m=b.students.filter(s=>s.name===nm&&!offS(s));if(m.length!==1){$('caErr').textContent=m.length?'같은 이름이 여러 명이에요 · 학생 관리에서 이름 옆 상담으로 보내 주세요':'그 이름의 학생이 없어요';return}
  const s=m[0],t=$('caT2').value,note=($('caN').value||'').trim().slice(0,120);const by=cnMe()+((typeof isStaff==='function'&&isStaff())?'(행정)':'');$('modal').hidden=true;
  await quickChange(()=>{const bb=B();const c=bb.cns=bb.cns||{};c.asg=c.asg||[];c.asg.push({id:uid('g'),sid:s.id,t,note,by,at:todayStr()})},`${s.name} 상담을 ${t?tn(t)+'T께':'담당 선생님께'} 보냈어요 · 1~2분 뒤 폰에 떠요`)}
/* 통계: 분기별 상담 횟수(누른 사람 기준) · 이번 기간 완료율(선생님별 담당 학생) */
function cnStatsHTML(brs){const y=todayStr().slice(0,4);const by={};const qn=d=>Math.floor((+d.slice(5,7)-1)/3);
  brs.forEach(b=>(cnCfg(b).recs||[]).forEach(r=>{if(!r.at.startsWith(y))return;const k=r.by||'(이름 없음)';const o=by[k]=by[k]||[0,0,0,0];o[qn(r.at)]++}));
  const rate={};brs.forEach(b=>{if(!cnOn(b))return;const wins=cnWins(cnCfg(b),b.exam,todayStr());if(!wins.length)return;b.students.forEach(s=>{const n=cnNeed(b,s,wins);if(!n||n.held)return;cnTeachers(b,s.id).forEach(t=>{const nm=(b.teachers.find(x=>x.id===t)||{}).name;if(!nm)return;const o=rate[tnm(nm)]=rate[tnm(nm)]||{name:nm,a:0,d:0};o.a++;if(n.done)o.d++})})});
  const names=Object.keys(by).sort((a,z)=>by[z].reduce((p,q)=>p+q,0)-by[a].reduce((p,q)=>p+q,0));const R=Object.values(rate).sort((a,z)=>z.a-a.a);
  if(!names.length&&!R.length)return brs.some(cnOn)?'<div class="sec"><h3>정기 상담</h3><div class="hint">아직 상담 기록이 없어요</div></div>':'';
  const cq=qn(todayStr());
  return `<div class="sec"><h3>정기 상담 <span class="hint">${y}년 분기별 상담 횟수 · [상담 완료]를 누른 사람 기준</span></h3><div class="stw"><table class="tbl sttbl"><thead><tr><th class="l">누가</th>${[1,2,3,4].map(q=>`<th${q-1===cq?' class="cur"':''}>${q}분기${q-1===cq?'<small>지금</small>':''}</th>`).join('')}<th class="tt">합계</th></tr></thead><tbody>
    ${names.map(k=>`<tr><td class="l"><b>${esc(k)}</b></td>${by[k].map(v=>`<td class="${v?'':'z'}">${v||'·'}</td>`).join('')}<td class="tt">${by[k].reduce((p,q)=>p+q,0)}</td></tr>`).join('')||'<tr><td colspan="6" class="hint">기록 없음</td></tr>'}</tbody></table></div>
    ${R.length?`<div class="stw"><table class="tbl sttbl"><thead><tr><th class="l">선생님 · 이번 기간</th><th>담당 학생</th><th>완료</th><th class="tt">완료율</th></tr></thead><tbody>${R.map(o=>`<tr><td class="l"><b>${esc(o.name)}</b></td><td>${o.a}</td><td>${o.d}</td><td class="tt"><span class="stbar"><i style="width:${Math.round(o.d/o.a*100)}%"></i></span>${Math.round(o.d/o.a*100)}%</td></tr>`).join('')}</tbody></table></div><div class="hint">완료율은 담당 학생 중 이번 기간 상담을 마친 비율이에요(누가 했든) · 보류 학생은 빼고 세요</div>`:''}</div>`}
</script>
<script>/* ================= 도움말 (사용 설명서) ================= */

 {id:'edit',t:'수정 모드 · 적용 · 보관',b:`

  <li><b>휴지통</b>에 놓으면 [반 전체 / 이 수업만]을 골라 지워요. 휴지통에서 되살릴 수 있어요.</li>
  <li><b>[자동 배치]</b>: 고른 반을 학생 겹침·선호 시간·연강을 따져 여러 안으로 배치해 보여 줘요(AI 없이 계산). 미리 보고 마음에 드는 안만 적용해요.</li>

 {id:'stu',t:'학생 옮기기 · 명단',b:`
  <ul><li>수정 모드에서 카드(또는 명단 창)의 <b>이름을 끌어 다른 카드에</b> 놓으면 [반 전체 옮기기 / 이 수업만 / 복사]를 골라요. 여러 반을 섞어 다니는 학생은 "이 수업만".</li>
  <li>이름 위의 <b>×</b>를 누르면 그 반에서 빠져요.</li>
  <li>수정 모드에서 카드를 누르면 명단 창 아래 <b>[+ 학생 넣기 · 신입 등록]</b>이 있어요. 있는 학생은 이름을 고르면 바로 들어가고, 처음 보는 이름이면 <b>신입</b>으로 등록돼요. 바쁘면 이름만 넣고, 학교·학년은 나중에 아래 자동 점검의 <b>'신입 정보'</b>를 눌러 넣으면 돼요. 재학생명부를 다시 가져오면 자동으로 채워져요.</li>
  <li><b>학생별</b> 탭 위쪽 <b>수강 반</b> 줄에서도 × 빼기, [반에 넣기…]가 돼요.</li>
  <li><b>[학생 관리]</b>: 재원/휴원, <b>시간 조건</b>(칸을 눌러 보통 → 선호 → 불가)을 정하면 자동 점검·자동 배치에 반영돼요.</li>
  <li><b>[강사 관리]</b> 탭: 강사마다 휴무 요일·선생님 연락처·<b>로그인 코드</b>를 보기 모드에서도 바로 바꾸고, 주당 타임·반·학생 수·오늘 수업·메모/보강 등록·이번 주 변경을 한눈에 봐요. 이름·순서·추가·삭제는 수정 모드에서. [시간표]를 누르면 그 강사 주간 시간표로 가요.</li>
  <li><b>지점 시간표</b> 위 <b>[전체 | 강사 이름]</b> 버튼으로 한 강사의 주간 시간표만 볼 수 있어요(예전 '강사별' 화면).</li>
  <li><b>연락처</b>: [학생 관리]의 <b>연락처</b> 칸을 누르면 학생·학부모(어머니·아버지 등 3명까지) 번호를 넣어요(보기 모드에서도 바로 저장). <b>재학생명부 가져오기</b>를 하면 명부의 연락처 칸(학생 휴대폰·어머니 연락처 같은 이름)을 알아서 읽어요. 메모 칸은 읽지 않아요.</li>
  <li><b>강사용 로그인</b>: 선생님마다 [강사 관리]의 <b>로그인 코드</b>(6자리)로 로그인해요. [만들기] → <b>[복사]</b>로 주소와 코드를 카톡 1:1로 보내 주세요. 로그인하면 <b>그 선생님 이름이 있는 지점만</b> 보이고, 이름도 저절로 정해져요(바꾸려면 로그아웃). 담당 학생 연락처도 바로 보여요 — 다른 선생님 반 학생 번호는 안 보여요. [바꾸기]로 새 코드를 만들면 예전 코드로 로그인한 기기는 다시 로그인해야 해요. 같은 이름이 여러 지점에 있으면 그 지점들이 모두 보여요. [프로그램 관리 → 강사용 모든 지점 보기]에서 켠 선생님은 전 지점을 봐요.</li>

  <li><b>입학 문의</b>: [학생 관리] 맨 위 칸. 관리 프로그램에서 뽑은 <b>입학희망생명부</b> 엑셀을 [입학희망생명부 불러오기]로 고르면 <b>어느 지점에 넣을지 한 번 확인</b>하고 들어가요(이름·학교·학년·연락처·입학희망일·문의일·등록경로). 같은 이름·학교는 다시 안 넣고, 이미 학생이면 건너뛰어요. <b>[입학 예정으로]</b>는 첫 수업일(오늘 이후)을 골라 입학 예정 학생으로, <b>[바로 재원]</b>은 두 번 눌러 오늘부터 재원 학생으로 옮겨요(연락처 그대로) — 반 넣기는 지점 시간표 카드에서. <b>[입학취소]</b>는 두 번 누르면 '취소된 문의'로 남고 [되돌리기]도 돼요. 지점장·행정 선생님 PC에서만 보이고 선생님 폰에는 안 나가요.</li>
  <li><b>퇴원</b>: 학생 관리에서 상태를 눌러 <b>퇴원</b>을 고르고 퇴원일을 정하면, 지금·예정 시간표의 모든 반과 특강 명단에서 빠지고 학생은 '퇴원'으로 남아요(목록 필터 '퇴원'에서 봐요). 선생님 폰에서는 사라져요. 통계에 이번 달 퇴원·입학 문의 수와 월별 퇴원·입학 문의가 나와요. 다시 다니면 상태를 재원으로 바꾸거나 명부를 불러오면 돼요.</li>
  <li><b>행정 선생님 PC</b>: 프로그램 관리자 PC의 [강사 관리 → 행정 선생님] 줄에서 <b>[PC 연결 코드]</b>를 눌러 코드를 받고, 행정 선생님 PC에 같은 프로그램을 설치한 뒤 처음 화면에 붙여넣으면 돼요. 그 PC는 <b>소속 지점만</b> 보이고, 설정·프로그램 관리·버전 관리·보기/수정 스위치·당일 변경·보강 승인·학년 올리기·시간표 가져오기가 없어요. 강사 관리는 보기만 돼요. 할 수 있는 일: 학생 관리(학생 추가·상태·연락처·상담 완료), <b>재학생 명부 가져오기</b>, 지점 시간표 카드를 눌러 <b>반에 학생 넣기·신입 등록</b>, 이름 옆 ×를 두 번 눌러 <b>반에서 빼기</b>(학생별 화면의 수강 반 ×도 같아요 · 모두 바로 저장·다른 PC에 올라감), 통계 보기, PDF.</li>
  <li><b>[통계]</b> 탭: 실적 관리용. 지금 시간표 기준으로 강사마다 <b>학년별 재원 학생 수</b>(휴원·예정은 따로), <b>환산</b>(반마다 타임 비율로 나눈 인원 — 2+2면 0.5명씩, 3+1이면 0.75·0.25명, 혼자 들어가는 반은 1명), <b>학생×타임</b>(주당 내 타임 × 학생 수 합), 주당 타임을 봐요. 표 오른쪽 위 [학년별 재원 / 학년별 환산 / 학년별 학생×타임]으로 학년 칸에 보이는 값을 바꿀 수 있어요. 반 목록에는 반 구조(3+1, 2+2 등, 진한 숫자가 내 타임)가 나오고, <b>특강</b>은 따로 셉니다(주당 타임 = 요일 수). 월별 기록은 [적용]하거나 바로 저장할 때마다 이번 달 값이 덮어써져서, 달이 끝나면 <b>그달 마지막 상태</b>가 남아요(바뀐 게 없는 달은 앞 달 그대로) · 재원/환산/학생×타임/특강 인원/특강 ×타임으로 바꿔 볼 수 있어요. 옆의 학년 고르기로 <b>학년별 월별 기록</b>(예: 고2만)도 봐요 — 학년별 기록은 2026년 10월부터 쌓여요. 명단은 있는데 시간표에 그 선생님 수업이 없는 반은 맨 위에 <b>타임이 없는 반</b>으로 알려 줘요(환산·학생×타임이 0으로 잡히니까요). [엑셀로 저장]하면 시트 여섯 장(실적·학년별 환산·학년별 학생×타임·반 목록·특강·월별)으로 저장돼요. 지점장은 자기 지점만, 프로그램 관리자는 <b>[전 지점 합계]</b>로 같은 이름 강사를 합쳐서 볼 수 있어요.</li>
  <li><b>행정 선생님</b>: [강사 관리] 아래 <b>행정 선생님</b> 칸에서 이름을 넣고 [추가]하면 로그인 코드가 바로 만들어져요(보기 모드에서도 됨). [복사]로 카톡 1:1로 보내 주세요. 행정 선생님 코드로 들어가면 <b>모든 지점</b> 시간표와 <b>학생·학부모 연락처 전체</b>를 보고, 신입 학생 [상담 완료]도 누를 수 있어요(표시는 '이름(행정)'). 개인 시간표가 없어서 '내 수업'·'내 시간표'는 안 나오고, 응원 문구도 행정 선생님용으로 나와요. 이름을 누르면 이름만 고쳐요(코드 그대로). 여러 지점에 같은 이름으로 넣으면 한 사람이라 코드도 하나예요. 폰을 잃어버렸으면 <b>[기기 끊기]</b>를 두 번 누르세요 — 그 코드로 로그인한 폰·PC가 1~2분 뒤 모두 끊기고 새 코드가 만들어져요. [삭제]도 두 번 눌러야 돼요(그 지점에서만 빠져요).</li>
  <li><b>입학 예정 · 신입</b>: [학생 관리]에서 학생의 <b>상태</b>를 누르면 재원·휴원·<b>입학 예정</b>을 고르고 <b>첫 수업일</b>을 정해요(보기 모드에서도 바로 저장). 학생 추가 칸과 카드의 [+ 신입 등록] 창에도 첫 수업일이 있어요 — 오늘 이후면 입학 예정으로 들어가요. 반 명단에 미리 넣어 두면 첫 수업일 전까지 카드 인원에서 빠지고 '+1 예정', 이름 옆에 '예정 10/20'이 보여요. 첫 수업일이 되면 저절로 재원이 되고 <b>2주 동안 '신입'</b> 표시가 붙어요. [학생 관리] 맨 위에 신입·예정 학생이 모여 보여요.</li>
  <li>선생님 폰: 예정으로 등록하는 즉시 아래 공지 칸에 <b>'새로 오는 학생'</b>(이름·학년·첫 수업일·반)이 뜨고 첫 수업일이 되면 저절로 빠져요. [학생] 탭 맨 위에 신입·예정 학생 정보 카드(연락처 포함, 담당 선생님만)가 떠요. <b>상담 전</b>이면 빨간 테두리와 <b>[상담 완료]</b> 버튼이 있어요 — 담당 선생님 중 한 명이 누르면 모두 완료로 바뀌고, 지점장용이 켜져 있으면 원본 학생에도 저절로 적혀요(승인 없음). 상담 완료한 학생만 첫 수업일부터 2주 뒤 사라지고, 상담 전 학생은 2주가 지나도 계속 남아요. 지점장용 [학생 관리] 맨 위 신입 칸에도 '상담 전'(빨간 테두리)·'상담 ✓ 날짜 선생님'이 보이고, [상태] 창에서 상담 완료로 표시하거나 잘못 누른 걸 [상담 취소]할 수 있어요. 강사용 PC 프로그램·PC 브라우저의 학생 탭에도 같은 신입 목록이 떠요.</li>
  <li><b>[학생 관리 → 학년 올리기]</b>: 새 학년이 되는 때에 한 번 누르면 이 지점 학생 전체가 한 학년씩 올라가요(초6→중1, 중3→고1, 고3→졸업 · 빈 학년·'재수' 같은 표기는 그대로). 누르면 먼저 <b>몇 명이 어떻게 바뀌는지 표</b>로 보여 주고, 고3을 졸업으로 표시할지·휴원생도 올릴지 고를 수 있어요. 보기 모드에서도 바로 저장되고 폰에도 전달돼요. 실수했으면 <b>[학년 되돌리기]</b>(두 번)로 올리기 전으로 돌아가요. 지점마다 따로 눌러요.</li></ul>`},
 {id:'cls',t:'반 관리',b:`
  <ul><li>반 이름·색·강사별 <b>주당 횟수</b>·강사별 명단을 고쳐요. 명단은 "반(강사)" 단위로 따로예요.</li>
  <li>주당 횟수를 늘리면 보관함에 대기 카드가 생겨요.</li>
  <li>카드를 더블클릭해도 반 관리로 가요.</li></ul>`},
 {id:'import',t:'가져오기 (시트 · 주간 · 명부)',b:`
  <ul><li><b>시트 시간표 가져오기</b>: 구글 시트에서 받은 .xlsx를 읽어 새 시간표 버전으로. 동명이인·명단에 없는 이름·비슷한 반 이름은 창에서 골라요.</li>
  <li><b>주간 시간표 가져오기</b>: 관리 프로그램의 강사별 주간 .xls를 지금 시간표와 비교해서 바뀐 것만 골라 반영해요.</li>
  <li><b>재학생명부 가져오기</b>: 명부 .xls로 학생 추가·학년 갱신. 명부에 없는 재원생은 휴원으로 바꿀지 물어봐요.</li></ul>`},
 {id:'special',t:'방학 특강',b:`
  <ul><li>지점 시간표 도구줄 <b>[특강 관리] → [+ 새 특강]</b> 또는 특강 줄의 <b>[+]</b>(수정 모드).</li>
  <li>특강마다 <b>요일·시작 시간·길이·기간·강사·학생</b>을 따로 정해요. 정규 교시표는 그대로예요.</li>
  <li>기간 안에 있을 때만 특강 줄이 보여요. 미리 짤 때는 도구줄 <b>특강: 예정도 보기</b>.</li>
  <li>정규 수업·다른 특강과 시간이 겹치면 자동 점검에 떠요. 특강 기간에는 "고등학생 초등부 시간" 규칙을 쉬어요.</li>
  <li>특강 카드를 다른 강사 칸으로 끌면 담당 변경, 휴지통에 놓으면 삭제, [복사해서 새로]로 다음 방학에 재사용.</li></ul>`},
 {id:'note',t:'빈 칸 메모 (보강 · 추가수업 · 조교시간)',b:`<ul><li>수정 모드에서 지점 시간표의 <b>빈 칸</b>에 마우스를 올리면 <b>[+ 메모]</b>가 보여요. 누르고 <b>종류</b>(보강 / 추가수업 / 조교시간)를 고른 뒤 이름을 쳐요 (쉼표나 띄어쓰기로 여러 명). 치는 중에 명부의 비슷한 이름이 뜨면 눌러서 넣을 수 있고, 명부에 없는 이름도 그냥 적으면 돼요. Enter = 저장. 한 칸에 메모를 여러 개(예: 보강 + 조교시간) 둘 수도 있어요 — 메모 아래 <b>[+]</b>.</li>
  <li>어느 종류든 <b>연결할 수업</b>(반)을 고를 수 있어요(선택). 고르면 카드에 반 이름과 색이 붙고, <b>[반 명단 채우기]</b>로 그 반 학생 이름을 한 번에 넣을 수 있어요. 이름 없이 수업만 연결해 둬도 돼요.</li>
  <li><b>횟수</b>를 고르면(예: 3회) 다음 수업일부터 매주 3번만 보이고 끝나면 안 보여요. 끝난 메모는 다음 [적용] 때 지워져요. '지울 때까지'를 고르면 계속 남아요.</li>
  <li>적어 둔 메모를 누르면 종류·수업·횟수·이름을 고치거나 <b>[지우기]</b>.</li>
  <li>시간표 위 <b>[메모 보기]</b> 체크로 모든 메모를 보이기/가리기. 폰·브라우저 전체 시간표에도 같은 스위치가 있어요.</li></ul>`},
 {id:'noterq',t:'선생님 보강 등록',b:`<ul><li>선생님이 브라우저 시간표 <b>전체 → 내 시간표</b>에서 빈 칸(공강)을 누르면 <b>보강</b>을 등록할 수 있어요. <b>횟수</b>(1~8회)를 고르면 첫 수업일부터 매주 그 횟수만큼 보이고, 끝나면 저절로 사라져요(예: 수요일 3회 → 3주). 학생 이름과 연결할 수업(선택)을 적어요. 그 칸에는 '승인 대기'로 보여요.</li><li>보강 등록이 오면 프로그램 위쪽에 <b>선생님 보강 등록 ○건</b>이 떠요. [확인하기] → [승인]하면 그 칸의 빈 칸 메모로 들어가고, [거절]하면 사라져요. 수정 모드 중에는 끝낸 뒤 승인해요.</li><li>지점 관리자는 자기 지점 보강 등록을, 프로그램 관리자는 모든 지점 보강 등록을 승인할 수 있어요.</li><li>처음 한 번 프로그램 관리자 PC의 [설정 → 선생님 보강 등록]에 <b>보강 등록 키</b>(Issues 권한만 있는 GitHub 키)를 넣고 켜요. 이 키로는 보강 등록만 남길 수 있고 시간표는 못 바꿔요. 보강 등록 키도 1년이면 만료되는데, 14일 전부터 위쪽 띠로 알려 줘요.</li><li>아래 자동 점검에도 <b>'보강 등록 n건'</b>이 떠요. 누르면 보강 등록 목록이 열려요.</li></ul>`},
 {id:'admlock',t:'관리자 모드 · 잠금',b:`<ul><li>프로그램 관리자 PC에서 [설정 → 지점 연동 → 관리자 잠금]에 비밀번호를 정하면, 평소엔 <b>내 지점 모드</b>로 열려요. 내 지점만 고칠 수 있고 다른 지점은 보기만 돼요.</li><li>[설정] 맨 위 <b>[관리자 모드]</b>에 비밀번호를 넣으면 다른 지점 수정·지점 코드·폰으로 보기 설정 등이 열리고(위쪽 표시가 '관리자 모드'로 바뀜), <b>[관리자 모드 · 잠그기]</b>를 누르거나 프로그램을 다시 켜면 다시 잠겨요.</li><li>지점 PC에서 [관리자 모드]를 누르면 '관리자 코드가 필요해요' 안내가 떠요. 관리자 PC용 코드를 넣으면 그 PC가 관리자 PC가 되고 바로 비밀번호를 정해요.</li><li>잠가 둬도 새 버전 보내기·연결 키 알림은 그대로예요.</li><li>지점 관리자(내 지점 모드)가 할 수 있는 것: 내 지점의 시간표·반·학생·강사(추가·삭제·휴무)·특강·메모·당일 변경·예정 시간표·공지·학년 올리기·선생님 보강 등록 승인·<b>적용 기록 되돌리기(내 지점만)</b>·백업 저장. 프로그램 관리자만: 지점 추가·삭제, 전체 초기화, 백업 불러오기(전체), 폰 보기 번호·인터넷 올리기, 연동 코드·연결 끊기, 보강 등록 키.</li><li>강사 삭제는 <b>지금 시간표·예정 시간표·특강</b>에 없으면 돼요. 지난 버전에만 있으면 지울 수 있고 그 버전에선 '(삭제된 강사)'로 보여요.</li><li>관리자 모드의 [설정 → 지점 연동 → 연결된 PC]에서 PC마다 [연결 끊기]를 할 수 있어요. 그 PC는 2분 안에 연동이 꺼지고 키가 지워져요(시간표 파일은 남음). 다시 쓰려면 새 코드로 연결해요. 지점 PC에는 스스로 연결을 끊는 버튼이 없어요.</li></ul>`},
 {id:'ver',t:'버전 · 적용 기록 · 백업',b:`
  <ul><li><b>[버전 관리]</b>: 같은 지점에 여러 시간표안(예: 10월안, 겨울안)을 만들어 두고 바꿔 볼 수 있어요.</li>
  <li><b>적용 기록</b>: [적용]할 때마다 그 전 시간표가 남아요. [버전 관리 → 적용 기록 열기]를 누르면 작은 창이 떠요(머리를 끌어 옮기고 Esc·×로 닫기). 줄 끝 <b>×</b>(두 번)로 기록 하나, 아래 <b>[모두 지우기]</b>(두 번)로 전부 지울 수 있어요(이 PC의 기록만). [보기]로 지난 시간표를 보면서 다른 기록으로 바로 바꿔 볼 수 있고, [되돌리기](두 번)로 그 시간표를 초안으로 불러와요.</li>
  <li>저장은 자동이고 30분마다 data\\backup에 백업이 쌓여요. [설정 → 데이터]에서 백업 파일로 저장·불러오기.</li></ul>`},
 {id:'ex',t:'당일 변경 (휴강 · 대강 · 시간 이동)',b:`<ul><li>지점 시간표에서 수업 카드를 누르면 명단 창 아래 <b>[당일 변경 · 휴강 / 대강 / 시간 이동]</b>이 있어요. <b>수정 모드가 아니어도</b> 바로 저장되고 선생님 화면에 1~2분 뒤 보여요(급한 변경용).</li>
  <li>날짜(그 요일 다음 5번 중)를 고르고 <b>휴강</b> / <b>대강</b>(대신 들어갈 선생님) / <b>시간 이동</b>(같은 날 다른 교시, 강사도 바꿀 수 있음) 중 하나 + 메모(선택).</li>
  <li>원래 시간표는 그대로예요. 카드에 "10/22 휴강"처럼 배지가 붙고, 대강·이동은 들어가는 칸에 점선 카드가 생겨요. 그날이 지나면 저절로 원래대로 돌아와요(지난 기록은 다음 [적용] 때 지워짐).</li>
  <li>선생님 브라우저: <b>오늘</b> 화면엔 그날 바뀐 대로 보여요(휴강은 흐리게, 대강은 대강 선생님의 '오늘 수업'에 들어감). 전체 시간표엔 7일 안의 변경이 배지로 보여요.</li>
  <li>잘못 넣었으면 같은 창 위쪽 목록에서 <b>[취소]</b>.</li></ul>`},
 {id:'sched',t:'예정 시간표 (날짜에 자동으로 바뀜)',b:`<ul><li>[버전 관리]에서 지금 시간표를 <b>[복사해서 새 버전]</b> → 새 버전은 <b>이 PC에서만</b> 열려요. 고치고 [적용]해도 선생님들께는 지금 시간표가 그대로 보여요(위쪽 파란 띠로 알려 줘요).</li>
  <li>다 고쳤으면 그 버전의 <b>[예정으로 정하기]</b> → 시작 날짜를 고르면, 그날부터 그 버전이 <b>지금 시간표</b>로 바뀌어요. 선생님 화면도 그날 저절로 바뀌어요(PC가 꺼져 있어도).</li>
  <li><b>선생님들께 미리 보여 주기(공개)</b>를 켜면 브라우저 시간표 위에 "○/○부터 시간표가 바뀌어요 [미리 보기]"가 생겨요. 확정 전엔 꺼 두세요.</li>
  <li><b>[바뀌는 점]</b>을 누르면 지금 시간표와 비교해 새로 생기는 반·없어지는 반·시간이 바뀌는 반·들어오고 빠지는 학생을 보여 줘요.</li>
  <li>날짜를 기다리지 않고 바로 바꾸려면 <b>[지금 시간표로]</b>(수정 모드) → [적용]. 버전 고르기(위쪽 시간표 칸)는 이 PC에서 보는 것만 바뀌어요.</li></ul>`},
 {id:'pdf',t:'PDF 인쇄',b:`<ul><li>지점 시간표 <b>[지점 시간표 PDF]</b>(A3), 강사 버튼·학생별 탭의 <b>[이 강사/학생 PDF]</b>, <b>[전체 PDF]</b>. PDF 폴더에 저장돼요.</li><li>특강 기간이면 특강도 같이 나와요.</li></ul>`},
 {id:'phone',t:'폰으로 보기 (브라우저 시간표)',b:`
  <ul><li><b>지점 관리자</b>는 [설정 → 폰으로 보기]에서 QR·<b>[주소 복사]</b>·<b>[안내문 복사]</b>로 선생님들께 알려 주면 돼요. 아래 설정은 프로그램 관리자가 해요.</li>
  <li><b>[프로그램 관리]</b> 탭: 프로그램 관리자만 쓰는 것(지점 만들기·삭제, 강사용 모든 지점 보기, 지점 연동 관리·지점 코드·관리자 잠금, 폰으로 보기 연결, 보강 등록 키, 백업 불러오기·전체 초기화)이 모여 있어요. 관리자 모드를 열면 이 탭이 생기고 바로 이동해요. 잠그면 탭이 사라져요. 지점장 PC에는 없어요.</li>
  <li><b>인터넷(GitHub)으로 올리기</b>를 켜면 [적용]할 때마다 올라가서 어디서나 폰으로 봐요. 나온 <b>QR/주소</b>를 선생님들께 주세요. 시간표는 지점마다 따로 암호화되고, 선생님 개인 로그인 코드로 이름 있는 지점만 열려요.</li>
  <li>폰 화면 (<b>화면 어디서나</b> 손가락으로 옆으로 밀면 내용이 손가락을 따라오다 옆 탭으로 넘어가요 — 조금만 밀면 제자리. 전체 표를 확대한 동안엔 표 이동이 먼저 — 표 끝에 닿은 채로 한 번 더 밀면 옆 탭): <b>전체</b>(프로그램 첫 화면처럼 지점 시간표 전체 표 · 표 위 강사 버튼으로 <b>모든 강사 / 내 시간표 / 특정 강사</b>만 · 반 카드엔 인원수만, <b>카드를 누르면 학생 이름</b> · [학생 이름 모두 보기] 스위치 · 폰에선 처음에 표 전체가 한 화면에 들어오고 표 칸 안에서 지도처럼 두 손가락으로 확대·한 손가락으로 끌기·두 번 톡 확대(위쪽 바는 그대로), 맨 위 <b>[−][+]</b>로 글씨(전체 표에선 표) 크기, <b>↔</b>로 폭에 맞춰 처음 크기, <b>↻</b>로 가로·세로 보기 · 가로로 돌리면 위쪽 바가 한 줄로 얇아지고 <b>▲</b>로 숨기기, <b>▼ 메뉴</b>로 다시 보이기, 맨 위 [−][+]로 표 크기) · <b>오늘</b>(처음 한 번 <b>지점 → 이름</b> 순서로 고르면 <b>내 수업</b>이 맨 위, 지금·다음 표시) · 요일별 · 강사별 · <b>학생</b>(이름으로 찾으면 학교·학년·연락처·듣는 반이 한 장에). 1분마다 새로 받아요.</li>
  <li>위쪽 <b>− / +</b>: 전체 표에선 표 확대·축소, 다른 탭에선 <b>화면 전체</b>(글자·카드·여백)가 같은 비율로 85~145%. PC(강사용 PC 프로그램·브라우저)에선 <b>Ctrl + 마우스 휠</b>, <b>Ctrl + + / − / 0</b>.</li>
  <li>폰에서 <b>카드를 꾹 누르고 있으면</b>(0.4초) 그 수업이 크게 떠요 — 반 이름·선생님·요일·교시·시간·학생 이름 전체·연결된 보강 메모·당일 변경. 손을 떼면 사라져요. <b>누른 채로 손가락을 학생 이름 위로 옮겨 떼면</b> 그 학생 카드(학교·학년·연락처·듣는 반)가 떠서 [닫기]를 누를 때까지 그대로 있어요. 길게 눌러도 글자 선택이나 복사 메뉴는 안 떠요.</li>
  <li>폰 화면 아래 빈 곳: <b>학원 공지</b>(있을 때만)와 <b>내 메모</b>. 내 메모는 그 폰에만 저장되는 개인 메모예요(+ 추가 · 동그라미를 누르면 다 한 것 · 글을 누르면 고치기·지우기). 전체 표를 확대하면 슬며시 숨었다가 처음 크기로 오면 다시 보여요.</li>
  <li>폰 화면 맨 아래엔 하루 한 줄 응원 문장이 떠요 — 수업 전·중·뒤·쉬는 날·요일·방학에 맞춰 고르고, 같은 날엔 같은 문장, 선생님마다 달라요. [설정 → 선생님 공지]에서 <b>시험 기간</b>을 정하면 그동안은 시험 기간 문장이 나와요.</li>
  <li><b>선생님 공지</b>는 [설정 → 선생님 공지]에서 지점마다 써요. 언제까지 보일지 날짜를 정하면 그 날이 지나면 폰에서 저절로 사라지고, [내리기](두 번)로 바로 내릴 수도 있어요. 수정 모드 없이 바로 저장되고 1~2분 뒤 선생님 폰에 보여요.</li>
  <li>폰에서 열면 <b>이 폰에 저장해 둔 시간표가 바로</b> 뜨고 새 것은 뒤에서 조용히 받아 바뀐 것만 바꿔요. 화면 맨 위에서 <b>아래로 당기면</b> 점 하나가 내려와 돌면서 새로 받아요(페이지를 다시 읽지 않아요). 시간표가 바뀌면 <b>"시간표가 바뀌었어요"</b> 한 줄과 함께 바뀐 카드가 잠깐 빛나요(지금 보는 지점만).</li>
  <li><b>오늘</b> 탭의 내 수업엔 <b>지금 · n분 남음</b>, <b>다음 · n분 뒤</b>가 붙고 지금 수업 카드 아래엔 남은 시간만큼 줄어드는 가는 선이 있어요. <b>전체</b> 표의 오늘 칸엔 달력처럼 <b>지금 시각 선</b>이 1분마다 내려가요.</li>
  <li><b>전체</b> 표에서 <b>강사 이름(열 머리)을 톡</b> 누르면 그 열이 가운데로 크게, <b>요일 머리</b>를 누르면 그 요일이 화면 폭에 맞게 확대돼요. 같은 곳을 다시 누르면 처음 크기. 메모·등록 창은 위 손잡이를 잡고 <b>아래로 끌어</b> 닫을 수도 있어요. 지점은 위쪽 <b>지점 버튼</b>을 누르면 아래에서 고르는 창이 떠요.</li>
  <li>번호는 기기마다 <b>한 번만</b> 넣으면 돼요. 폰에 뜨는 안내대로 <b>홈 화면에 추가</b>하면 앱처럼 열려요. (카톡으로 받은 주소는 다른 브라우저로 연 뒤 추가)</li>
  <li><b>PC 브라우저</b>로 같은 주소를 열면 위쪽 <b>지점 버튼</b>으로 지점을 바꿔 가며 설치 없이 프로그램처럼 <b>지점 시간표 전체 격자</b>로 보여요. 강사별·학생 찾기도 주간 격자, [인쇄]도 돼요. 크기는 오른쪽 아래 <b>[작게]·[크게]·[화면에 맞춤]</b> 버튼(또는 Ctrl+마우스 휠)으로 바꿔요. 처음엔 화면 폭에 자동으로 맞춰져요.</li>
  <li>선생님이 <b>전체 → 내 시간표</b>에서 빈 칸을 누르면 보강을 등록할 수 있어요(횟수 선택). <a data-help="noterq">선생님 보강 등록</a> 참고.</li>
  <li>GitHub 연결 키는 만료 14일 전부터 위쪽 노란 띠로 알려 줘요. 새 키를 넣으면 지점 PC들은 자동으로 따라와요.</li></ul>`},
 {id:'sync',t:'지점 연동 (여러 PC)',b:`
  <ul><li><b>프로그램 관리자</b>: [설정 → 지점 연동 → 프로그램 관리자 모드 켜기] → 지점마다 <b>[코드 만들기]</b> → 지점 관리자에게 설치파일 + 코드를 1:1로.</li>
  <li><b>지점 관리자</b>: 설치 → 첫 화면 [지점 코드로 연결] → 코드와 이름 넣기. 자기 지점은 프로그램 관리자와 같은 권한으로 고치고, 다른 지점은 보기만.</li>
  <li><b>먼저 수정 모드를 켠 사람만</b> 그 지점을 고쳐요(위쪽 "🔒 ○○ 수정 중"). [적용]하면 다른 PC로 올라가고 잠금이 풀려요.</li>
  <li>다른 PC는 2분마다, 창으로 돌아올 때, 수정 모드를 켤 때 새로 받아요.</li>
  <li>겹쳐서 고친 경우 [적용] 때 [상대 것 받기 / 내 수정으로 덮어쓰기]를 물어봐요. 버리는 쪽은 백업에 남아요.</li>
  <li>인터넷이 끊겨도 고치고 적용할 수 있어요. 연결되면 자동으로 올라가요("⏳ 올리기 대기").</li>
  <li>프로그램 관리자는 관리자 모드에서 [지점 연동] 표의 <b>[잠금 풀기]</b>로 퇴근하며 남겨 둔 잠금을 풀 수 있어요. 그 PC에서 고치던 초안은 올라가지 못해요.</li>
  <li><b>연결된 PC</b> 목록에서 PC마다 <b>[연결 끊기]</b>를 할 수 있어요(PC 교체·퇴사·코드를 잘못 넣은 경우). 지점 PC에는 스스로 끊는 버튼이 없어요. 30일 넘게 안 켜진 PC는 목록에 표시돼요.</li>
  <li>관리자 PC를 하나 더 두거나 인수인계할 때는 <b>[프로그램 관리자 다른 PC용 코드]</b>로 연결해요. 번호·보강 등록 키·업데이트 권한까지 그대로 넘어가요. 이 코드는 절대 다른 사람에게 주지 마세요.</li></ul>`},
 {id:'update',t:'업데이트',b:`<ul><li>프로그램 관리자 PC에 새 버전이 들어가면, 연동된 지점 PC들이 2분 안에 자동으로 받아요. 본체가 바뀐 업데이트는 위쪽 [지금 다시 시작]을 눌러요.</li><li>업데이트는 프로그램 관리자 PC의 서명이 맞을 때만 받아요.</li><li>관리자 PC가 내 지점 모드로 잠겨 있어도 업데이트는 그대로 보내요. 관리자 PC가 켜져 있어야 보내져요.</li><li>다른 PC가 <b>수정 중이거나 창을 열어 둔 채</b> 새 버전을 받으면 화면을 바로 바꾸지 않고 위에 <b>"새 버전이 준비됐어요"</b> 띠만 띄워요. [적용]·[버리기]로 수정을 끝내거나 창을 닫으면 저절로 바뀌고, [지금 바꾸기]를 눌러도 초안은 그대로 남아요.</li></ul>`},
 {id:'keys',t:'단축키',b:`<table class="tbl" style="max-width:520px"><tbody>
  <tr><td><b>Ctrl + 휠 / Ctrl ± / Ctrl 0</b></td><td>시간표 카드 크기</td></tr><tr><td><b>Ctrl + Z / Ctrl + Y</b></td><td>되돌리기 / 다시하기 (수정 모드)</td></tr>
  <tr><td><b>Delete / Shift + Delete</b></td><td>선택한 카드: 반 전체 / 이 수업만 휴지통</td></tr><tr><td><b>Esc</b></td><td>창 닫기 · 도움말 닫기 · 선택 해제</td></tr>
  <tr><td><b>F1</b></td><td>도움말 열기 / 닫기</td></tr><tr><td><b>F11</b></td><td>전체 화면</td></tr><tr><td><b>제목 줄 더블클릭</b></td><td>최대화 / 원래 크기</td></tr></tbody></table>`},
 {id:'faq',t:'자주 묻는 것 · 문제 해결',b:`
  <ul><li><b>고쳐지지 않아요</b> → 보기 모드예요. 위쪽 스위치를 켜세요. 연동 중이면 다른 사람이 수정 중인지(🔒) 확인.</li>
  <li><b>다른 지점은 왜 못 고치나요</b> → 지점 관리자는 자기 지점만 고칠 수 있어요. 관리자 PC라면 지점 모드로 잠겨 있는 거예요 → [설정] 맨 위 <b>[관리자 모드]</b>.</li>
  <li><b>선생님 보강 등록이 안 와요</b> → [설정 → 선생님 보강 등록]이 켜져 있는지, 선생님이 <b>내 이름</b>을 골라 '내 시간표'에서 빈 칸을 눌렀는지 확인.</li>
  <li><b>'이 PC의 연결이 끊겼어요'가 떠요</b> → 프로그램 관리자가 끊은 거예요. 새 지점 코드를 받아 다시 연결하세요.</li>
  <li><b>폰에서 번호가 틀리다고 나와요</b> → 프로그램 관리자가 번호를 바꿨을 수 있어요. 새 번호를 받아 넣으세요.</li>
  <li><b>연동 오류</b>가 떠요 → 인터넷 연결 확인. 계속되면 [설정 → 지점 연동 → 지금 받기]를 눌러 오류 문구를 프로그램 관리자에게 보내 주세요.</li>
  <li><b>잘못 적용했어요</b> → [버전 관리 → 적용 기록]에서 그 전 시간표로 되돌리기.</li></ul>`}
];
const helpVisible=()=>HELP.filter(s=>!(s.owner&&!isOwner()));
function helpClose(){UI.view=UI.helpFrom&&UI.helpFrom!=='help'?UI.helpFrom:'grid';UI.helpQ='';render()}
function viewHelp(){const list=helpVisible();const q=(UI.helpQ||'').trim();
  const shown=q?list.filter(s=>(s.t+s.b.replace(/<[^>]+>/g,'')).includes(q)):list;
  return `<div class="card-h"><h2>도움말</h2><span class="hint">Y-MATH 시간표 ${APPVER} · F1로 열고 닫아요</span><span class="sp"></span><input id="helpQ" placeholder="찾기 (예: 특강, 휴지통)" value="${esc(UI.helpQ||'')}" style="width:220px" autocomplete="off"><button class="btn helpx" data-act="helpClose" title="도움말 닫기 (Esc · F1)">닫기 <kbd>Esc</kbd></button></div>
  <div class="helpw"><nav class="helptoc">${list.map(s=>`<button data-help="${s.id}">${esc(s.t)}</button>`).join('')}</nav>
  <div class="helpbody" id="helpBody">${shown.length?shown.map(s=>`<section id="help-${s.id}"><h3>${esc(s.t)}</h3>${s.b}</section>`).join(''):'<div class="empty">찾는 내용이 없어요</div>'}</div></div>`}
function helpGo(id){if(UI.view!=='help'){UI.view='help';UI.helpQ='';render()}const el=document.getElementById('help-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
</script>
</body>
</html>
