  <li><b>[학생 관리] → 재학생명부 가져오기</b>(또는 에듀OK에서 받기)로 학생을 넣어요.</li>
  <li>시간표는 <b>[시트 시간표 가져오기]</b>(구글 시트 .xlsx)나 <b>[주간 시간표 가져오기]</b>(관리 프로그램 .xls)로 한 번에 만들거나, 수정 모드에서 반을 만들어 끌어 놓아요.</li>
  <li>지점장 PC·행정 PC는 부원장님께 받은 <b>연결 코드</b>로 연결하면 학원 시간표가 그대로 들어와요. <a data-help="sync">지점 연동</a> 참고.</li></ol>`},
 {id:'view',t:'시간표 보기',b:`
  <ul><li>위쪽 <b>[전체 | 강사 이름]</b> 버튼으로 지점 전체 또는 한 강사의 주간 시간표를 봐요.</li>
  <li><b>[－ ％ ＋]</b>나 <b>Ctrl + 마우스 휠</b>로 크게 하면 칸·글자가 같은 비율로 커지고, 125%를 지나면 학생 이름이 서서히 펼쳐져요. 휠 한 칸은 5%, 버튼 한 번은 10%씩 바뀌고, 굴리는 동안 부드럽게 커지다가 손을 멈추면 그 크기로 자리 잡아요. <b>마우스 쪽을 중심으로</b> 커지고 작아져요 — 창 왼쪽에서 하면 조금 더 왼쪽, 오른쪽에서 하면 조금 더 오른쪽(위아래도 마찬가지)이 제자리라 보던 곳을 놓치지 않아요(버튼·Ctrl ±는 화면 가운데 기준). 노트북 터치패드는 두 손가락을 벌리고 모으면 돼요. 화면보다 넓어지면 시간표 칸 안에서 좌우로 밀어 봐요(Shift + 휠). <b>학생 이름</b> 스위치로 직접 켜고 끌 수도 있어요. 스위치 옆 <b>[자동]</b>을 누르면 <b>[직접]</b>으로 바뀌어, 확대해도 이름이 저절로 켜지거나 꺼지지 않고 스위치로만 바뀌어요(이 PC에 기억 · 다시 누르면 자동).</li>
  <li>카드를 누르면 옆에 <b>명단 창</b>이 열리고, 오른쪽 아래 <b>선택한 항목</b>에 자세한 내용이 나와요.</li>
  ${HF('detail','카드를 누르면 명단 창 — 학생 이름, 당일 변경, (수정 모드면) 학생 넣기')}
  <li>한 학생은 <b>학생별</b> 탭에서 주간 시간표를 봐요. [찾기] 칸에 이름을 치면 돼요.</li>
  <li>아래 <b>자동 점검</b>에 겹침·빠진 수업·연강 아님 같은 문제가 떠요. 누르면 해당 카드가 강조돼요. 규칙은 경고일 뿐이라 예외는 그대로 둬도 돼요.</li>
  <li>시간표 말고도 챙길 일이 같이 떠요 — 누르면 그 화면으로 가요: <b>시험일 없는 학교</b>(이번 학기 기말 일정 없음) · <b>시험 범위 비어 있음</b>(3주 안 시험) · <b>선택과목 미정</b>(고2·3) · <b>상담 전 신입</b>(첫 수업 2주 지남) · <b>확정 점수 빠짐</b>(시험 끝나고 2주) · <b>기한 지난 업무</b> · <b>입학 문의 1주 지남</b> · <b>연락처 없음</b>.</li>
  <li>위쪽 <b>다가오는 시험</b> 띠에 학생들 학교의 다음 시험이 D-day로 떠요(<a data-help="school">학교 정보</a>). <b>D-day는 수학 시험일 기준</b>이에요 — 학사일정에 수학 시험일이 없으면 시험 첫날 기준으로 세고 <b>'수학일 미정'</b> 경고가 붙어요(띠 머리에 몇 곳인지도). 시험이 시작됐어도 수학 전이면 '수학 D-2', 그날은 '오늘 수학'. 선생님 폰도 같아요. 띠가 거슬리면 <b>'다가오는 시험'</b> 글자를 눌러 접어요 — 접으면 가장 가까운 시험 한 줄('분포중 D-6 외 2곳')만 남고, 다시 누르면 펼쳐져요(PC·폰 모두 그 기기에 기억). 폰에서 시험이 많아 줄이 옆으로 넘치면 그 줄을 밀어 넘겨 보면 돼요(탭은 안 넘어가요). 시험 기간 동안은 '시험 중', 마지막 날엔 '오늘 끝', 끝나는 날이 지나면 띠에서 빠져요(폰도 같아요).</li></ul>`},
 {id:'other',t:'다른 지점 보기',b:`
  <ul><li><b>지점장 PC·행정 PC</b>에서 위쪽 지점을 다른 지점으로 바꾸면 <b>지점 시간표·학생별·반 관리</b>만 참고용으로 보여요. 학생 관리·강사 관리·성적 탭과 학생 카드는 안 보여요 — 지점끼리 협조할 때 시간표만 참고하라는 뜻이에요.</li>
  ${HF('vo','다른 지점을 고르면 맨 위에 "참고용으로 시간표만" 줄이 뜨고 탭이 줄어요')}
  <li>학교 정보·업무는 모든 지점이 같이 쓰는 자료라 어느 지점을 보든 그대로예요.</li>
  <li>폰도 같아요 — 지점장·행정은 다른 지점 <b>전체 시간표만</b>, 선생님은 이름 있는 지점만. 두 지점에 이름이 있고 한쪽에서만 지점장이면 다른 쪽에선 선생님으로 보여요.</li></ul>`},
 {id:'edit',t:'수정 모드 · 적용 · 보관',b:`
  ${HF('edit','위쪽 보기·수정 스위치를 켜면 초안에서 고쳐요 — 다 고치면 [적용]')}
  <ul><li>스위치를 켜면 원본을 자동 백업하고 <b>초안</b>에서 고쳐요. 고치는 동안 다른 PC·폰에는 안 보여요.</li>
  <li><b>[적용]</b> = 원본에 반영 (적용 전 시간표는 [보관함 → 적용 기록]에 남아 언제든 되돌릴 수 있어요)</li>
  <li><b>[보관]</b> = 초안을 그대로 두고 나가기. 며칠 고민하다 스위치를 다시 켜면 이어서 고쳐요.</li>
  <li><b>[버리기]</b> = 초안을 지우고 원본으로.</li>
  <li><b>되돌리기 Ctrl+Z / 다시하기 Ctrl+Y</b></li>
  <li>한 지점은 한 PC만 수정 모드로 고칠 수 있어요(잠금). 다른 PC가 고치다 꺼져 잠겨 있으면, 지점장 PC(자기 지점)에서 수정 모드를 켤 때 뜨는 <b>[잠금 풀고 고치기]</b>로 풀어요.</li></ul>`},
 {id:'move',t:'반 카드 옮기기',b:`
  <ul><li>카드는 <b>끌어서만</b> 옮겨져요 (누르기만 해서는 안 옮겨져요). 끄는 동안 <b>초록 점</b> = 추천 칸(연강 맞음), <b>겹침</b> = 학생이 겹치는 칸.</li>
  <li>수업이 있는 칸에 놓으면 <b>[겹쳐 넣기 / 자리 바꾸기]</b>를 골라요. 다른 강사 칸에 놓으면 담당 강사가 바뀌어요.</li>
  <li><b>Ctrl을 누른 채 끌어 놓으면 새 반으로 복사</b>돼요(칸에 "+ 새 반"이 떠요). 같은 색으로 "○○ 보충" 반이 생기고 놓은 칸에 수업이 하나 들어가요. 창에서 <b>빼고 싶은 학생만 체크를 끄면</b> 그 학생은 원래 반에만 남아요 — 예: 중1 A2 목요일 뒷타임을 따로 만들고 중2 수업 듣는 친구는 빼기. 원래 반은 그대로, 나중에 원래 반에 새 학생이 오면 보충 반에도 넣어 주세요.</li>
  <li>오른쪽 <b>보관함</b>: 아직 안 놓은 수업(주당 횟수보다 적을 때)이 대기해요. 카드를 여기로 끌면 시간표에서 빠져요. <b>[+ 새 반]</b>으로 반을 만들어요.</li>
  <li><b>휴지통</b>에 놓으면 [반 전체 / 이 수업만]을 골라 지워요. 휴지통에서 되살릴 수 있어요.</li>
  <li><b>[자동 배치]</b>: 고른 반을 학생 겹침·선호 시간·연강을 따져 여러 안으로 배치해 보여 줘요(AI 없이 계산). 미리 보고 마음에 드는 안만 적용해요.</li>
  <li><b>[색 랜덤]</b>: 반 색을 다시 섞어요. 붙어 있는 반끼리는 구분되는 색으로.</li></ul>`},
 {id:'stu',t:'반에 학생 넣기 · 옮기기',b:`
  <ul><li>수정 모드에서 카드(또는 명단 창)의 <b>이름을 끌어 다른 카드에</b> 놓으면 [반 전체 옮기기 / 이 수업만 / 복사]를 골라요. 이름 위의 <b>×</b>를 누르면 그 반에서 빠져요.</li>
  <li>카드를 누르면 명단 창 아래 <b>[+ 학생 넣기 · 신입 등록]</b>. 있는 학생은 이름을 고르면 바로 들어가고, 처음 보는 이름이면 <b>신입</b>으로 등록돼요. 학교·학년은 나중에 자동 점검의 <b>'신입 정보'</b>를 눌러 넣어도 돼요.</li>
  ${HF('qa','학생 넣기 · 신입 등록 창 — 이름을 치면 비슷한 학생이 떠요')}
  <li>보기 모드에서도(지점장·행정 PC) 카드의 [+ 학생 넣기]와 × 두 번으로 바로 넣고 빼요.</li>
  <li><b>예정 시간표 같이 고치기</b>: 바뀔 예정 시간표가 있을 때 지금 시간표에서 학생을 넣거나 빼면, 예정 시간표의 <b>같은 이름 반</b>에도 똑같이 들어가요.</li></ul>`},
 {id:'student',t:'학생별 · 시간 조건 · 문자용 복사',b:`
  ${HF('student','학생별 — 그 학생 주간 시간표와 수강 반 · [시간 조건] · [문자용 복사]')}
  <ul><li><b>수강 반</b> 줄에서 × 빼기, [반에 넣기…]가 돼요.</li>
  <li><b>[시간 조건]</b>: 요일·교시 칸마다 <b>보통 → 선호 → 수업 불가</b>. 행정 선생님 PC에서도 칸을 눌러 고친 뒤 <b>[저장]</b>. 불가 시간에 수업이 있으면 자동 점검에 오류로 떠요.</li>
  ${HF('avail','시간 조건 — 칸을 누를 때마다 보통 → 선호 → 불가')}
  <li><b>[문자용 복사]</b>: 이름 없이 <i>월·수 17:00~18:30 중1 A1 (서성완T)</i>처럼 요일·시간·반만 글로 복사돼요 — 문자·카톡에 붙여 넣으면 돼요. 폰에서는 학생 카드 아래 <b>[시간표 복사]</b>.</li></ul>`},
 {id:'students',t:'학생 관리 (상태 · 연락처 · 신입 · 퇴원)',b:`
  ${HF('students','학생 관리 — 맨 위 입학 문의·신입, 정기 상담, 아래 학생 목록')}
  <ul><li>칸 제목(입학 문의, 정기 상담, 학생 목록 등)을 누르면 접히고 펼쳐져요. 이 PC에서 접어 둔 칸은 다음에도 접힌 채로. 학생 목록은 화면 전체와 같이 굴러가고, 내려가도 맨 위 제목 줄(이름·학교·학년…)이 붙어 있어요.</li>
  <li><b>상태</b>를 누르면 재원·휴원·<b>입학 예정</b>(첫 수업일)·<b>퇴원</b>(퇴원일)을 골라요(보기 모드에서도 바로 저장). 입학 예정은 첫 수업일이 되면 저절로 재원이 되고 <b>2주 동안 '신입'</b> 표시가 붙어요.</li>
  <li><b>학생 줄</b>(이름이든 학교·반 칸이든)을 누르면 <b>학생 정보 창</b>이 떠요 — 상태·연락처·시간 조건·삭제 버튼은 원래대로 — 수강 반과 요일·교시·시간(주 몇 회 · 특강 · 명부 반), 연락처([고치기]), 다음 시험(수학 시험일 기준 D-day · 그 학생 과목의 범위 · 출제 참고사항 · [학교 정보]로 바로), <b>선택과목</b>(고등 · 눌러서 바로 켜고 끄기 · <b>[학교 정보에서 보기]</b>를 누르면 학교 정보의 선택과목 표로 가서 그 학생 줄을 잠깐 표시), 상담(최근 기록 · [상담 완료·기록]), 특이사항, 성적 흐름·자체시험. 상태나 첫 수업일은 창 위 <b>[상태·정보 고치기]</b>(또는 상태 칸)를 눌러 학생 카드에서.</li>
  <li>학생 정보 창의 칸(수강 반·연락처·시험·선택과목·상담·성적…)은 <b>제목 줄을 눌러 각각 접고 펼쳐요</b>. 접어 둔 칸은 이 PC에서 다른 학생을 열어도 접힌 채로 보여요.</li>
  ${HF('stinfo','학생 이름을 누르면 학생 정보 창 — 반·시간, 연락처, 시험, 선택과목, 상담, 성적')}
  ${HF('stdlg','[상태·정보 고치기] — 학생 카드: 상태, 성적 흐름, 특이사항(PC에만)')}
  <li><b>연락처</b> 칸을 누르면 학생·학부모(3명까지) 번호를 넣어요. 재학생명부를 가져오면 명부의 연락처 칸을 알아서 읽어요.</li>
  <li><b>주요 학생 ★</b>: 상태 창에서 켜면 이름 앞에 ★(선생님 폰에도). 정기 상담의 주요 학생 주기로 따로 챙겨요.</li>
  <li><b>퇴원</b>하면 지금·예정 시간표의 모든 반과 특강 명단에서 빠지고, 학생은 '퇴원'으로 남아요(목록 필터 '퇴원'). 성적·상담 기록은 그대로 남아요.</li>
  <li><b>재입학</b>: 퇴원한 학생과 이름+학교(또는 보호자 번호)가 같은 학생을 넣으면 먼저 <b>'퇴원했던 학생과 같은 학생인가요?'</b>를 물어요. [같은 학생 · 기록 잇기]면 그 학생을 되살려 기록이 이어지고 '재' 표시가 붙어요. 명부 가져오기는 한 창에서 여러 명을 한 명씩 골라요.</li>
  ${HF('revive','재입학 확인 창 — 남은 성적·상담 기록 수가 보여요')}
  <li><b>[학년 올리기]</b>: 새 학년 때 한 번 — 몇 명이 어떻게 바뀌는지 표로 먼저 보여 주고, 실수했으면 [학년 되돌리기](두 번).</li>
  <li><b>명부 입학일</b>: 재학생명부의 입학일이 첫 수업일로 들어가요(2주 신입·입학 예정 다시 계산).</li></ul>`},
 {id:'inq',t:'입학 문의',b:`
  ${HF('inq','입학 문의 — 줄마다 [입학 예정으로]·[바로 재원]·[입학취소], 아래 메모')}
  <ul><li>[학생 관리] 맨 위 칸. <b>입학희망생명부</b> 엑셀을 [입학희망생명부 불러오기](또는 에듀OK에서 받기)로 넣으면 <b>어느 지점에 넣을지 한 번 확인</b>하고 들어가요. 같은 사람(이름이 같고 학교나 연락처가 같음 · 에듀OK에서 '대연고1' 같은 임시 이름이 실제 이름으로 바뀌어도 연락처·학교가 같으면 같은 사람)은 다시 안 넣고 <b>바뀐 정보(학교·학년·희망일·연락처)만 덮어써요</b> — 형제는 보호자 번호가 같아도 이름이 달라 따로 들어가요.</li>
  <li>다시 불러올 때 <b>에듀OK에서 빠진 사람</b>(입학 처리·취소 등)은 확인 창에 따로 보여 주고, 체크된 채로 반영하면 <b>입학취소</b>로 옮겨요(취소된 문의에 '에듀OK에서 빠짐' 표시 · 되돌리기 가능). 명부를 기간·조건으로 걸러 받았으면 체크를 풀어요. 직접 넣은 문의는 해당 없어요.</li>
  <li>이미 학생이 된 문의(입학희망생·재학생명부를 불러올 때 같은 사람이 학생 관리에 있으면)는 저절로 <b>입학 완료</b>로 옮겨요.</li>
  <li><b>[입학 예정으로]</b> = 첫 수업일을 골라 입학 예정 학생으로 · 반도 <b>여러 개</b> 골라 한 번에 넣어요(PC·폰 관리 탭 · 폰 [+ 학생]도 · 학생 학년에 맞는 반이 먼저 보이고 나머지는 [더 보기]) · 첫 수업일이 <b>오늘이거나 지난 날</b>이면 그날부터 재원(입학일 = 첫 수업일) · <b>[바로 재원]</b> = 작은 창에서 [재원으로] → 오늘부터 재원(연락처 그대로 · <b>소개</b> 칸도 있어요) · <b>[입학취소]</b>(두 번) = '취소된 문의'로, [되돌리기]도 돼요.</li>
  <li><b>메모</b>: 통화 내용·약속을 줄 아래 칸에 적고 [남기기](또는 Enter). ×를 두 번 누르면 지워져요. 폰 [관리] 탭의 입학 문의 카드에서도 같은 메모를 보고 남겨요.</li>
  <li>지점장·행정 PC에서만 보이고 선생님 폰에는 안 나가요.</li></ul>`},
 {id:'msh',t:'메모 시트 (지점장·행정)',b:`
  ${HF('msh','메모 시트 — 엑셀처럼 칸에 바로 적는 표')}
  <ul><li>[업무] 화면 위 <b>[메모 시트]</b>. 행정·지점장이 잠깐 쓰는 표(교재 주문, 특강 신청, 정산 메모 같은 것)를 엑셀처럼 적어 둬요. <b>지점마다 따로</b>이고, 그 지점 지점장·행정 PC(와 관리자 PC)에서 같이 보고 고쳐요. 폰으로는 안 나가요.</li>
  <li><b>적기</b>: 칸을 누르고 바로 입력(한글도) · <b>Enter</b> 아래로 · <b>Tab</b> 옆으로 · 방향키로 움직이기 · 두 번 누르거나 <b>F2</b>로 있던 글 고치기 · <b>Delete</b> 비우기 · <b>Esc</b> 입력 취소. 엑셀·구글 시트에서 여러 칸을 복사해 <b>Ctrl+V</b>로 한 번에 붙여넣어요.</li>
  <li><b>[+ 행]·[+ 열]</b>, 고른 칸의 <b>[행 지우기]·[열 지우기]</b>, 열 머리 오른쪽 끝을 끌어 너비 조절. 시트 이름은 위 이름 칸에서 바꿔요.</li>
  <li><b>[+ 새 시트]</b>로 여러 개 만들고 위 탭으로 오가요. <b>[엑셀 불러오기]</b>는 .xlsx의 보이는 시트마다 새 시트로 가져와요(최대 500행 × 40열). <b>[시트 지우기]</b>는 두 번.</li>
  <li>적은 내용은 잠깐 모았다가 저절로 저장·공유돼요. 프로그램 자료(학생·성적 등)에는 영향을 주지 않는 메모용이에요.</li></ul>`},
 {id:'refs',t:'소개비 (지점장·행정)',b:`
  ${HF('refs','소개비 — 소개로 들어온 신입과 소개해 준 학생 · 미지급/지급 완료')}
  <ul><li>[학생 관리]의 <b>소개비</b> 칸. 소개로 들어온 신입마다 <b>소개해 준 학생</b>과 <b>지급 여부</b>를 적어 둬요. 제목 옆 <b>[미지급 n명]</b>이 아직 안 준 사람 수예요.</li>
  <li><b>넣는 법</b>: ① 학생 추가 줄의 <b>소개(선택)</b> 칸에 소개해 준 학생 이름 ② 입학 문의 [입학 예정으로]·[바로 재원] 창의 <b>소개</b> 칸 ③ 소개비 칸의 <b>[+ 소개 추가]</b>로 신입과 소개한 사람을 골라서. 학생 이름이면 학교·학년이 같이 보이고, 학생이 아니어도(학부모 등) 이름만 써서 넣을 수 있어요.</li>
  <li>들어오면 바로 <b>미지급</b>이에요. 아직 첫 수업 전(입학 예정)이면 '입학 전'으로 보이고 미지급 수에는 안 세요.</li>
  <li><b>[지급 완료]</b>를 누르면 오늘 날짜로 체크되고, 날짜 칸에서 지급일을 고칠 수 있어요. 잘못 눌렀으면 [되돌리기], 기록을 지우려면 ×를 두 번. 지급한 지 석 달 지난 기록은 아래로 접혀요.</li>
  <li><b>명단 창</b>: [업무] 화면 위 <b>[소개비]</b> 버튼(숫자 = 미지급 수)을 누르면 이 지점 소개 기록 전체가 한 창에 떠요. <b>미지급 · 지급 완료 · 전체</b>로 나눠 보고, 이름·학교로 찾고, 창에서 바로 [지급 완료]·[되돌리기]·지급일 고치기·[+ 소개 추가]. 관리자 PC는 창 제목에서 지점을 바꿔 봐요.</li>
  ${HF('refdlg','소개비 명단 창 — 업무 화면 [소개비] 버튼')}
  <li><b>지급 내역</b>: 명단 창의 [지급 내역] 탭에 지급한 기록이 <b>달별로</b> 모두 남아요(지급일 · 소개해 준 사람 · 신입 · 누가 체크했는지). 학생 관리 칸에서는 석 달 지나면 접히지만 지급 내역에서는 지워지지 않아요.</li>
  ${HF('refhist','지급 내역 — 달별 · 체크한 사람')}
  <li><b>월별 신규생</b>: 명단 창의 [월별 신규생] 탭에 그달 들어온 학생(첫 수업일 기준)이 모여요. 첫 수업일이 없는 학생은 프로그램에 넣은 날로 따로 묶고('10/4 넣음'), 명부로 같은 날 한꺼번에 들어온 학생은 빼요. ‹ › 로 달을 넘기고, 소개가 있는 학생은 소개해 준 사람과 지급 여부가 같이 보여요. 줄을 누르면 <b>학생 정보 창</b>이 열려요.</li>
  <li><b>학생 정보 창의 소개 칸</b>: 최근 넉 달 안에 들어온 학생(또는 입학 예정·소개 기록이 있는 학생)은 학생 정보 창에 <b>소개</b> 칸이 있어요. 이름을 넣고 [넣기](또는 Enter) — 바꾸기·빼기도 여기서(지급 완료된 건 명단 창에서 [되돌리기] 후). 그 학생이 소개해 준 신입도 같이 보여요. 명단에서 열었으면 위의 <b>[← 소개비 명단]</b>으로 돌아가요.</li>
  ${HF('refnew','월별 신규생 — 줄을 누르면 학생 정보 창')}${HF('refsti','학생 정보 창의 소개 칸')}
  <li><b>지점장·행정 선생님(과 관리자) PC에서만</b> 보여요. 선생님 폰·지점장 폰 어디에도 안 나가요.</li></ul>`},
 {id:'cns',t:'정기 상담',b:`
  ${HF('cns','정기 상담 — 이번 기간 남은 학생, [주기]·[학년 단위]·지정 대기')}
  <ul><li>지점장이 [주기]를 정해요 — 기본 주기(매달·두 달마다) + 시험 기간마다 한 번 더. <b>시작</b> 달을 정하면 그 달부터 상담 기간이 열려요.</li>
  <li>기간이 열리면 선생님 폰 <b>학생 탭 맨 위</b>(오늘 탭에도 알림)에 담당 학생 중 아직 상담 안 한 학생이 떠요. 한 분이 [상담 완료]를 누르면 같이 가르치는 선생님 화면에서도 완료로 바뀌고 PC에 기록돼요. 학생이 많으면 <b>'정기 상담' 제목 줄을 눌러 접었다 펼쳐요</b>(폰에 기억 · 관리 탭의 지정 상담·보류 목록도 같아요).</li>
  <li>PC에서 학생 이름을 눌러 상담 완료·기록 <b>삭제</b>(두 번)·<b>보류</b>(지점장만)·<b>선생님께 보내기</b>(지정 상담 · 그 선생님 폰 맨 위에 '지정'으로 떠요)를 해요.</li>
  <li><b>상담 기간이 아닐 때 한 상담(수시 상담)</b>: 선생님 폰에서 학생을 눌러 학생 카드를 열면 <b>'상담 · 최근 날짜'</b> 칸에 [상담 완료]가 있어요(담당 학생만 · 지점장·행정은 지점 학생). PC는 학생 관리에서 학생 카드의 <b>[상담 완료·기록]</b>. 기간 중이면 그 기간 상담으로도 세요.</li>
  <li><b>보류했다가 상담한 학생</b>: 선생님 폰 정기 상담 아래 <b>'보류 n명'</b>을 펼치면 담당 학생 중 보류된 학생이 보이고, 거기서 [상담 완료]를 누르면 완료로 적히면서 <b>보류도 같이 풀려요</b>(다음 기간부터 다시 목록에 떠요 · 보류 풀기 버튼은 지점장 폰만). PC에서도 '보류 n명'에서 학생을 눌러 [상담 완료]. 잘못 눌러 폰 [되돌리기]를 하거나 PC에서 그 기록을 지우면 다시 보류로 돌아가요.</li>
  <li><b>[학년 단위]</b>: 학년 전체 보류(예: 수능 준비)·보류 풀기·학년 전체 상담 지정을 한 번에.</li>
  <li>'시험 기간' 상담은 학생마다 <b>자기 학교 시험</b> 기준으로 열려요(관리 기간 앞 14일·뒤 7일).</li></ul>`},
 {id:'teacher',t:'강사 관리 · 로그인 코드',b:`
  ${HF('teacher','강사 관리 — 휴무 요일·연락처·로그인 코드·주당 타임·오늘 수업')}
  <ul><li>강사마다 휴무 요일·선생님 연락처·<b>로그인 코드</b>를 보기 모드에서도 바로 바꿔요. 이름·순서·추가·삭제는 수정 모드에서.</li>
  <li><b>강사용 로그인</b>: [만들기] → <b>[복사]</b>로 주소와 코드를 카톡 <b>1:1</b>로 보내 주세요. 로그인하면 그 선생님 이름이 있는 지점만 보이고 담당 학생 연락처가 바로 보여요. [바꾸기]로 새 코드를 만들면 예전 코드로 로그인한 기기는 다시 로그인해야 해요. 여러 지점에 등록된 선생님 코드는 전 지점이 같아야 해서 관리자 모드에서 바꿔요 — 단, <b>지점장은 자기 PC에서 자기 코드를 바꿀 수 있어요</b>(그 PC를 연결할 때 넣은 이름이 지점장 이름과 같을 때). 자기 지점은 바로 바뀌고, 다른 지점은 부원장님 PC가 켜져 있으면 2분 안에 같은 코드로 맞춰져요. 그 사이에도 새 코드로 로그인돼요. <b>행정 선생님 PC</b>도 [강사 관리] 아래 <b>내 로그인 코드</b> 칸에서 자기 코드만 바꿀 수 있어요(다른 지점은 맞춰지기 전까지 자기 지점만 보여요). 부원장님 PC는 창이 최소화돼 있어도 2분마다 받아서 맞춰요.</li>
  <li><b>행정 선생님</b>: 아래 행정 선생님 칸에서 이름을 넣고 [추가]하면 로그인 코드가 만들어져요. 행정 선생님 폰은 소속 지점 학생·연락처 전체, 다른 지점은 시간표만. 폰을 잃어버렸으면 <b>[기기 끊기]</b>(두 번).</li>
  ${HF('staff','행정 선생님 칸 — 코드·복사·기기 끊기·PC 연결 코드')}</ul>`},
 {id:'school',t:'학교 정보 · 시험 기간',b:`
  ${HF('school','학교 정보 — 위쪽 다가오는 시험 띠와 달력, 학교 카드')}
  <ul><li>학생들이 다니는 학교가 저절로 목록에 떠요(없으면 [학교 추가]). 목록 위 <b>[우리 지점 | 전체 학교]</b>로 이 지점 학생이 있는 학교만 보거나 모든 지점 학교를 다 봐요(이 PC에 기억). 학교 목록은 카드를 아래로 내려도 왼쪽에 붙어 있어요(학교가 많으면 목록 위에서 휠). 학교를 고르면 <b>학사일정</b>(시험·방학·수련회, 수학 시험일), <b>시험 범위</b>, <b>부교재</b>, <b>등급컷</b>, <b>기출 수거</b>, 고등학교는 <b>선택과목</b>, <b>메모</b>.</li>
  <li><b>교과서</b>: 학교 카드의 '교과서' 칸에 출판사를 메모해요 — 중학교는 <b>학년마다</b>, 고등학교는 부교재처럼 <b>과목마다</b>(예: 비상(김원경)). 적은 건 학교 이름 옆 한 줄, 학생 정보 창 시험 칸(그 학생 학년·과목), 선생님 폰 학교 탭에 보여요. 학교 이름(보이는 이름)은 카드 맨 위 <b>학교 이름을 누르면</b> 바꾸거나 학생 없는 학교를 목록에서 숨겨요.</li>
  <li><b>등급컷</b>은 고등 과목마다 <b>1등급 최저 점수</b>만 적어요(선생님 폰에도 1등급만).</li>
  <li><b>선택과목</b>: 고2는 2학년 1·2학기(+2학기엔 3학년 1학기 조사), 고3은 3학년 1학기만 — 3학년 2학기는 시험이 없어 받지 않아요. 고1은 2학기에 <b>2학년 1·2학기 + 3학년 1학기</b>를 미리 조사해 두면 학년이 올라가도 그대로 이어져요.</li>
  <li><b>선택과목 미정 표시</b>: 학년 제목 옆에 지금 학기 과목을 아직 안 정한 학생 수가 <b>[3명 미정]</b>으로 떠요(다 정했으면 '모두 정함'). 누르면 그 학생 줄로 차례로 찾아가고, 미정인 학생 줄은 이름 왼쪽에 노란 선. 칸 제목과 <b>기출 수거</b> 제목에도 '고2 3명 미정'처럼 같이 보여요(고1 2·3학년 과목 미리 조사는 꼭 채울 필요가 없어 고1 학년 제목 옆에만) — 과목 줄이 학생 선택과목으로 정해져서 빈 곳을 먼저 채우면 돼요.</li>
  ${HF('sjmiss','선택과목 — 학년별 미정 학생 수 · 미정 학생 줄 표시')}
  ${HF('card','학교 카드 — 학사일정·범위·교과서·부교재·등급컷·기출 수거·선택과목')}
  <li><b>기출 수거 — 고2·고3은 과목별</b>: 고등학교는 <b>고2·고3을 과목별 줄</b>(대수·미적1·확통 …)로 나눠 체크해요. 과목은 그 학교·학년 <b>학생들이 고른 선택과목만</b> 저절로 떠요. 학생 선택과목에 없는 과목은 표 아래 <b>[+ 고2 과목 추가]</b>로 넣고, 넣은 줄은 이름 옆 <b>×</b>(두 번)로 지워요(학생이 고른 과목·체크가 있는 과목은 안 지워져요). 과목을 하나도 모르면 학년 한 줄 + [과목별로 나누기]. 고1과 중학교는 지금처럼 학년 한 줄. 예전에 학년 하나로 체크해 둔 건 <b>'과목 미구분'</b> 줄에 남아 있다가, 그 시험에 과목을 하나라도 체크하면 그 칸이 사라지고, 다 처리되면 줄도 없어져요(기록은 지우지 않아요). 선생님 폰 학교 탭에도 과목별로 보여요.</li>
  ${HF('gotsj','기출 수거 — 고2 과목별 줄 · 과목 미구분 줄')}
  <li><b>시험 달력 · 날짜별 학생</b>: 학교 정보의 시험 달력 [날짜별 학생 · 인쇄](또는 지점 시간표 위 다가오는 시험 띠의 [시험 달력]). 날마다 <b>학교+학년(중등)</b>·<b>학교+과목(고등)</b>과 인원이 떠요. <b>학생 이름</b> 스위치를 켜면 이름이 펼쳐지고, <b>[인쇄 · PDF]</b>는 지금 보이는 대로 A4 가로 한 장. 고2·고3은 학생 카드의 선택과목 기준(안 넣었으면 과목 기본 학년), 과목별 날짜가 없는 학교는 첫날에 기간으로 보여요. 지점 학생만 나와요.</li>
  ${HF('xcal','시험 달력 — 날짜별로 누가 무슨 시험을 치는지 · 학생 이름 켬')}
  <li><b>중3 2학기 시험 따로</b>: 중학교 학사일정에 <b>2학기 시험(중3)</b> 칸이 있어요. 중3이 2학기에 시험을 한 번만 보고 1·2학년과 기간이 다르면 여기 넣어요 — 그러면 중3은 이 기간만(다음 시험 D-day·시험 달력·상담 시험 기간·다가오는 시험 띠), 1·2학년은 원래 2학기 중간·기말로 잡혀요. 범위·등급컷·성적은 '2학기 중간'에 같이 넣어요. 비워 두면 지금처럼 중3도 2학기 중간을 같이 봐요.</li>
  <li><b>학년별로 없는 시험</b>: <b>중3은 2학기 기말</b>, <b>고3은 2학기 중간·기말</b>(2학기 시험 자체)이 없어요. 학교 정보의 시험 날짜는 1·2학년 것이라 그대로 두고, 그 학년 학생만 <b>시험 달력·다가오는 시험 띠 인원·폰 다음 시험 D-day·정기 상담 시험 기간·시험 범위/등급컷/기출 수거 줄·성적 관리 명단</b>에서 빠져요. 중3만 다니는 학교의 기말은 띠·시험 기간에도 안 잡혀요.</li>
  <li><b>시험 범위</b>: 고등은 과목마다 한 줄 — 학생들 선택과목으로 저절로 생기고, 학년 아래 <b>[+ 과목 추가]</b>로 넣거나 줄 끝 <b>×</b>(두 번)로 지워요(그 과목 듣는 학생이 있으면 지울 수 없어요). [범위 넣기]에서 22개정 단원을 <b>두 번</b> 눌러 시작~끝. '소단원까지 보기'로 더 잘게, 메모·직접 쓰기도 돼요.</li>
  <li><b>출제 참고사항</b>: 범위 창 맨 아래 칸에 "도형의 방정식은 10월 모고에서, 집합·명제는 올포유에서 출제"처럼 시험마다·학년(과목)마다 적어 두면 학교 카드 범위 줄 아래 노란 띠로 보이고, <b>선생님 폰 학교 탭과 학생 카드 다음 시험</b>에도 떠요. 범위 없이 참고사항만 넣어도 돼요. (학교 메모는 지금처럼 PC에만)</li>
  ${HF('rng','범위 넣기 — 단원을 두 번 눌러 시작~끝')}
  <li><b>선택과목</b>: 고2·3 학생마다 학년·학기별 과목. 범위·성적이 이 과목으로 연결돼요. 고1은 2학기에 2학년 과목 조사(체크)만.</li>
  <li>모든 지점이 같이 쓰는 자료예요(누구나 고침 · 칸마다 마지막에 고친 게 남음). 같은 학교가 두 이름으로 잡히면 카드의 <b>[합치기]</b>.</li>
  <li><b>[시트 불러오기]</b>: 구글 시트 중등부·고등부 엑셀을 넣으면 학사일정·시험 일정·범위·부교재·등급컷·선택과목 조사표를 한 번에 읽어요. 학교 이름은 불러올 때 통일돼요(○○여자고등학교 → ○○여고, 부산중앙고 → 중앙고).</li>
  <li><b>시험 기간 자동</b>: [설정]의 시험 기간이 '학교 정보에서 자동'이면 학생들 학교 시험을 모아 <b>중등·고등 따로</b> 잡아요. 시험일은 실제 시험 치는 날만, <b>관리 기간</b>(기본 앞 14일·뒤 7일)이 정기 상담·응원·띠에 쓰여요. 달력에서 시험 기간 안의 토·일은 시험일로 안 보여요.</li></ul>`},
 {id:'grades',t:'성적 관리 · 자체시험',b:`
  ${HF('grades','성적 관리 — 시험을 고르고 예상·확정 점수를 적으면 바로 저장, 등락은 저절로')}
  <ul><li>위에서 시험(연도·학기·중간/기말)을 고르고 학생마다 <b>예상·확정</b>을 적어요(Enter·↑↓로 아래위 칸 이동). 적은 칸은 잠깐 초록 테두리로 저장된 걸 알려 주고, 저장·동기화 때 화면이 다시 그려지지 않아 계속 이어서 적으면 돼요(내신·자체시험 모두). <b>등락</b>은 같은 과목 바로 전 시험 확정 점수와 비교해 저절로, <b>등급</b>은 기말 줄에만. 2학기 중간을 고르면 <b>고3</b>, 2학기 기말을 고르면 <b>중3·고3</b>은 그 시험이 없어 명단에서 빠지고 머리글에 몇 명 뺐는지 떠요.</li>
  <li><b>줄 표시</b>: 마우스를 올린 줄은 옅게, <b>지금 점수를 적는 줄</b>은 주황빛 바탕에 이름 왼쪽 막대로 표시돼요. 한 학생이 여러 줄(과목별)이어도 그 학생 줄이 모두 같이 표시돼 줄이 헷갈리지 않아요.</li>
  <li><b>찾기</b>: 🔍 칸(<b>Ctrl+F</b>)에 이름이나 학교를 치면 그 학생만 남아요. <b>Enter</b>는 첫 점수 칸으로, <b>Esc</b>나 ×는 지우기. 자체시험 표에도 똑같이 있어요.</li>
  <li>고2·3은 선택과목마다 한 줄. 선택과목을 아직 안 정한 학생은 '과목 미정' 줄만 보이고 칸이 없어요 — 학교 정보에서 과목을 정하면 적을 수 있어요. <b>[한 줄로]</b>를 누르면 한 학생이 한 줄로 묶여요.</li>
  <li>아래 <b>성적 통계</b>: 반별·학교별·선생님별 평균·등락·상승/하락.</li>
  <li>이름을 누르면 학생 카드에 <b>성적 흐름</b>·<b>자체시험</b>·<b>특이사항</b>(PC에만).</li>
  ${HF('stcard','학생 카드 — 성적 흐름과 특이사항')}
  <li>성적은 <b>잠금 없는 공유 자료</b>라 수정 모드 없이 바로 저장되고 다른 PC에 곧 보여요. 지점장·행정 PC는 자기 지점만 고쳐요.</li>
  <li><b>[시트 불러오기]</b>: 구글 시트 중등부·고등부 엑셀의 시험결과 시트를 읽어 이름+학교로 맞춰 넣어요(동명이인은 창에서 고르기).</li>
  <li><b>[자체시험]</b>: 학원 시험(단원테스트·내신대비 회차)을 학년별로 만들고(<b>[+ 시험 추가]</b>: 이름·학년·날짜·만점·기준 점수) 학생마다 점수와 <b>풀이완료</b>·<b>발송완료</b>(학부모님께 보냄) 체크. 기준 아래 점수는 빨갛게, 맨 아래 줄에 평균·통과·체크 수.</li>
  <li><b>시험 고치기·지우기</b>: 시험 <b>열 제목을 누르면</b>(올리면 연필 표시) 이름·날짜·만점·기준을 고치거나 지우는 창이 떠요. 여러 개를 한꺼번에 하려면 위쪽 <b>[시험 목록 · 고치기]</b> — 표에서 칸을 바로 고치고 [저장], 지울 시험은 왼쪽을 체크하고 [n개 지우기](두 번 · 점수도 같이 지워져요). 묶음을 골라 둔 상태면 그 묶음 회차만 나와요.</li>
  <li><b>정기시험(주간테스트·단원테스트처럼 1년치를 미리 만들어 두고 학생마다 각자 시간될 때 치는 시험)</b>: [+ 시험 추가] → <b>[정기시험 여러 회]</b>에서 이름·학년·만점·기준 점수·<b>시작일</b>·<b>목표</b>(매주 1회·2주에 1회)·회 수(기본 40회)를 넣으면 1회·2회…가 한꺼번에 생겨요. <b>회차 제목</b> 칸에 한 줄에 하나씩(예: 단원 이름) 적으면 줄 수만큼 그 제목으로 만들어요. 회차 날짜는 기본으로 안 붙어요(다 같이 정해진 날 칠 때만 '회차마다 날짜도 붙이기').</li>
  <li>학생이 치면 그 회차 칸에 점수만 적으면 쌓여요(언제 쳤는지는 안 적어도 돼요 — 못 친 주는 다음 주에 몰아서 쳐도 돼요).</li>
  <li>위쪽 <b>시험 고르기</b>(모든 시험 · 묶음 이름 · 단독 시험만)로 한 묶음을 고르면: 이름 옆에 <b>'8회 · 2회 밀림'</b>(시작일부터 목표만큼 쳤어야 할 회 수와 비교 · 1~2회 밀림 주황, 3회 이상 빨강 · 몰아서 치면 저절로 줄어듦), 띠에 <b>밀린 학생 수</b>, <b>[+ 다음 회]</b>·<b>[묶음 고치기]</b>(이름·만점·기준·시작일·목표를 모든 회에 · 점수 없는 회만 지우기 · 묶음 통째 지우기). 한 회만 고치거나 지울 땐 그 열 제목을 누르면 돼요.</li>
  <li><b>지난 회 대비</b>: 점수 옆 ▲▼는 내신 등락처럼 그 학생의 바로 전 회와 비교해요 — 같은 정기시험 묶음끼리(단독 시험은 단독 시험끼리), 안 친 회는 건너뛰고, 만점이 다르면 100점으로 환산. 맨 아래 평균 줄·학생 카드·선생님 폰의 자체시험에도 같이 나와요. 학생 카드에는 묶음마다 <b>점수 흐름 그래프</b>(기준 점수 점선 · 기준 아래 점은 빨강)도 나와요. <b>선생님 폰</b> 학생 카드에도 묶음마다 '4/40회 · 2회 밀림'과 흐름 그래프가 나와요(담당 학생만 · 지점장·행정은 자기 지점). 회차가 많으면 옆으로 밀어 보고(이름 칸은 왼쪽에 고정), 처음 열면 최근 회차 쪽이 보여요.</li>
  ${HF('tests','자체시험 — 점수와 풀이완료·발송완료 체크')}</ul>`},
 {id:'tasks',t:'업무',b:`
  ${HF('tasks','업무 — 모든 지점이 같이 쓰는 일 목록 · 담당별 합계')}
  <ul><li>인강·자료 제작·<b>블로그 분석글</b>처럼 나눠서 하는 일을 <b>모든 지점이 같이</b> 봐요(지점 구분 없음).</li>
  <li><b>[+ 업무 추가]</b>(종류·학년·학교·파일명/단원·과목·담당·문항수·기한·비고 · 블로그 분석글은 제목 칸이 '글 제목 · 시험'으로 바뀌고, 목록에서 문항·답안 대신 <b>[발행 완료]</b> 하나를 눌러요) 또는 <b>[시트 불러오기]</b>에 '인강분배' 시트 엑셀. 담당은 강사 목록에서 여러 명도.</li>
  <li><b>고치거나 지울 땐 그 줄 아무 데나 눌러요</b> — 고치기 창이 떠요(종류·학년·학교·제목·과목·담당·문항수·기한·비고 · [지우기]).</li>
  <li>표에서 <b>답안·완료·점검</b>을 눌러 바꿔요(답안·점검을 눌러도 줄 순서는 그대로 · 학년·학교·만든 순서). 완료해도 그 자리에 흐리게 남아 있다가 <b>7일 지나면</b> 맨 아래 접혀 들어가고, 3개월 지나면 자동으로 숨어요. 아래에 <b>담당별 합계</b>.</li>
  <li>폰: 담당 선생님은 [오늘] 탭에 <b>내 업무</b> → [완료]를 누르면 PC에 1~2분 뒤 반영. 지점장·행정·관리자 폰은 <b>전체 업무</b>(진행 중·끝난 일 2주·사람별)를 봐요(보기만).</li></ul>`},
 {id:'stats',t:'실적 통계',b:`
  <ul><li>[설정 → 실적 통계 열기](행정 PC는 학생 관리 위 버튼). 실적은 예민한 정보라 탭 대신 팝업으로 두었어요.</li>
  ${HF('stats','실적 통계 — 강사마다 학년별 재원·환산·학생×타임')}
  <li>지금 시간표 기준으로 강사마다 <b>학년별 재원</b>, <b>환산</b>(반마다 타임 비율로 나눈 인원 — 2+2면 0.5명씩, 3+1이면 0.75·0.25명), <b>학생×타임</b>, 주당 타임. <b>특강</b>은 따로 세요.</li>
  <li><b>표 머리(강사·초6·중1… 학년·환산·주당 타임 등)를 누르면 그 칸으로 정렬</b>돼요. 한 번 더 누르면 반대로(▲ 오름 · ▼ 내림). 고른 정렬은 다음에 열어도 그대로예요.</li>
  <li>월별 기록은 그달 마지막 상태가 남아요. [엑셀로 저장]도 돼요. 지점장은 자기 지점만 봐요.</li></ul>`},
 {id:'cls',t:'반 관리',b:`
  ${HF('cls','반 관리 — 반 이름·색·강사별 주당 횟수·명단')}
  <ul><li>반 이름·색·강사별 <b>주당 횟수</b>·강사별 명단을 고쳐요. 명단은 "반(강사)" 단위로 따로예요.</li>
  <li>주당 횟수를 늘리면 보관함에 대기 카드가 생겨요. 카드를 더블클릭해도 반 관리로 가요.</li></ul>`},
 {id:'import',t:'가져오기 (시트 · 주간 · 명부 · 에듀OK)',b:`
  <ul><li><b>시트 시간표 가져오기</b>: 구글 시트에서 받은 .xlsx를 읽어 새 시간표로. 동명이인·명단에 없는 이름은 창에서 골라요.</li>
  <li><b>주간 시간표 가져오기</b>: 관리 프로그램의 강사별 주간 .xls를 지금 시간표와 비교해서 바뀐 것만 골라 반영해요.</li>
  <li><b>재학생명부 가져오기</b>: 학생 추가·학년 갱신·연락처·입학일. <b>명부(에듀OK)에 없는 재원생</b>은 학생 관리 맨 위에 듣는 반과 함께 떠요 — 학생마다 <b>퇴원·휴원·그대로</b>를 고르고(기본 퇴원 · '모두'로 한꺼번에) [반영]. 퇴원은 오늘 날짜로 모든 반·특강 명단에서 빠지고 '퇴원'에 남아요(다음 명부에 다시 나오면 재입학으로 되살아나요).</li>
  <li><b>에듀OK에서 받기</b>: 처음 한 번 <b>그 지점 에듀OK 아이디·비밀번호</b>를 넣어 저장(이 PC에만 암호화 · 다른 PC로 안 넘어가요). 그다음부터 [재학생명부 받기]·[입학희망생명부 받기]로 10~20초 만에 바로 불러와요. <b>행정 선생님 PC에서도</b> 똑같이 돼요(그 PC에서 처음 한 번 계정 넣기 · 소속 지점에만 반영).</li>
  ${HF('eok','에듀OK에서 받기')}</ul>`},
 {id:'special',t:'방학 특강',b:`
  ${HF('special','특강 관리 — 요일·시작 시간·길이·기간·강사·학생')}
  <ul><li>지점 시간표 도구줄 <b>[특강 관리] → [+ 새 특강]</b> 또는 특강 줄의 <b>[+]</b>(수정 모드).</li>
  <li>특강마다 <b>요일·시작 시간·길이·기간·강사·학생</b>을 따로 정해요. 기간 안에 있을 때만 특강 줄이 보여요. 미리 짤 때는 <b>특강: 예정도 보기</b>.</li>
  <li>정규 수업·다른 특강과 시간이 겹치면 자동 점검에 떠요. [복사해서 새로]로 다음 방학에 재사용.</li></ul>`},
 {id:'note',t:'빈 칸 메모 (보강 · 추가수업 · 조교시간)',b:`
  ${HF('note','빈 칸 메모 — 종류·연결할 수업·횟수·이름')}
  <ul><li>수정 모드에서 <b>빈 칸</b>에 마우스를 올리면 <b>[+ 메모]</b>. <b>종류</b>(보강 / 추가수업 / 조교시간)를 고르고 이름을 쳐요(쉼표나 띄어쓰기로 여러 명). Enter = 저장.</li>
  <li><b>연결할 수업</b>을 고르면 카드에 반 이름과 색이 붙고 [반 명단 채우기]로 학생을 한 번에 넣어요. <b>횟수</b>(예: 3회)를 고르면 그만큼만 보이고 끝나면 사라져요.</li>
  <li>시간표 위 <b>[메모 보기]</b>로 모든 메모를 보이기/가리기.</li>
  <li><b>선생님 보강 등록</b>: 선생님이 폰의 <b>전체 → 내 시간표</b>에서 빈 칸을 눌러 보강을 등록하면 위쪽에 <b>선생님 보강 등록 ○건</b>이 떠요. [확인하기] → [승인]하면 빈 칸 메모로 들어가요. 지점장은 자기 지점 것을 승인해요.</li>
  <li><b>보강 삭제 요청</b>: 선생님이 내 시간표에서 <b>보강이 적힌 자기 칸</b>을 누르면 '이 칸의 보강' 아래 <b>[삭제 요청]</b>이 있어요. 학생을 안 고르면 <b>보강 통째</b>, 몇 명을 고르면 <b>그 학생만 빼기</b>로 요청해요. 위쪽 띠에 <b>삭제 요청 ○건</b>이 같이 뜨고, 창에서 지금 명단과 <b>남는 명단</b>을 보고 [승인 · 지우기] 또는 [거절]. 승인 전까지 선생님 폰엔 그 보강에 '삭제 요청 중'이 붙고, 선생님이 [요청 취소]도 할 수 있어요. 승인되면 새 시간표 파일을 기다리지 않고 선생님 폰에서 바로 빠져요.</li>
  ${HF('m-nd','폰 — 보강 삭제 요청 (학생 골라 빼기)')}</ul>`},
 {id:'ex',t:'당일 변경 (휴강 · 대강 · 시간 이동)',b:`
  ${HF('ex','당일 변경 — 날짜를 고르고 휴강·대강·시간 이동')}
  <ul><li>수업 카드를 누르면 명단 창 아래 <b>[당일 변경]</b>. <b>수정 모드가 아니어도</b> 바로 저장되고 선생님 화면에 1~2분 뒤 보여요.</li>
  <li>날짜(그 요일 다음 5번 중)를 고르고 <b>휴강</b> / <b>대강</b>(대신 들어갈 선생님) / <b>시간 이동</b> + 메모(선택). 원래 시간표는 그대로고 그날이 지나면 저절로 원래대로.</li>
  <li>잘못 넣었으면 같은 창 위쪽 목록에서 <b>[취소]</b>.</li></ul>`},
 {id:'ver',t:'보관함 · 예정 시간표 · 적용 기록',b:`
  ${HF('ver','보관함 — 시간표안 여러 개, 예정으로 정하기, 적용 기록')}
  <ul><li><b>[보관함]</b>: 같은 지점에 여러 시간표안(예: 10월안, 겨울안)을 두고 바꿔 봐요.</li>
  <li><b>예정 시간표</b>: [복사해서 새 시간표] → 고친 뒤 <b>[예정으로 정하기]</b>로 시작 날짜를 고르면 그날부터 지금 시간표로 바뀌어요(PC가 꺼져 있어도). <b>미리 보여 주기(공개)</b>를 켜면 선생님 폰에 "○/○부터 시간표가 바뀌어요 [미리 보기]". <b>[바뀌는 점]</b>으로 달라지는 반·학생을 비교해요.</li>
  <li><b>적용 기록</b>: [적용]할 때마다 그 전 시간표가 남아요. [보기]로 지난 시간표를 보고, [되돌리기](두 번)로 초안으로 불러와요.</li>
  <li>저장은 자동이고 30분마다 data\\backup에 백업이 쌓여요.</li></ul>`},
 {id:'pdf',t:'PDF 인쇄',b:`<ul><li>지점 시간표 <b>[지점 시간표 PDF]</b>(A3), 강사 버튼·학생별 탭의 <b>[이 강사/학생 PDF]</b>, <b>[전체 PDF]</b>. PDF 폴더에 저장돼요. 특강 기간이면 특강도 같이 나와요.</li></ul>`},
 {id:'phone',t:'강사용 (폰 · PC 브라우저)',b:`
  <div class="hrow">${HF('m-today','오늘 — 내 수업, 지금·다음, 내 업무·상담 알림')}${HF('m-grid','전체 — 지점 시간표 전체 표')}${HF('m-stu','학생 — 신입·예정 카드와 연락처')}</div>
  <ul><li>선생님은 [강사 관리]에서 받은 <b>6자리 로그인 코드</b>로 들어가요. <b>오늘</b>(내 수업·지금·다음) · <b>전체</b>(지점 시간표, 두 손가락 확대) · 요일별 · 강사별 · <b>학생</b>(이름으로 찾기 · 학교·학년·연락처·듣는 반·다음 시험).</li>
  <li>빈 칸의 <b>보강 카드</b>도 수업 카드처럼 이름·기간·반은 접혀 있고(겉엔 "보강 3명"만 — 칸이 넓어지지 않게), 누르면 펼쳐져요(<b>학생 이름 모두 보기</b>면 펼친 채). 펼친 뒤 밑줄 이름을 누르거나, <b>꾹 눌러</b> 크게 띄운 뒤 이름으로 옮겨 떼면 그 학생 카드(이 지점에 같은 이름이 한 명일 때).</li>
  <li>카드를 <b>꾹 누르면</b> 그 수업이 크게 떠요. 누른 채 학생 이름 위로 옮겨 떼면 그 학생 카드.</li>
  <li><b>학생 카드</b>에 <b>자체시험 점수</b>(학원 시험 최근 6회 · 기준 아래는 빨갛게 · 지난 회 대비 ▲▼ · 풀이완료·발송완료)가 떠요. 선생님은 <b>내 담당 학생만</b>, 지점장·행정은 자기 지점 학생 전체. 내신 성적은 폰으로 안 가요.</li>
  ${HF('m-ts','폰 학생 카드 — 자체시험 점수(담당 학생만)')}
  <li>중3은 2학기 기말, 고3은 2학기 시험이 없어서 그 학생들은 폰 <b>다음 시험·다가오는 시험 띠·시험 달력·범위 줄·상담 시험 기간</b>에서 빠져요.</li>
  <li><b>학교</b> 탭: 우리 지점 학생들이 다니는 학교의 <b>시험 일정·과목별 시험일</b>, <b>시험 범위</b>(시험을 골라서), <b>부교재</b>, <b>등급컷</b>, <b>기출 수거</b>, 고등 <b>선택과목</b>(선생님은 내 학생만 · 지점장·행정은 지점 전체). 학교 메모는 폰으로 안 가요. 범위 줄 아래 노란 띠는 <b>출제 참고사항</b>(어디서 나오는지 등)이에요 — 학생 카드 다음 시험에도 보여요. 고치기는 PC [학교 정보]에서. 위 <b>[시험 달력]</b>을 누르면 날짜별로 누가 무슨 시험을 치는지(지점 학생 전체 · 날짜를 누르면 그날 띠 · 이름 스위치)가 나와요. 이름을 누르면 그 학생 카드가 떠서 바로 전화할 수 있어요(연락처는 지금처럼 받는 사람만 — 선생님은 담당 학생, 지점장·행정은 지점 전체).</li>
  ${HF('m-xcal','폰 시험 달력 — 날짜를 누르면 그날 시험 띠, 이름 켬')}
  ${HF('m-sch','폰 학교 탭 — 학교 칩 · 시험 일정 · 범위 · 부교재 · 선택과목')}
  <li>아래 빈 곳: <b>다가오는 시험</b>, <b>새로 오는 학생</b>(선생님은 담당 반만), <b>학원 공지</b>, <b>내 메모</b>(그 폰에만). 화면 아래엔 하루 한 줄 응원(내 수업이 없는 날엔 시험 기간이어도 쉬는 날 문구만). 강사 관리에서 휴무 요일로 정한 날엔 오늘 탭에 <b>오늘은 휴일이에요</b>가 떠요.</li>
  <li>[오늘] 탭 띠: <b>내 업무</b>([완료] → PC 반영), <b>정기 상담</b>(남은 학생), 지점장·행정·관리자는 <b>전체 업무</b>.</li>
  <div class="hrow">${HF('m-tka','전체 업무 — 진행 중·끝난 일, 사람별 거르기')}${HF('m-new','신입·입학 예정 — 상담 전이면 빨간 테두리와 [상담 완료]')}</div>
  <li><b>누가 무엇을 보나</b>: 선생님 — 이름 있는 지점, 담당 학생 연락처 · 지점장 — 자기 지점 전부(신입·상담 지점 전체, 연락처 전체, [관리] 탭), 다른 지점은 전체 시간표만 · 행정 — 소속 지점 전부, 다른 지점은 전체 시간표만.</li>
  <li><b>지점장 폰 [관리] 탭</b>(자기 지점만): 학생(추가·상태·연락처·반 넣기/빼기), 입학 문의(카드를 누르면 전화·정보·메모), 정기 상담(주기·지정·보류), 공지. 보낸 건 켜져 있는 PC가 받아 1~2분 안에 반영해요.</li>
  ${HF('m-iq','관리 → 입학 문의 카드 — 전화 버튼과 메모')}
  <li><b>PC 브라우저</b>로 같은 주소를 열면 설치 없이 지점 시간표 전체 격자로 보여요.</li>
  <li><b>강사용 PC 프로그램</b>(설치파일 폴더의 강사용 설치 exe): 같은 화면을 전용 창으로 열어요 — 화면·자료는 늘 최신이라 따로 업데이트할 게 없어요. PC에선 <b>오늘</b>이 두 단(왼쪽 내 수업·업무·시험·새 학생·공지·메모, 오른쪽 오늘 전체 수업), <b>표 크기</b>는 위쪽 바의 [작게 · % · 크게 · 화면에 맞춤](Ctrl+휠 · Ctrl+0), <b>[인쇄]</b>(Ctrl+P), 시험 달력은 칸 안에 바로 학생 이름, 관리 탭의 학생·문의는 여러 칸, 창은 오른쪽 위 × 나 Esc로 닫아요. 창을 반쪽(960px 이상)으로 붙여도 PC 화면이 유지되고 보던 탭이 남아요. 전화번호를 누르면 복사돼요.</li>
  ${HF('d-grid','강사용 PC 창 — 전체 시간표 · 위쪽 바 표 크기 · [인쇄]')}
  ${HF('d-today','강사용 PC 창 — 오늘 두 단')}
  ${HF('d-xcal','강사용 PC 창 — 시험 달력(칸 안에 이름)')}
  <li><b>선생님 공지</b>는 [설정 → 선생님 공지]에서 지점마다 써요(언제까지 보일지 날짜).</li></ul>`},
 {id:'sync',t:'지점 연동 (여러 PC)',b:`
  <ul><li>지점장 PC·행정 PC는 부원장님께 받은 <b>연결 코드</b>로 연결해요. 자기 지점은 고치고, 다른 지점은 시간표만 봐요.</li>
  <li><b>먼저 수정 모드를 켠 PC만</b> 그 지점을 고쳐요(위쪽 "🔒 ○○ 수정 중"). [적용]하면 다른 PC로 올라가고 잠금이 풀려요.</li>
  <li>다른 PC는 2분마다, 창으로 돌아올 때, 수정 모드를 켤 때 새로 받아요. 학생·성적·학교 정보·업무처럼 바로 저장되는 것은 1~2분 안에 다른 PC에 보여요.</li>
  <li>겹쳐서 고친 경우 [적용] 때 [상대 것 받기 / 내 수정으로 덮어쓰기]를 물어봐요. 버리는 쪽은 백업에 남아요.</li>
  <li>인터넷이 끊겨도 고치고 적용할 수 있어요. 연결되면 자동으로 올라가요("⏳ 올리기 대기").</li>
  <li><b>이 PC에서 로그아웃</b>: [설정 → 지점 연동]의 [이 PC에서 로그아웃](행정 PC는 위쪽 '행정 선생님 PC' 띠). 두 번 누르면 이 PC의 열쇠·에듀OK 계정을 지워요.</li></ul>`},
 {id:'staffpc',t:'행정 선생님 PC',b:`
  <ul><li>행정 선생님 PC는 <b>지점장 PC와 똑같이</b> 소속 지점을 고쳐요 — 보기·수정 스위치로 수정 모드에 들어가 반 카드 옮기기·반 만들기·특강·메모·예정 시간표를 고치고 [적용], 학년 올리기·시간표 가져오기·당일 변경·보강 승인·설정도 돼요. 다른 지점은 시간표만 참고용으로 보여요.</li>
  <li>수정 모드를 켜지 않아도 바로 저장되는 일: 학생 관리(추가·상태·연락처·상담), 입학 문의, 재학생명부 가져오기, 반 카드에서 <b>반에 학생 넣기·신입 등록</b>, × 두 번으로 <b>반에서 빼기</b>, 시간 조건, 학교 정보·성적·업무.</li>
  <li>한 지점은 한 PC만 수정 모드로 고칠 수 있어요. 지점장과 행정이 같은 지점을 고치니, 한쪽이 수정 중이면(🔒) 끝날 때까지 기다리거나 [잠금 풀고 고치기]로 풀어요(그 PC의 초안은 나중에 어느 쪽을 남길지 물어봐요).</li>
  <li>없는 것: 프로그램 관리 탭, 행정 선생님 코드 관리 칸.</li></ul>`},
 {id:'update',t:'업데이트',b:`<ul><li>부원장님 PC에서 새 버전을 올리면 연동된 PC들이 2분 안에 자동으로 받아요. 본체가 바뀐 업데이트는 위쪽 <b>[지금 다시 시작]</b>을 눌러요.</li><li>수정 중이거나 창을 열어 둔 채 새 버전을 받으면 <b>"새 버전이 준비됐어요"</b> 띠만 떠요. 수정을 끝내거나 창을 닫으면 저절로 바뀌어요.</li></ul>`},
 {id:'keys',t:'단축키',b:`<table class="tbl" style="max-width:520px"><tbody>
  <tr><td><b>Ctrl + 휠 / Ctrl ± / Ctrl 0</b></td><td>시간표 크기 (마우스 위치 기준으로 부드럽게)</td></tr><tr><td><b>Ctrl + Z / Ctrl + Y</b></td><td>되돌리기 / 다시하기 (수정 모드)</td></tr>
  <tr><td><b>Delete / Shift + Delete</b></td><td>선택한 카드: 반 전체 / 이 수업만 휴지통</td></tr><tr><td><b>Ctrl + 카드 끌기</b></td><td>새 반으로 복사해서 놓기 (학생 골라서)</td></tr><tr><td><b>Shift + 카드 끌기</b></td><td>찬 칸이면 바로 자리 바꾸기</td></tr><tr><td><b>Esc</b></td><td>창 닫기 · 도움말 닫기 · 선택 해제</td></tr>
  <tr><td><b>F1</b></td><td>도움말 열기 / 닫기</td></tr><tr><td><b>F11</b></td><td>전체 화면</td></tr><tr><td><b>제목 줄 더블클릭</b></td><td>최대화 / 원래 크기</td></tr></tbody></table>`},
 {id:'faq',t:'자주 묻는 것 · 문제 해결',b:`
  <ul><li><b>고쳐지지 않아요</b> → 보기 모드예요. 위쪽 스위치를 켜세요. 다른 PC가 수정 중(🔒)이면 끝날 때까지 기다리거나 지점장 PC에서 [잠금 풀고 고치기].</li>
  <li><b>다른 지점 학생이 안 보여요</b> → 다른 지점은 시간표만 보이는 게 맞아요(<a data-help="other">다른 지점 보기</a>).</li>
  <li><b>성적 칸이 없어요(고2·3)</b> → 학교 정보에서 그 학생 선택과목을 먼저 정해요.</li>
  <li><b>선생님 보강 등록이 안 와요</b> → 선생님이 로그인해서 '내 시간표'에서 빈 칸을 눌렀는지 확인.</li>
  <li><b>'이 PC의 연결이 끊겼어요'가 떠요</b> → 부원장님이 끊은 거예요. 새 연결 코드를 받아 다시 연결하세요.</li>
  <li><b>연동 오류</b>가 떠요 → 인터넷 연결 확인. 계속되면 [설정 → 지점 연동 → 지금 받기]를 눌러 오류 문구를 부원장님께 보내 주세요.</li>
  <li><b>잘못 적용했어요</b> → [보관함 → 적용 기록]에서 그 전 시간표로 되돌리기.</li></ul>`},

 /* ---------- 관리자 도움말 (부원장님 PC에서만) ---------- */
 {id:'a-rule',owner:1,t:'정보 공개 원칙 · 권한 표',b:`
  <p>새 기능·권한을 정할 때 기준이에요. <b>지점 정보는 지점 경계를 지키고, 업무는 경계 없이 공유한다.</b></p>
  <ul><li><b>관리자(부원장님)</b>: 프로그램·모든 정보에 늘 전부 접근. 어떤 규칙도 관리자에겐 걸리지 않아요.</li>
  <li><b>지점장</b>: 자기 지점은 전부, 다른 지점은 최소한(협조용 전체 시간표만).</li>
  <li><b>행정</b>: 정리·전달하는 자리라 지점장과 같은 범위.</li>
  <li><b>선생님</b>: 이름 있는 지점, 자기 담당 위주(연락처는 담당 학생만).</li>
  <li><b>업무</b>: 지시·정리하는 사람(지점장·행정·관리자)에게 전부 공개.</li>
  <li><b>예민한 정보</b>(실적·비교·평가): 공개 정보로도 계산할 수 있으니 '명목상 숨김' — 메인 화면에 두지 않고 찾아 들어가야 보이는 곳에.</li>
  <li><b>막는 방식</b>: 개인정보(연락처·성적)는 <b>아예 안 보내기</b>(폰 묶음에서 빼기 · 업데이트 무거움), 예민한 비교 정보·다른 지점 화면은 <b>숨기기</b>(화면에서만 · 가벼움).</li></ul>
  <table class="tbl hacc"><thead><tr><th class="l"></th><th>자기 지점</th><th>다른 지점</th><th>연락처</th><th>전체 업무</th><th>관리 탭(폰)</th></tr></thead><tbody>
  <tr><td class="l"><b>관리자</b></td><td>전부</td><td>전부</td><td>전체</td><td>✓</td><td>✓ (통계·PC·다른 사람으로 보기까지)</td></tr>
  <tr><td class="l"><b>지점장</b></td><td>전부</td><td>시간표만</td><td>자기 지점 전체</td><td>✓</td><td>✓ 자기 지점</td></tr>
  <tr><td class="l"><b>행정</b></td><td>전부</td><td>시간표만</td><td>소속 지점 전체</td><td>✓</td><td>–</td></tr>
  <tr><td class="l"><b>선생님</b></td><td>담당 위주</td><td>안 보임</td><td>담당 학생</td><td>내 업무만</td><td>–</td></tr></tbody></table>
  <p class="hint">두 지점에 이름이 있고 한쪽에서만 지점장이면 다른 쪽에선 선생님. 이 표는 자동 점검(권한 표 테스트 p26·t119)으로 늘 확인돼요.</p>`},
 {id:'a-admin',owner:1,t:'프로그램 관리 탭',b:`
  ${HF('a-admin','프로그램 관리 — 지점·강사용 지점 보기·내 폰 관리 모드·지점장')}
  <ul><li>관리자만 쓰는 것이 모여 있어요: 지점 만들기·삭제, 강사용 지점 보기 안내, <b>내 폰 관리 모드</b>, <b>지점장</b> 지정, 지점 연동 관리·지점 코드·관리자 잠금, 폰으로 보기 연결, 보강 등록 키, 백업 불러오기·전체 초기화.</li>
  <li>관리자 잠금 상태(용호점 모드)에서는 이 탭이 숨어요. [설정] 맨 위 [관리자 모드]로 열어요.</li></ul>`},
 {id:'a-lock',owner:1,t:'관리자 모드 · 잠금',b:`<ul><li>[설정 → 지점 연동 → 관리자 잠금]에 비밀번호를 정하면, 평소엔 <b>내 지점 모드</b>로 열려요 — 내 지점만 고치고 다른 지점은 보기만.</li><li>[설정] 맨 위 <b>[관리자 모드]</b>에 비밀번호를 넣으면 다른 지점 수정·지점 코드·폰 설정이 열리고, [관리자 모드 · 잠그기]나 다시 켜면 잠겨요. 잠가 둬도 새 버전 보내기는 그대로예요.</li><li>잠금 상태에서도 다른 지점 학생·성적은 볼 수 있어요(관리자는 늘 전부).</li></ul>`},
 {id:'a-sync',owner:1,t:'지점 연동 관리 (코드 · PC 끊기)',b:`
  <ul><li>[설정 → 지점 연동] 지점마다 <b>[코드 만들기]</b> → 지점장에게 설치파일 + 코드를 <b>1:1</b>로. 행정 PC는 [강사 관리 → 행정 선생님]의 [PC 연결 코드].</li>
  <li><b>연결된 PC</b> 목록에서 PC마다 <b>[연결 끊기]</b>(PC 교체·퇴사). 30일 넘게 안 켜진 PC는 표시돼요. 버전·'다시 시작 필요'도 여기서 봐요.</li>
  <li><b>[잠금 풀기]</b>: 모든 지점의 수정 잠금을 풀 수 있어요(지점장은 자기 지점만).</li>
  <li><b>[프로그램 관리자 다른 PC용 코드]</b>: 관리자 PC를 하나 더 두거나 인수인계할 때만. <b>절대 다른 사람에게 주지 마세요.</b></li></ul>`},
 {id:'a-mgr',owner:1,t:'지점장 지정',b:`<ul><li>[프로그램 관리 → 지점장]에서 지점마다 지점장 선생님을 켜요. 그 선생님은 폰에서 자기 지점 [관리] 탭·신입·상담 지점 전체·연락처 전체·전체 업무를 받고, 다른 지점은 전체 시간표만 봐요. 지점장 폰의 요청은 그 지점 키로 서명돼 다른 지점은 바꿀 수 없어요.</li><li>지점장 PC(연결 코드 'branch')는 자기 지점 수정·잠금 강제 풀기, 다른 지점은 시간표만.</li></ul>`},
 {id:'a-phone',owner:1,t:'내 폰 관리 모드',b:`
  <div class="hrow">${HF('a-mphone','폰 [관리] 탭 — 학생·입학 문의·정기 상담·공지·통계·PC·다른 사람으로 보기')}${HF('a-pv','다른 사람으로 보기 — 그 사람 폰 화면 그대로')}</div>
  <ul><li>[프로그램 관리 → 내 폰 관리 모드]에서 <b>10자리 코드</b>를 만들어 폰에서 로그인하면 [관리] 탭이 생겨요. 학생·반 넣기·정기 상담·입학 문의(전화·메모)·공지·통계.</li>
  <li><b>다른 사람으로 보기</b>: 아무 선생님·행정 선생님 폰 화면을 그대로 미리 봐요(그 사람이 받는 지점만 · 보내기는 막힘). 권한을 바꾼 뒤 확인할 때 써요.</li>
  <li><b>[PC·업데이트]</b>: 켜져 있는 PC와 버전·'다시 시작 필요'를 보고 원격으로 [다시 시작].</li>
  <li>코드가 새면 [새 코드로 바꾸기], 안 쓰면 [끄기].</li></ul>`},
 {id:'a-pub',owner:1,t:'폰으로 보기 설정 · 키',b:`<ul><li><b>인터넷(GitHub)으로 올리기</b>를 켜면 [적용]·바로 저장할 때마다 올라가서 어디서나 폰으로 봐요. 시간표는 지점마다 따로 암호화되고, 사람마다 받는 묶음(지점·연락처·전체 업무)이 달라요.</li><li><b>보강 등록 키</b>(Issues 권한만 있는 GitHub 키)를 [설정 → 선생님 보강 등록]에 넣어 켜면 폰 요청(보강·상담 완료·업무 완료·관리 탭)이 PC로 와요.</li><li>GitHub 키는 만료 14일 전부터 위쪽 노란 띠로 알려 줘요. 새 키를 넣으면 지점 PC들은 자동으로 따라와요.</li></ul>`},
 {id:'a-deploy',owner:1,t:'업데이트 배포 · 업데이트 무게',b:`
  <ul><li>누르는 단추는 없어요. 새 버전 파일을 관리자 PC 프로그램 폴더(resources\\app)에 넣고 켜 두면, 켜진 뒤 3초·그다음 <b>2분마다</b> 이 PC 버전이 올려 둔 버전보다 새로울 때 <b>저절로</b> 저장소에 올리고("다른 PC들에 새 버전을 보냈어요" 알림), 다른 PC들은 2분마다 받아요. 본체(main.js)가 바뀐 버전은 받는 PC도 <b>다시 시작</b>이 필요해요(관리자 PC도 한 번 껐다 켜기).</li>
  <li>[프로그램 관리 → 연결된 PC] 위 <b>올려 둔 버전</b> 줄에서 저장소에 올라간 버전·올린 시각·마지막 확인 시각을 보고, 기다리기 싫으면 <b>[지금 확인]</b>으로 바로 올리거나 받아요. 폰 [관리 → PC·업데이트]의 [시간표 지금 올리기]는 프로그램이 아니라 폰용 시간표 자료를 올리는 거예요.</li>
  <li>설치파일 폴더의 <b>업데이트 exe</b>는 새로 설치하거나 자동 업데이트가 안 될 때 써요.</li>
  <li><b>업데이트 무게</b> — 가벼움: 문구·색·보이기/숨기기·정렬(화면 파일만) · 보통: 기존 자료로 새 화면·칸·통계(화면 파일만) · 무거움: 폰에 새 자료 보내기·폰→PC 요청·권한·새 탭(main.js · 다시 시작) · 가장 무거움: 저장 방식·동기화 규칙·이름 규칙·서버 바꾸기(전체 점검 필수 · 옛 자료 옮기기).</li>
  <li><b>도움말</b>: 업데이트 때마다 바뀐 기능의 글을 고치고 그림을 다시 찍어요(개발키트 test/helpshots.js).</li></ul>`},
 {id:'a-data',owner:1,t:'데이터 · 백업 · 개발키트',b:`<ul><li>시간표 자료는 프로그램 폴더 data\\timetable.json, 백업은 data\\backup(30분마다). [설정 → 데이터 관리]에서 백업 불러오기(전체)·전체 초기화(관리자만).</li><li>학교 정보·업무·성적은 공유 자료(sync/shared)로 모든 PC가 같이 써요 — 잠금 없이 칸마다 마지막에 고친 게 남아요.</li><li><b>개발소스</b> 폴더의 개발키트 zip에 소스·테스트(test/all.sh 전체 점검)·변경 기록(README)이 들어 있어요.</li></ul>`}
];
const helpAdmOK=()=>typeof realOwner==='function'?realOwner():true; /* 관리자 도움말: 부원장님 PC(잠금 상태여도) */
const helpVisible=()=>{const adm=!!UI.helpAdm&&helpAdmOK();return HELP.filter(s=>adm?s.owner:!s.owner)};
function helpClose(){UI.view=UI.helpFrom&&UI.helpFrom!=='help'?UI.helpFrom:'grid';UI.helpQ='';render()}
/* 그림: 처음 도움말을 열 때 helpimg.js(그림 묶음)를 한 번 불러와 칸마다 넣음 */
let HIMG_ST='';
function helpImgs(){const put=()=>document.querySelectorAll('.hfig[data-hf]').forEach(f=>{const d=window.HELPIMG&&window.HELPIMG[f.dataset.hf];const box=f.querySelector('.hfi');if(!box||box.dataset.on)return;if(d){const o=typeof d==='string'?{s:d}:d;box.dataset.on='1';box.innerHTML=`<img src="${o.s}" alt=""${o.w?` width="${o.w}" height="${o.h}"`:''}>`;f.classList.add('on')}else f.classList.add('none')});
  if(window.HELPIMG){put();return}if(HIMG_ST==='load')return;HIMG_ST='load';const sc=document.createElement('script');sc.src='helpimg.js';sc.onload=()=>{HIMG_ST='ok';put()};sc.onerror=()=>{HIMG_ST='err';document.querySelectorAll('.hfig').forEach(f=>f.classList.add('none'))};document.head.appendChild(sc)}
function viewHelp(){const list=helpVisible();const q=(UI.helpQ||'').trim();const adm=!!UI.helpAdm&&helpAdmOK();
  const shown=q?list.filter(s=>(s.t+s.b.replace(/<[^>]+>/g,'')).includes(q)):list;setTimeout(helpImgs,0);
  return `<div class="card-h"><h2>도움말</h2>${helpAdmOK()?`<span class="seg hmode"><button data-act="helpMode" data-v="" aria-pressed="${!adm}">사용 설명서</button><button data-act="helpMode" data-v="1" aria-pressed="${adm}">관리자 도움말</button></span>`:''}<span class="hint">Y-MATH 시간표 ${APPVER} · F1로 열고 닫아요</span><span class="sp"></span><input id="helpQ" placeholder="찾기 (예: 특강, 성적, 업무)" value="${esc(UI.helpQ||'')}" style="width:220px" autocomplete="off"><button class="btn helpx" data-act="helpClose" title="도움말 닫기 (Esc · F1)">닫기 <kbd>Esc</kbd></button></div>
  <div class="helpw"><nav class="helptoc">${list.map(s=>`<button data-help="${s.id}">${esc(s.t)}</button>`).join('')}</nav>
  <div class="helpbody${adm?' hadm':''}" id="helpBody">${shown.length?shown.map(s=>`<section id="help-${s.id}"><h3>${esc(s.t)}</h3>${s.b}</section>`).join(''):'<div class="empty">찾는 내용이 없어요</div>'}</div></div>`}
function helpGo(id){const s=HELP.find(x=>x.id===id);if(s&&!!s.owner!==!!UI.helpAdm){if(s.owner&&!helpAdmOK())return;UI.helpAdm=!!s.owner;if(UI.view==='help')render()}if(UI.view!=='help'){UI.view='help';UI.helpQ='';render()}const el=document.getElementById('help-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
</script>
</body>
</html>
