<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y-MATH 시간표</title>
<style>[hidden]{display:none!important}
@font-face{font-family:"IBM Plex Sans KR";font-weight:400;src:url(fonts/IBMPlexSansKR-Regular.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans KR";font-weight:500;src:url(fonts/IBMPlexSansKR-Medium.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans KR";font-weight:600;src:url(fonts/IBMPlexSansKR-SemiBold.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans KR";font-weight:700 800;src:url(fonts/IBMPlexSansKR-Bold.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400 600;src:url(fonts/IBMPlexMono-Medium.woff2) format("woff2")}
/* 시안과 같은 색 체계 (밝은 화면 / 윈도우 어두운 모드) */
:root{
  --bg:#f3f4f7; --panel:#ffffff; --fg:#1b2233; --muted:#667089; --line:#dde1ea; --line2:#eceff5;
  --navy:#1f2f5c; --navy-soft:#e6eaf5; --on-navy:#ffffff; --off:#e9ebf0; --none:#d5d9e2;
  --err:#c7372f; --err-bg:#fbeceb; --warn:#a86a00; --warn-bg:#fdf4e2; --info:#3d5a99; --info-bg:#eaf0fb;
  --ok:#1f8a4c; --ok-bg:#e1f4e8; --good-bg:#c3ead2; --sel:#ff8a00; --tag-draft:#fdf4e2;
  --f-body:"IBM Plex Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151d; --panel:#1a1f2b; --fg:#e7eaf2; --muted:#98a1b8; --line:#2c3344; --line2:#232938;
  --navy:#9fb4ee; --navy-soft:#26304a; --on-navy:#12151d; --off:#1f2431; --none:#2a3040;
  --err:#ff7b72; --err-bg:#3a1f1e; --warn:#f0b54a; --warn-bg:#352a14; --info:#8fb0f0; --info-bg:#1e2a44;
  --ok:#5fd08e; --ok-bg:#183626; --good-bg:#1f4a32; --sel:#ffa040; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151d; --panel:#1a1f2b; --fg:#e7eaf2; --muted:#98a1b8; --line:#2c3344; --line2:#232938;
  --navy:#9fb4ee; --navy-soft:#26304a; --on-navy:#12151d; --off:#1f2431; --none:#2a3040;
  --err:#ff7b72; --err-bg:#3a1f1e; --warn:#f0b54a; --warn-bg:#352a14; --info:#8fb0f0; --info-bg:#1e2a44;
  --ok:#5fd08e; --ok-bg:#183626; --good-bg:#1f4a32; --sel:#ffa040; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,select,input{font-family:inherit;font-size:13px;color:var(--fg)}
input,select{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 8px}
input:focus,select:focus{outline:2px solid var(--navy-soft);border-color:var(--navy)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.btn.danger{color:var(--err)}
.btn.danger.armed{background:var(--err);color:var(--panel);border-color:var(--err)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.hint{color:var(--muted);font-size:12px}
.mono{font-family:var(--f-mono)}

/* 상단 */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 16px 0}
.bar1{display:flex;align-items:center;gap:10px 12px;padding:0 0 10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em;color:var(--fg);margin-right:4px}
.bar1 select{border:0;border-radius:999px;background:var(--navy-soft);color:var(--navy);font-weight:600;font-size:12px;padding:3px 8px}
.bar1 #verBtn{font-size:12px;padding:3px 10px;border-radius:999px}
.bar1 label{color:var(--muted);font-size:12px}
.sp{flex:1}
.saved{font-size:12px;color:var(--muted);min-width:90px;text-align:right}
.saved.dirty{color:var(--warn)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy)}
.vpanel{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.vrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vrow input{width:180px}

/* 본문 */
.main{display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.card-h{padding:9px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-h h2{font-size:14px;margin:0}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 10px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.chk{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:12px;cursor:pointer}
.scroll{overflow:auto;max-height:calc(100vh - 470px)}

/* 대기 카드 */
.tray{padding:8px 14px;border-bottom:1px solid var(--line2);display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:44px}
.tray.drop{background:var(--warn-bg)}
.tray .lbl{font-weight:700;font-size:12px;color:var(--warn);margin-right:4px}
.tray .chip{width:auto;min-width:96px}
.pickline{padding:6px 14px;font-size:12px;background:var(--navy-soft);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.lg{display:inline-flex;align-items:center;gap:4px}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* 격자 */
table.grid{border-collapse:separate;border-spacing:0;font-size:12px}
.grid th,.grid td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:3px;vertical-align:top}
.grid thead th{position:sticky;top:0;background:var(--panel);z-index:3}
.grid thead tr:nth-child(2) th{top:33px}
.grid th.day{font-size:14px;color:var(--navy);border-right:2px solid var(--line);text-align:left;padding:6px 8px;height:33px}
.grid th.tch{font-weight:500;color:var(--muted);white-space:nowrap;padding:4px 6px}
.grid th.tch.offt{color:var(--none);text-decoration:line-through}
.grid .end{border-right:2px solid var(--line)!important}
.grid th.per{text-align:left;white-space:nowrap;padding:5px 8px;background:var(--panel);position:sticky;left:0;z-index:2;border-right:2px solid var(--line)}
.grid thead th.per{z-index:4}
.per b{display:block;font-size:12px}
.per span{font-family:var(--f-mono);color:var(--muted);font-size:11px}
td.slot{width:var(--cw,96px);min-width:var(--cw,96px);height:var(--ch,40px);position:relative;transition:width .22s ease,min-width .22s ease,height .22s ease}
#gridScroll .chip{min-height:calc(var(--ch,40px) - 8px);transition:font-size .22s ease;display:flex;flex-direction:column;justify-content:flex-start}
.grid .chip{transition:font-size .22s ease}
.grid .chip .nm{max-height:9em;overflow:hidden;transition:max-height .25s ease,opacity .2s ease,margin .2s ease,content-visibility .25s allow-discrete}
/* 3.73.3: 접힌 이름은 배치에서도 빼서(content-visibility) 확대 중 매 화면 그리는 비용을 절반으로 · 접히는 동안(allow-discrete)은 보이는 채로 */
.grid:not(.withnames) .chip .nm{max-height:0;opacity:0;margin-top:0;content-visibility:hidden}
@media (prefers-reduced-motion:reduce){td.slot,.grid .chip,.grid .chip .nm{transition:none}}
.grid .chip{font-size:var(--fs,12px)}
.grid .chip small,.grid .chip .nm{font-size:calc(var(--fs,12px) - 1px)}
.zm{display:inline-flex;align-items:center;gap:4px}
.zm .btn{padding:2px 9px}
.zm b{min-width:42px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
td.slot.offday{background:repeating-linear-gradient(135deg,var(--off) 0 6px,transparent 6px 12px)}
td.slot.none{background:var(--none)}
td.slot .tm{font-family:var(--f-mono);color:var(--muted);font-size:10.5px;display:block}
/* 옮길 칸 표시는 약하게: 추천 칸만 옅은 초록, 나머지는 작은 점 */
td.fit-ok,td.fit-good,td.fit-warn{cursor:copy}
td.fit-ok:hover,td.fit-good:hover,td.fit-warn:hover{background:var(--ok-bg)!important}
td.fit-good{background:color-mix(in srgb,var(--good-bg) 35%,transparent)!important}
td.fit-good::before{content:"";position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;z-index:2;pointer-events:none}
td.fit-good::before{background:var(--ok)}
td.fit-warn:hover{background:var(--warn-bg)!important}
td.fit-bad{cursor:not-allowed}
td.fit-bad::after{content:"겹침";position:absolute;right:4px;top:2px;font-size:9.5px;color:var(--err);font-weight:600;opacity:.6;z-index:2;pointer-events:none}
td.drophover{outline:2px dashed var(--sel);outline-offset:-3px}
td.drophover.dropcopy{outline-color:#3f9a64;background:color-mix(in srgb,#3f9a64 7%,transparent);position:relative}td.drophover.dropcopy::after{content:'+ 새 반';position:absolute;right:4px;top:3px;font-size:10px;font-weight:700;color:#2f7a4e;background:var(--panel);border-radius:999px;padding:0 6px;box-shadow:0 0 0 1px color-mix(in srgb,#3f9a64 40%,transparent);pointer-events:none}
.chip{display:block;width:100%;border:0;border-radius:6px;padding:4px 6px;text-align:left;cursor:grab;font-size:12px;line-height:1.25;margin-top:2px}
.chip:first-child{margin-top:0}
.chip b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{opacity:.85;font-size:11px}
.chip .nm{display:block;font-size:11px;margin-top:2px;white-space:normal;opacity:.95}
.chip .nm s{opacity:.6}
.chip.hl{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--sel)}
.chip.dim{opacity:.25}
.chip.bad{box-shadow:inset 0 0 0 2px var(--err),0 0 0 1px var(--err)}
.chip.picked{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--navy);transform:translateY(-1px)}
.chip.wait{outline:2px dashed var(--muted);outline-offset:-2px}

/* 오른쪽 */
.side{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:stretch}
.side > .card{display:flex;flex-direction:column;min-height:0} /* 3.81.9: 안쪽 스크롤 없이 화면 전체로 굴림 */
.side > .card > .issues,.side > .card > .detail{min-height:0}
.side .sumrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.side .issues{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px;padding:8px 10px 10px}
.side .issues li{margin-top:0}
.side .sum{padding:0}
.side .pill{padding:3px 10px;display:flex;gap:6px;align-items:baseline}
.side .pill strong{font-size:16px;display:inline}
@media (max-width:900px){.side{grid-template-columns:minmax(0,1fr)}}
.sum{display:flex;gap:8px;padding:10px 14px}
.pill{flex:1;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:600}
.pill strong{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.p-err{background:var(--err-bg);color:var(--err)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-info{background:var(--info-bg);color:var(--info)}
.issues{list-style:none;margin:0;padding:0 8px 10px}
.issues li{border-radius:8px;padding:7px 10px 7px 12px;margin-top:6px;cursor:pointer;border-left:4px solid;font-size:12.5px}
.issues li.err{background:var(--err-bg);border-color:var(--err)} .issues li.warn{background:var(--warn-bg);border-color:var(--warn)} .issues li.info{background:var(--info-bg);border-color:var(--info)}
.issues li .k{font-weight:700;font-size:11px;letter-spacing:.04em;display:block;margin-bottom:2px}
.issues li.err .k{color:var(--err)} .issues li.warn .k{color:var(--warn)} .issues li.info .k{color:var(--info)}
.issues .more{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 4px;font-size:12px}
.detail{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.names{display:flex;flex-wrap:wrap;gap:4px}
.nmb{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--navy-soft);cursor:pointer;border:0}
.nmb.away{background:var(--off);color:var(--muted);text-decoration:line-through}
.nmb small{color:var(--muted)}

/* 관리 화면 */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:400px}
.list{border-right:1px solid var(--line2);max-height:calc(100vh - 210px);overflow:auto}
.list .it{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line2);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.list .it:hover{background:var(--bg)}
.list .it.on{background:var(--navy-soft)}
.list .it .n{flex:1;font-weight:700}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.12)}
.ed{padding:14px 18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > label{width:70px;color:var(--muted);font-size:12px}
.pal{display:flex;gap:4px;flex-wrap:wrap}
.pal button{width:22px;height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.15);cursor:pointer}
.pal button.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--navy)}
.tbox{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.tbox h3{margin:0;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mchip{display:inline-flex;align-items:center;gap:2px;font-size:12px;padding:2px 4px 2px 9px;border-radius:999px;background:var(--navy-soft)}
.mchip.away{background:var(--off);color:var(--muted)}
.mchip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:13px;padding:0 4px}
.mchip button:hover{color:var(--err)}
table.tbl{border-collapse:collapse;width:100%;font-size:12.5px}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
.tbl thead th{color:var(--muted);font-weight:700;position:sticky;top:0;background:var(--panel);z-index:1}
.tbl td.num{text-align:center;font-variant-numeric:tabular-nums}
.st{border-radius:999px;padding:2px 10px;font-size:12px;border:1px solid var(--line);cursor:pointer;background:var(--ok-bg);color:var(--ok);font-weight:700}
.st.away{background:var(--off);color:var(--muted)}
.box{border-radius:9px;padding:10px 12px;background:var(--info-bg);font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.box.warn{background:var(--warn-bg)}
.dbtn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:2px 7px;cursor:pointer;font-size:12px}
.dbtn[aria-pressed="true"]{background:var(--none);color:var(--muted);text-decoration:line-through}
.sec{padding:14px 18px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line2)}
.sec h3{margin:0;font-size:14px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.days .tbox input{width:88px}
.days .tbox input.t{width:64px;font-family:var(--f-mono)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:var(--on-navy);padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* 인쇄 */
#print{display:none}
body.printing > *:not(#print){display:none!important}
body.printing{background:#fff}
body.printing #print{display:block}
.pg{page-break-after:always;break-after:page;padding:4mm;font-family:var(--f-body);color:#000}
.pg:last-child{page-break-after:auto;break-after:auto}
.pg h1{font-size:18px;margin:0 0 6px;display:flex;gap:10px;align-items:baseline}
.pg h1 small{font-size:11px;color:#555;font-weight:400}
.pt{border-collapse:collapse;width:100%;table-layout:fixed;font-size:9.5px}
.pt th,.pt td{border:1px solid #888;padding:2px 3px;vertical-align:top}
.pt th{background:#eef0f4;font-size:10px}
.pt th.d{background:#1f2f5c;color:#fff;font-size:12px}
.pt td.p{background:#eef0f4;font-weight:700;white-space:nowrap;width:62px}
.pt td.p span{display:block;font-weight:400;font-family:var(--f-mono)}
.pt td.x{background:#d9dce3}
.pt .h{display:block;font-weight:800;padding:1px 3px;border-radius:2px;margin:-1px -2px 2px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pt td,.pt th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.big .pt{font-size:12px}
.big .pt td{height:56px}
html:has(body.printing){background:#fff}
.pg.br .pt{font-size:10.5px}
.pg.br .pt tbody td{height:39mm}
.pg.big .pt tbody td{height:27mm}

.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--navy-soft);color:var(--navy);font-weight:600}
.grid th.tch.offt{color:var(--muted);opacity:.55;text-decoration:none}

#gridScroll{display:flex;flex-direction:column;align-items:flex-start;gap:8px;overflow:visible;max-height:none}
#gridScroll .grid thead th{top:var(--toph,100px)}
#gridScroll .grid thead tr:nth-child(2) th{top:calc(var(--toph,100px) + 33px)}
#gridScroll table.grid{flex:none}
#gridScroll table.grid + table.grid{border-top:2px solid var(--line)}
#gridScroll td.slot .tm{position:absolute;top:1px;right:3px;font-size:10px;opacity:.75;z-index:1;pointer-events:none}
.tools h2.vt{font-size:14px;margin:0 6px 0 0;white-space:nowrap}
.tray{min-height:34px;padding:4px 14px}
.grid th.per{padding:3px 8px}
.chip{padding:3px 6px}

#gridScroll.measuring td.slot,#gridScroll.measuring .chip,#gridScroll.measuring .chip .nm{transition:none!important}
#gridScroll.zming:not(.zx){overflow-x:clip} /* 확대하는 동안 옆으로 삐져나와 가로 스크롤이 번쩍 생기지 않게 */
.chip.same{box-shadow:0 0 0 2px var(--panel),0 0 0 3px color-mix(in srgb,var(--navy) 60%,transparent)}
.lg i.lg-good{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.lg i.lg-ok,.lg i.lg-warn,.lg i.lg-bad{width:8px;height:8px;border-radius:50%}
.lg i.lg-ok{background:color-mix(in srgb,var(--ok) 45%,transparent)}
.lg i.lg-warn{background:var(--warn)}
.lg i.lg-bad{background:var(--err)}

/* 수정 모드 */
.modebox{display:inline-flex;gap:6px;align-items:center}
.tag.edit{background:var(--warn-bg);color:var(--warn)}
body.editing .top{box-shadow:inset 0 3px 0 var(--sel)}
.draftbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.viewonly{margin:10px 14px 0;padding:8px 12px;border-radius:8px;background:var(--info-bg);color:var(--info);font-size:13px}
/* 겹쳐 둔 칸 */
td.slot.stacked{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--warn) 18%,transparent) 0 5px,transparent 5px 10px)}
#gridScroll td.stacked .chip{min-height:0!important}
/* 시간표 + 오른쪽 보관함 */
.gwrap{display:flex;gap:10px;align-items:flex-start}
.gwrap #gridScroll{flex:1;min-width:0}
.pool{width:172px;flex:none;position:sticky;top:calc(var(--toph,100px) + 8px);border:1.5px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - var(--toph,100px) - 24px);overflow:auto;background:var(--panel)}
.pool.drop{background:var(--warn-bg);border-color:var(--warn)}
.pool-h{display:flex;justify-content:space-between;align-items:baseline}
.pool .chip{width:100%;margin-top:0}
.pool .btn.pri{width:100%}
.pool-tip{font-size:11px}
/* 새 반 팝업 */
.modal{position:fixed;inset:0;background:rgba(10,14,24,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.dlg{background:var(--panel);border-radius:12px;padding:18px 20px;width:min(640px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg h2{margin:0;font-size:16px}
.dlg .row > label{width:70px}
.ncT{display:grid;grid-template-columns:auto auto auto auto;gap:6px 8px;align-items:center}

/* 휴지통 */
.trash{margin-top:6px;border-top:1px solid var(--line2);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.trash-h{display:flex;align-items:center;gap:6px;border:1.5px dashed var(--line);background:var(--bg);border-radius:8px;padding:8px;cursor:pointer;color:var(--muted);width:100%}
.trash-h b{color:var(--fg);font-size:12.5px;flex:1;text-align:left}
.trash.drop .trash-h{border-color:var(--err);background:var(--err-bg);color:var(--err)}
.titem{display:flex;align-items:center;gap:6px;font-size:12px}
.titem .tn{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.titem .tn small{color:var(--muted);font-size:11px}
.titem .btn{padding:2px 7px;font-size:11.5px}

.themesel{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.themesel button{border:0;background:var(--panel);padding:3px 9px;font-size:12px;cursor:pointer;color:var(--muted)}
.themesel button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}

/* 학생 시간 조건 */
.avbtn{padding:2px 8px;font-size:12px;display:inline-flex;gap:4px}
.avn{color:var(--err);font-weight:600}.avp{color:var(--ok);font-weight:600}
table.avt{border-collapse:separate;border-spacing:4px;font-size:12px}
.avt th{color:var(--muted);font-weight:600;padding:2px 6px;text-align:left;white-space:nowrap}
.avt td.x{background:var(--none);border-radius:6px}
.avc{width:96px;min-height:48px;border:1px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;padding:4px 6px;gap:1px;text-align:left}
.avc .t{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.avc small{font-size:10.5px;color:var(--muted);line-height:1.2}
.avc.av-pref{background:var(--ok-bg);border-color:var(--ok)}.avc.av-pref b{color:var(--ok)}
.avc.av-no{background:var(--err-bg);border-color:var(--err)}.avc.av-no b{color:var(--err)}
.avc:disabled{cursor:default}
td.slot.av-pref{background:color-mix(in srgb,var(--ok-bg) 70%,transparent)}
td.slot.av-no{background:repeating-linear-gradient(135deg,var(--err-bg) 0 6px,transparent 6px 12px)}

/* 학생 이름 토글 */
.nmt{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.nmt small{font-size:11px;color:var(--muted);min-width:22px}
.nmmode{border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:999px;font:inherit;font-size:11px;padding:1px 8px;cursor:pointer;transition:color .15s ease,border-color .15s ease,background .15s ease}.nmmode:hover{border-color:color-mix(in srgb,var(--navy) 35%,var(--line2));color:var(--fg)}.nmmode.on{color:var(--navy);border-color:color-mix(in srgb,var(--navy) 45%,var(--line2));background:color-mix(in srgb,var(--navy) 7%,transparent);font-weight:600}
.tgl{width:36px;height:20px;border-radius:999px;border:0;background:var(--none);position:relative;cursor:pointer;padding:0;transition:background .2s}
.tgl i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.tgl[aria-checked="true"]{background:var(--ok)}
.tgl[aria-checked="true"] i{transform:translateX(16px)}
@media (prefers-reduced-motion:reduce){.tgl,.tgl i{transition:none}}

/* 보기·수정 토글 */
.mtg{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.mtg .on{color:var(--fg);font-weight:600}
.mtg .on.ed{color:var(--warn)}
.tgl.mtgl[aria-checked="true"]{background:var(--sel)}
.modebox{position:relative}
.mpop{position:absolute;top:calc(100% + 8px);right:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:6px;align-items:center;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.18)}

.modewrap{display:inline-flex;flex-direction:column;align-items:flex-end;gap:5px}
.undorow{display:inline-flex;gap:6px}
.undorow .btn{padding:3px 10px;font-size:12px}

.pal{max-width:620px}
.pal button.used{cursor:not-allowed;opacity:.55;background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.28) 0 2px,transparent 2px 6px)!important}

.dbadge{border:1px dashed var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:999px;font-size:11.5px;padding:2px 9px;cursor:pointer;margin-left:6px;font-weight:600}
.modebox{display:inline-flex;align-items:center}

.peekbar{background:var(--info-bg)}
body.peeking .top{box-shadow:inset 0 3px 0 var(--info)}
body.peeking #view{outline:2px dashed var(--info);outline-offset:-2px}

@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--sel) 70%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.btn.pulse{animation:pulse .7s ease-out 2}

/* 자동 배치 */
.autobar{background:var(--ok-bg)}
.aucls{display:flex;flex-wrap:wrap;gap:6px 14px;max-height:160px;overflow:auto;border:1px solid var(--line2);border-radius:8px;padding:8px}
.aucls .sw{margin-right:2px}
.aulist{display:flex;flex-direction:column;gap:6px}
.auitem{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:8px 10px;flex-wrap:wrap}
.auitem.hard{border-color:var(--err)}
.auitem > span:nth-child(2){font-weight:700;color:var(--ok)}

.mbtns{display:inline-flex;gap:5px;margin-left:10px}
.mbtns .btn{padding:3px 11px;font-size:12.5px}

/* 주간 시간표 가져오기 */
.xilist{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto;border:1px solid var(--line2);border-radius:8px;padding:6px}
.xit{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:4px 6px;border-radius:6px}
.xit:hover{background:var(--bg)}
.xk{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--navy-soft);color:var(--navy);white-space:nowrap}
.k-del .xk{background:var(--err-bg);color:var(--err)}.k-add .xk,.k-newcls .xk{background:var(--ok-bg);color:var(--ok)}.k-move .xk{background:var(--warn-bg);color:var(--warn)}
.xw{color:var(--warn);font-weight:800;width:13px;text-align:center}

/* 학생 이름 옮기기 */
.snm{display:inline-flex;align-items:center;gap:1px;border-radius:4px;padding:0 2px;cursor:grab}
.snm:hover{background:rgba(255,255,255,.55);color:#151a26;outline:1px solid rgba(0,0,0,.25)}
.snm .sx{display:none;font-style:normal;font-weight:700;color:var(--err);margin-left:2px;cursor:pointer;padding:0 2px;border-radius:3px}
.snm:hover .sx{display:inline}
.snm .sx:hover{background:var(--err);color:#fff}
body.sdragging .chip.sdrop-ok{box-shadow:inset 0 0 0 2px var(--ok)}
body.sdragging .chip.sdrop-bad{box-shadow:inset 0 0 0 2px var(--err)}
body.sdragging .chip.sdrop-hover{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--sel)}

.dropmenu{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.22);padding:8px;display:flex;flex-direction:column;gap:5px;min-width:230px;max-width:340px}
.dropmenu b{font-size:12.5px;padding:2px 4px 4px}
.dropmenu .btn{text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:1px;white-space:normal}
.dropmenu .btn small{font-size:11px;opacity:.8;font-weight:400}

.sec2{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line2);border-radius:9px;padding:8px 10px}
.unk{display:flex;flex-wrap:wrap;gap:4px 14px;max-height:180px;overflow:auto}

/* 3.10: 이름 줄 맞춤 · 좁은 교시 칸 */
.grid .chip .nm{display:grid;grid-template-columns:repeat(auto-fill,minmax(3.3em,1fr));column-gap:3px;row-gap:0;white-space:nowrap;align-self:stretch;width:100%;box-sizing:border-box}
.grid .chip .nm .sn{overflow:hidden;text-overflow:clip;min-width:0}
.grid .chip .nm .snm{justify-content:flex-start}
.grid th.per{padding:3px 6px;min-width:0;width:1%}
.grid th.per b{font-size:12px}
.grid th.per span{display:block;font-size:10.5px;line-height:1.3}
.grid th.per span.we{color:var(--muted);opacity:.85}

/* 3.11: 카드 명단 펼침 창 */
.cardpop{position:absolute;z-index:60;width:230px;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.22);animation:cpIn .14s ease-out}
@keyframes cpIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cardpop{animation:none}}
.cp-h{display:flex;flex-direction:column;gap:1px;padding:8px 30px 8px 10px;border-radius:11px 11px 0 0;position:relative}
.cp-h b{font-size:14px}.cp-h span{font-size:11.5px;opacity:.85}
.cp-x{position:absolute;right:6px;top:6px;border:0;background:transparent;color:inherit;font-size:16px;cursor:pointer;border-radius:6px;width:22px;height:22px;line-height:20px}
.cp-x:hover{background:rgba(0,0,0,.12)}
.cp-nm{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 6px;padding:10px;font-size:13px}
.cp-nm .snm,.cp-nm .sn{padding:2px 4px;border-radius:5px;background:var(--bg2,rgba(127,127,127,.08));white-space:nowrap}
.cp-nm .snm:hover{background:var(--line);color:inherit;outline:1px solid var(--line2)}
.cp-tip{padding:0 10px 9px;font-size:11px;color:var(--muted)}
body.sdragging .cardpop{opacity:.55}

/* 3.13: 창 제목 줄(출제기처럼 남색) · 부드러운 테두리 */
.titlebar{display:none}
body.exe{padding-top:36px}
body.exe .titlebar{display:flex;position:fixed;left:0;right:0;top:0;height:36px;z-index:70;background:#17243F;color:#C9D2E4;align-items:center;-webkit-app-region:drag;user-select:none;font-size:12.5px;border-bottom:1px solid #0F1A30}
:root[data-theme="dark"] body.exe .titlebar{background:#0E1420;border-bottom-color:#070b13}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.exe .titlebar{background:#0E1420;border-bottom-color:#070b13}}
.titlebar .tb-l{display:flex;align-items:center;gap:8px;padding-left:12px;flex:none}
.titlebar .tb-em{width:18px;height:18px;border-radius:4px}
.titlebar b{color:#fff;font-weight:700;letter-spacing:-.2px;font-size:13px}
.titlebar .tb-c{flex:1;display:flex;align-items:center;gap:8px;padding-left:28px;color:#8F9BB5;min-width:0;white-space:nowrap;overflow:hidden}
.titlebar .tb-c i{font-style:normal;opacity:.55}
.titlebar .tb-c span{color:#E6EAF3}
.titlebar .tb-c #tbMode{color:#8F9BB5}
.titlebar .tb-c #tbMode.ed{color:#F4B860;font-weight:600}
.titlebar .tb-r{display:flex;align-items:center;gap:7px;margin-right:150px;color:#8F9BB5;font-variant-numeric:tabular-nums;flex:none}
.titlebar .tb-dot{width:7px;height:7px;border-radius:50%;background:#6BA84B;box-shadow:0 0 0 3px rgba(107,168,75,.18)}
.titlebar .tb-dot.busy{background:#F4B860;box-shadow:0 0 0 3px rgba(244,184,96,.2)}
body.exe .top{top:36px}
body.exe .saved{display:none}
/* 카드·패널 테두리 */
.card{border-radius:14px;border-color:color-mix(in srgb,var(--line) 80%,transparent);box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px -8px rgba(16,24,40,.08)}
.card-h{padding:11px 16px}
.top{box-shadow:0 1px 0 var(--line2)}
.tabs{border-bottom:0;gap:2px}
.tab{border-radius:9px 9px 0 0}
.pool{border-radius:14px;border-style:dashed;border-color:var(--line)}
.modal .dlg,.dlg{border-radius:16px;box-shadow:0 24px 60px -12px rgba(10,18,40,.35)}
.btn{border-radius:8px}

.tb-win{display:none}
body.ownctl .tb-win{display:flex;position:absolute;right:0;top:0;height:36px;-webkit-app-region:no-drag;z-index:2}
body.ownctl .tb-win button{width:46px;height:36px;border:0;background:transparent;color:#C9D2E4;display:flex;align-items:center;justify-content:center;cursor:default;padding:0}
body.ownctl .tb-win button:hover{background:rgba(255,255,255,.12)}
body.ownctl .tb-win button.x:hover{background:#C42B33;color:#fff}
body.ownctl .tb-win svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1}
body.ownctl .tb-win .i-res{display:none}
body.ownctl.wmax .tb-win .i-res{display:block}
body.ownctl.wmax .tb-win .i-max{display:none}

.mobqr{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}
.qrc{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;color:#111;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.qrc svg{width:150px;height:150px}
.qrc b{font-family:var(--f-mono);font-size:13px}

.mobsec{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.mobsec code.path{font-family:var(--f-mono);font-size:12px;background:var(--line2);padding:4px 8px;border-radius:6px;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.guide{font-size:13px;color:var(--muted)}.guide summary{cursor:pointer;color:var(--fg)}.guide ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:3px}

.stucls{flex-wrap:wrap;gap:6px}
.cchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 8px;background:var(--panel);font-size:13px}
.cchip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.cchip small{color:var(--muted)}
.cchip .cx{border:0;background:transparent;color:var(--err);font-weight:700;cursor:pointer;border-radius:50%;width:20px;height:20px;line-height:18px;padding:0}
.cchip .cx:hover{background:var(--err);color:#fff}

.startbox{margin:18px;padding:18px 22px;border:1.5px dashed var(--line);border-radius:14px;max-width:760px}
.startbox h3{margin:0 0 8px;font-size:15px}.startbox ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}

.syncb{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.syncb.lock{background:var(--warn-bg);color:var(--warn)}.syncb.err{background:var(--err-bg);color:var(--err)}
/* 3.20: 방학 특강 */
.sprow th.per{background:color-mix(in srgb,var(--warn-bg) 70%,var(--panel))}
.sprow td.slot{height:auto;min-height:0;background:color-mix(in srgb,var(--warn-bg) 35%,transparent);vertical-align:top;padding-bottom:4px}
.sprow td.slot.end{border-right:2px solid var(--line)}
#gridScroll .spcell .chip{min-height:0}
.chip.sp{outline:1.5px dashed rgba(0,0,0,.28);outline-offset:-2px}
.chip .spdt{display:block;font-style:normal;font-size:10px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .spdt.on{font-weight:600;opacity:.95}.chip .spdt.past{opacity:.55;text-decoration:line-through}
.spadd{display:block;width:100%;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;font-size:13px;line-height:18px;margin-top:3px;cursor:pointer;padding:0;opacity:.55}
.spcell:hover .spadd,.spadd:focus{opacity:1;color:var(--fg);border-color:var(--muted)}
.spsel{display:inline-flex;align-items:center;gap:6px}
.spsel .btn small{font-weight:400;color:var(--muted)}
.splist{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 14px 0}
.splist>b{font-size:13px;margin-right:4px}
.spdlg .spstu{display:flex;flex-wrap:wrap;gap:2px 14px;max-height:220px;overflow:auto;border:1px solid var(--line2);border-radius:9px;padding:8px 10px;align-content:flex-start}
.spdlg .spstu .chk{min-width:150px}
.spdlg .spg{width:100%;font-size:11.5px;color:var(--muted);margin-top:4px;border-bottom:1px solid var(--line2)}
.spdlg .pal button.on{outline:2px solid var(--navy);outline-offset:2px}
.spst{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--line2);color:var(--muted);white-space:nowrap}
.spst.on{background:var(--ok-bg);color:var(--ok)}.spst.soon{background:var(--info-bg);color:var(--info)}
.pgsp{margin-top:6px;font-size:9px}.pgsp .h{padding:0 4px;border-radius:3px;margin-right:2px}
.pt td.p span{display:block;font-weight:400;font-size:8px;color:#666}
.titlebar .tb-c .lm{color:#8F9BB5;font-size:11.5px}
.chip.sp small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.keybar{background:var(--warn-bg)}

/* 3.21 도움말 */
.tab.helptab{margin-left:auto}
.helpw{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;padding:14px 16px 24px}
.helptoc{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(var(--toph,100px) + 8px);align-self:start}
.helptoc button{border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:8px;color:var(--fg);cursor:pointer;font-size:13.5px}
.helptoc button:hover{background:var(--line2)}
.helpbody{max-width:860px;font-size:14px;line-height:1.7}
/* 도움말 그림 — 데모 화면 캡처 · 처음 열 때 불러와 살며시 */
.hfig{width:fit-content;max-width:100%;min-width:260px;margin:10px 0 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:0 1px 3px rgba(16,24,40,.06)}
.hfig .hfi{min-height:120px;background:linear-gradient(90deg,var(--line2) 0%,transparent 50%,var(--line2) 100%);background-size:200% 100%;animation:hfsh 1.4s linear infinite}
.hfig.on .hfi{min-height:0;background:none;animation:none}.hfig img{display:block;max-width:100%;width:auto;height:auto;animation:hfin .35s ease}
.hfig.none{display:none}
.hfig figcaption{padding:8px 12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line2);line-height:1.5}
.hrow{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}.hrow .hfig{flex:0 1 auto;max-width:280px;min-width:0;margin:0}.hrow .hfig img{width:100%}
@keyframes hfsh{from{background-position:200% 0}to{background-position:0 0}}@keyframes hfin{from{opacity:0}to{opacity:1}}
.hmode{margin-left:8px}.hadm section h3::before{content:'관리자';font-size:10.5px;font-weight:700;color:#7a5a12;background:rgba(224,163,58,.18);border-radius:999px;padding:2px 8px;margin-right:8px;vertical-align:middle}
.hacc{margin:10px 0;font-size:13px}.hacc td,.hacc th{text-align:center}
.helpbody section{padding:4px 0 14px;border-bottom:1px solid var(--line2);margin-bottom:10px;scroll-margin-top:calc(var(--toph,100px) + 12px)}
.helpbody h3{margin:6px 0 6px;font-size:16px}
.helpbody ul,.helpbody ol{margin:4px 0;padding-left:22px}.helpbody li{margin:2px 0}
.helpbody a{color:var(--info);cursor:pointer;text-decoration:underline}
@media (max-width:900px){.helpw{grid-template-columns:1fr}.helptoc{position:static;flex-direction:row;flex-wrap:wrap}}

/* 설정 접고 펼치기 */
details.acc{border-bottom:1px solid var(--line2)}
details.acc>summary{list-style:none;display:flex;align-items:baseline;gap:14px;padding:15px 18px;cursor:pointer;user-select:none;transition:background-color .15s}

details.acc>summary .accs{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
details.acc>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 0 auto;align-self:center;transition:transform .2s;flex:none}

/* ===== 부드러운 움직임 (우아하게) ===== */
:root{--ease:cubic-bezier(.22,.61,.36,1)}
.btn,.tabs button,.seg button,.dbtn,.cchip,.tgl,.tgl i,select,input{transition:background-color .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease),box-shadow .18s var(--ease)}
.chip{transition:box-shadow .2s var(--ease),transform .2s var(--ease),filter .2s var(--ease)}
.modal:not([hidden]){animation:ymFade .22s var(--ease)}
.modal:not([hidden]) .dlg{animation:ymRise .3s var(--ease)}
#cardPop:not([hidden]){animation:ymPop .24s var(--ease);transform-origin:top left}
.toast{transform:translate(-50%,10px);transition:opacity .25s var(--ease),transform .3s var(--ease)}
.toast.on{transform:translate(-50%,0)}
#view.vin{animation:ymFade .26s var(--ease)}
@keyframes ymFade{from{opacity:0}to{opacity:1}}
@keyframes ymRise{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes ymPop{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}

/* 보관함: 표와 겹치지 않게 (화면 폭으로만 정해서 깜빡임 없음) */
.pool{background:var(--panel);z-index:6}
/* 수정 모드에선 시간표가 자기 칸 안에서 가로·세로로 스크롤(머리줄·교시 칸 고정) → 보관함과 절대 안 겹침 */
body.editing #gridScroll{overflow:auto!important;max-height:calc(100vh - var(--toph,100px) - 18px)!important;--toph:0px;scrollbar-gutter:stable}
body.editing #gridScroll .grid thead th{z-index:3}
/* 창이 넓지 않으면 보관함은 얇은 세로 탭 → 올리거나 끌어 오면 펼쳐짐 */
@media (max-width:1760px){
 body.editing .gwrap .pool{width:40px;padding:10px 4px;overflow:hidden;transition:width .28s var(--ease),margin-left .28s var(--ease),box-shadow .28s var(--ease),padding .28s var(--ease)}
 body.editing .gwrap .pool>*{opacity:0;pointer-events:none;transition:opacity .18s var(--ease)}
 body.editing .gwrap .pool{position:sticky}
 body.editing .gwrap .pool::before{content:"보관함";position:absolute;top:14px;left:50%;transform:translateX(-50%);writing-mode:vertical-rl;letter-spacing:4px;font-weight:700;font-size:12.5px;color:var(--muted);transition:opacity .15s var(--ease)}
 body.editing .gwrap .pool:hover,body.editing .gwrap .pool.drop{width:210px;margin-left:-170px;padding:8px;box-shadow:-10px 0 30px -12px rgba(10,18,40,.35)}
 body.editing .gwrap .pool:hover>*,body.editing .gwrap .pool.drop>*{opacity:1;pointer-events:auto}
 body.editing .gwrap .pool:hover::before,body.editing .gwrap .pool.drop::before{opacity:0}
 body.editing .gwrap .pool:not(:hover):not(.drop)>*{transition-duration:.08s}
 body.editing .gwrap .pool,body.editing .gwrap .pool:hover,body.editing .gwrap .pool.drop{height:calc(100vh - var(--toph,100px) - 26px);max-height:none;box-sizing:border-box}
 body.editing .gwrap .pool:hover,body.editing .gwrap .pool.drop{overflow-y:auto}
}

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          } else {
            _modules[row + r][col + c] = false;
          }

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

                  || (r == 0 && c == 0) ) {

              } else {
                _modules[row + r][col + c] = false;

          }

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {

        } else {

        }

        }

                dark = !dark;

                byteIndex += 1;
                bitIndex = 7;
              }

          }

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {

            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {

            index += 1;
          }

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {

    _this.getModuleCount = function() {

    };

          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );

    _this.createTableTag = function(cellSize, margin) {

      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';

      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +

      qrSvg += '<path d="';

      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);

      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);

        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }

    };

    var _createHalfASCII = function(margin) {

      var max = size - margin;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {

        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {

            p += '█';

      var max = size - margin;

function analyze(){
  const v=V(),out=[];

  v.sessions.forEach(o=>{const no=activeMembers(o).filter(id=>av(id,o.d,o.p)==='no');if(no.length)out.push({lv:'err',k:'학생 수업 불가',m:`${no.map(sname).join(', ')} · ${o.d} ${pname(o.d,o.p)}은(는) 수업 불가 시간인데 ${C(o.cls).name}(${tn(o.t)}) 배치`,ids:[o.id],stu:no[0]})});
  B().students.forEach(st=>{if(st.status==='휴원'||!st.avail)return;const pr=Object.entries(st.avail).filter(([k,v])=>v==='pref');if(!pr.length)return;
    const os=v.sessions.filter(o=>activeMembers(o).includes(st.id));const out2=os.filter(o=>st.avail[o.d+'|'+o.p]!=='pref');
    if(out2.length)out.push({lv:'info',k:'선호 시간 밖',m:`${sname(st.id)} · 수업 ${os.length}개 중 ${out2.length}개가 선호 시간 밖 (${out2.map(o=>o.d+pname(o.d,o.p).replace(/저녁 |주말 |교시/g,'')).join(', ')})`,ids:out2.map(o=>o.id),stu:st.id})});
  v.sessions.forEach(o=>{if(isEarly(o.d,o.p)&&!vacationNow()){const h=activeMembers(o).filter(isHigh);if(h.length)out.push({lv:'err',k:'시간대 불가',m:`${C(o.cls).name} · ${o.d} ${ptime(o.d,o.p)} 초등부 시간에 고등학생 ${h.length}명`,ids:[o.id]})}});
  const stk={};v.sessions.forEach(o=>{const k=o.d+'|'+o.p+'|'+o.t;(stk[k]=stk[k]||[]).push(o)});
  Object.values(stk).forEach(os=>{if(os.length>1){const o=os[0];out.push({lv:'warn',k:'겹쳐 둔 칸',m:`${o.d} ${pname(o.d,o.p)} ${tn(o.t)}T에 ${os.map(x=>C(x.cls).name).join(' / ')} (고민 중)`,ids:os.map(x=>x.id)})}});
  v.sessions.forEach(o=>{if(o.p>=per(o.d).length)out.push({lv:'err',k:'없는 교시',m:`${C(o.cls).name} · ${o.d}요일 교시가 삭제돼 표시되지 않아요`,ids:[o.id]})});
  v.sessions.forEach(o=>{const t=T(o.t);if(t&&(t.off||[]).includes(o.d))out.push({lv:'warn',k:'강사 휴무일',m:`${t.name}T 휴무 요일(${o.d})에 ${C(o.cls).name} 배치`,ids:[o.id]})});
  v.classes.forEach(c=>{Object.keys({...c.rule,...countBy(c.id)}).forEach(t=>{const want=c.rule[t]||0,have=countBy(c.id)[t]||0;
    if(want>have)out.push({lv:'warn',k:'배치 대기',m:`${c.name} · ${tn(t)}T ${want-have}타임 아직 안 넣음 (규칙 ${want}회)`,ids:v.sessions.filter(o=>o.cls===c.id).map(o=>o.id),cls:c.id});
    else if(want<have)out.push({lv:'warn',k:'주당 횟수',m:`${c.name} · ${tn(t)}T 규칙 ${want}회인데 ${have}회 배치`,ids:v.sessions.filter(o=>o.cls===c.id&&o.t===t).map(o=>o.id),cls:c.id})})});
  const by={};v.sessions.forEach(o=>activeMembers(o).forEach(id=>{(by[id]=by[id]||[]).push(o)}));

  v.sessions.forEach(o=>{if(!members(o).length)out.push({lv:'warn',k:'명단 없음',m:`${C(o.cls).name} · ${tn(o.t)}T 수업에 학생 명단이 없어요`,ids:[o.id],cls:o.cls})});
  const inAny=new Set();v.sessions.forEach(o=>members(o).forEach(id=>inAny.add(id)));

  const preNone=B().students.filter(s=>isPre(s)&&!inAny.has(s.id)); // 입학 예정: 반에 넣었으면 경고 없음 · 아직 반이 없으면 알려 주기만
  if(preNone.length)out.push({lv:'info',k:'입학 예정 · 반 없음',m:`${preNone.map(s=>`${sname(s.id)}(${mdS(s.from)}~)`).join(', ')} · 아직 반에 안 넣었어요`,ids:[]});
  const away=B().students.filter(s=>s.status==='휴원'&&v.classes.some(c=>Object.values(c.members).some(a=>a.includes(s.id))));
  if(away.length)out.push({lv:'info',k:'휴원생',m:`${away.map(s=>s.name).join(', ')} · 휴원 중이라 점검·인원에서 빠짐 (명단엔 남아 있음)`,ids:v.sessions.filter(o=>members(o).some(id=>away.some(s=>s.id===id))).map(o=>o.id)});
  B().students.filter(s=>s.quick&&!offS(s)&&(!s.school||!s.grade)).forEach(s=>out.push({lv:'info',k:'신입 정보',m:`${s.name} · ${!s.school&&!s.grade?'학교·학년':!s.school?'학교':'학년'}을 아직 안 넣었어요 (눌러서 입력)`,ids:v.sessions.filter(o=>members(o).includes(s.id)).map(o=>o.id),stu:s.id,qa:s.id}));
  if(typeof RQS!=='undefined'&&RQS.n)out.push({lv:'info',k:'선생님 보강 등록',m:`선생님 보강 등록 ${RQS.n}건이 승인을 기다려요 (눌러서 확인)`,ids:[],rq:1});
  spIssues(out,v);
  try{if(typeof moreIssues==='function')moreIssues(B(),out)}catch(e){console.warn(e)}
  return out;
}
let _cnt=null;
function countBy(cid){if(!_cnt){_cnt={};V().sessions.forEach(o=>{_cnt[o.cls]=_cnt[o.cls]||{};_cnt[o.cls][o.t]=(_cnt[o.cls][o.t]||0)+1})}return _cnt[cid]||{}}
function waiting(){const w=[];V().classes.forEach(c=>Object.entries(c.rule).forEach(([t,n])=>{const k=n-(countBy(c.id)[t]||0);for(let i=0;i<k;i++)w.push({cls:c.id,t})}));return w}

/* 끼워 넣기 가능 여부 */
function fitMap(pk){
  // pk: {sid?:세션id, cls, t}. 모든 강사 칸에 대해 계산 (다른 강사 칸 = 담당 강사 변경)
  const res={};const c=C(pk.cls);if(!c)return res;
  const others=V().sessions.filter(o=>o.id!==pk.sid);
  B().teachers.forEach(t=>{
    const mem=((c.members[t.id]!==undefined?c.members[t.id]:c.members[pk.t])||[]).filter(active);
    DAYS.forEach(d=>per(d).forEach((_,p)=>{
      const key=d+'|'+p+'|'+t.id;const occs=sessionsAt(d,p,t.id);const occ=null;
      if(occs.some(x=>x.id===pk.sid)){res[key]={lv:'self'};return}
      const at=others.filter(o=>o.d===d&&o.p===p);
      const clash=mem.filter(id=>at.some(o=>activeMembers(o).includes(id)));
      if(clash.length){res[key]={lv:'bad',why:'겹침: '+clash.map(sname).join(', ')};return}
      if(isEarly(d,p)&&mem.some(isHigh)){res[key]={lv:'bad',why:'고등학생은 초등부 시간 불가'};return}
      const noS=mem.filter(id=>av(id,d,p)==='no');if(noS.length){res[key]={lv:'bad',why:'수업 불가: '+noS.map(sname).join(', ')};return}
      const prS=mem.filter(id=>av(id,d,p)==='pref');
      const why=[];let lv='ok';
      if(t.id!==pk.t)why.push(`담당 ${tn(pk.t)}T → ${t.name}T`);
      if((t.off||[]).includes(d)){lv='warn';why.push(`${t.name}T 휴무일`)}
      let near=0,gap=[];
      mem.forEach(id=>{const ps=others.filter(o=>o.d===d&&o.id!==(occ&&occ.id)&&activeMembers(o).includes(id)).map(o=>o.p);if(!ps.length)return;
        const all=[...new Set([...ps,p])].sort((a,b)=>a-b);if(all[all.length-1]-all[0]!==all.length-1)gap.push(id);else near++});
      if(gap.length){lv='warn';why.push('연강 깨짐: '+gap.map(sname).join(', '))}
      else if(near&&lv==='ok'){lv='good';why.push(`연강 맞음 (${near}명)`)}
      if(prS.length){why.push(`선호 ${prS.length}명`);if(lv==='ok')lv='good'}
      res[key]={lv,why:why.join(' · ')||'넣을 수 있음'};
    }));
  });
  return res;
}
// 담당 강사 바꾸기: 새 강사 명단이 없으면 원래 명단을 복사, 주당 횟수도 옮김
function shiftTeacher(cid,from,to){if(from===to)return;const c=C(cid);if(!c)return;
  if(c.members[to]===undefined)c.members[to]=(c.members[from]||[]).slice();
  c.rule[from]=Math.max(0,(c.rule[from]||0)-1);c.rule[to]=(c.rule[to]||0)+1;}

/* ================= 공통 그리기 ================= */
function chip(o,opt={}){
  const c=C(o.cls);if(!c)return'';const bg=c.color||'#9aa3b5',fg=txtColor(bg);
  const cl=['chip'];if(UI.hl.size)cl.push(UI.hl.has(o.id)?'hl':'dim');else if(UI.picked&&UI.same===o.cls&&UI.picked.sid!==o.id)cl.push('same');if(opt.bad&&opt.bad.has(o.id))cl.push('bad');if(UI.picked&&UI.picked.sid===o.id)cl.push('picked');
  const mem=members(o),act=mem.filter(active);
  const npre=mem.filter(id=>isPre(S(id))).length;const sub=opt.sub??`${tn(o.t)}T · ${act.length}명${npre?` +${npre} 예정`:''}`;
  const ed=UI.edit&&UI.view==='grid'&&opt.drag!==false;
  const nm=opt.names?`<span class="nm">${mem.map(id=>{const s0=S(id);const n=(s0&&s0.status==='휴원')?`<s>${esc(sname(id))}</s>`:esc(sname(id))+nameMark(id);return ed?`<span class="snm sn" draggable="true" data-snm="${id}" data-from="${o.id}" title="끌어서 다른 반 카드에 놓으면 반 전체·이 수업만·복사 중에 골라요">${n}<i class="sx" data-sx="${id}|${o.id}" title="이 반에서 빼기 (Shift=이 수업만)">×</i></span>`:`<span class="sn">${n}</span>`}).join('')}</span>`:'';
  const ex=typeof exNear==='function'?exNear(o.id):null;if(ex&&ex.kind==='cancel')cl.push('excancel');

function perLabelFor(days,p){const a=per(days[0])[p];const we=days.find(d=>/[토일]/.test(d)&&d!==days[0]);const b=we&&per(we)[p];
  const sh=n=>esc(String(n||'').replace(/^(저녁|주말)\s*/,''));

function moveStudent(id,fromSid,toSid,mode){const v=V();const fo=v.sessions.find(x=>x.id===fromSid),to=v.sessions.find(x=>x.id===toSid);if(!fo||!to)return;
  const fc=C(fo.cls),tc=C(to.cls);if(!fc||!tc)return;
  /* 같은 반이라도 강사가 다르면 명단이 따로라 옮기거나 더할 수 있음 (예: 고1 A2 서성완T → 고1 A2 천상원T) */
  const same=fo.cls===to.cls;if(same&&fo.t===to.t){toast('이미 이 수업이에요');return}if(same&&mode==='all')mode='one';
  const tTs=(mode==='one'||same)?[to.t]:Object.keys(tc.members).length?Object.keys(tc.members):[to.t];
  if(tTs.every(t=>(tc.members[t]||[]).includes(id))){toast(`${sname(id)}은(는) 이미 ${tc.name}에 있어요`);return}
  commit(()=>{const f=C(fo.cls),k=C(to.cls);
    if(mode!=='copy'){(mode==='one'?[fo.t]:Object.keys(f.members)).forEach(t=>{f.members[t]=(f.members[t]||[]).filter(x=>x!==id)});if(!same)schedDel(f,id,mode==='one'?fo.t:null)}
    tTs.forEach(t=>{k.members[t]=k.members[t]||[];if(!k.members[t].includes(id))k.members[t].push(id);schedAdd(k,t,id)})},
    `${sname(id)}: ${mode==='copy'?'':fc.name+(mode==='one'?`(${tn(fo.t)})`:'')+' → '}${tc.name}${mode==='one'?`(${tn(to.t)})`:''}${mode==='copy'?'에 추가 (원래 반에도 남김)':''}${schedMsg(tc)}`)}
/* 예정 시간표 같이 고치기: 지금 시간표에서 반에 학생을 넣거나 빼면, 바뀔 예정 시간표의 같은 이름 반에도 똑같이 */
function schedVer(){const b=B();if(!b.sched||V().id!==b.current)return null;const sv=b.versions.find(x=>x.id===b.sched.ver);return sv&&sv.id!==b.current?sv:null}
function schedTwin(c){const sv=schedVer();return sv&&c?{sv,tw:sv.classes.find(x=>tnm(x.name)===tnm(c.name))||null}:null}
function schedAdd(c,t,id){const r=schedTwin(c);if(!r||!r.tw)return;const m=r.tw.members=r.tw.members||{};const key=(m[t]!==undefined||r.sv.sessions.some(o=>o.cls===r.tw.id&&o.t===t))?t:Object.keys(m)[0];if(!key)return;m[key]=m[key]||[];if(!m[key].includes(id))m[key].push(id)}
function schedDel(c,id,t){const r=schedTwin(c);if(!r||!r.tw)return;Object.keys(r.tw.members||{}).forEach(k=>{if(t&&k!==t&&r.tw.members[t]!==undefined)return;r.tw.members[k]=r.tw.members[k].filter(x=>x!==id)})}
function schedMsg(c){const r=schedTwin(c);if(!r)return '';return r.tw?` · 예정 시간표(${mdS(B().sched.from)}~)에도 반영`:` · 예정 시간표엔 '${c.name}' 반이 없어요`}

/* 반 색 자동 정리: 시간표에서 옆·위아래로 붙어 있는 반끼리 최대한 다른 파스텔 색이 되게 배정 */
function hexLab(h){h=h.replace('#','');let [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(c=>c>0.04045?Math.pow((c+0.055)/1.055,2.4):c/12.92);
  let x=(r*0.4124+g*0.3576+b*0.1805)/0.95047,y=r*0.2126+g*0.7152+b*0.0722,z=(r*0.0193+g*0.1192+b*0.9505)/1.08883;const f=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116;
  [x,y,z]=[f(x),f(y),f(z)];return [116*y-16,500*(x-y),200*(y-z)]}
function cdist(a,b){const A=hexLab(a),B=hexLab(b);return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2])}

function recolorVersion(v,rand){const b=B();const tord={};b.teachers.forEach((t,i)=>tord[t.id]=i);const adj={};const add=(x,y,w)=>{if(x===y)return;adj[x]=adj[x]||{};adj[y]=adj[y]||{};adj[x][y]=(adj[x][y]||0)+w;adj[y][x]=(adj[y][x]||0)+w};
  v.sessions.forEach(o=>v.sessions.forEach(q=>{if(o===q)return;
    if(o.d===q.d&&o.p===q.p)add(o.cls,q.cls,Math.abs((tord[o.t]??0)-(tord[q.t]??0))<=1?3:1);   // 같은 시간(옆 칸은 더 중요)
    else if(o.d===q.d&&o.t===q.t&&Math.abs(o.p-q.p)===1)add(o.cls,q.cls,2)}));             // 같은 강사 위아래 교시
  const ids=v.classes.map(c=>c.id).sort((x,y)=>Object.keys(adj[y]||{}).length-Object.keys(adj[x]||{}).length);
  const used=new Set(),col={};
  const pal=rand?PALETTE.slice().sort(()=>Math.random()-.5):PALETTE;if(rand)ids.sort(()=>Math.random()-.5);
  ids.forEach(id=>{let best=null,bs=-1;pal.forEach(p=>{if(used.has(p))return;const ns=Object.entries(adj[id]||{}).filter(([n])=>col[n]);
      const score=ns.length?Math.min(...ns.map(([n,w])=>cdist(p,col[n])/Math.sqrt(w))):100;const sc=rand&&ns.length?score*(0.7+Math.random()*0.6):score;if(sc>bs){bs=sc;best=p}});
    col[id]=best||PALETTE[Math.floor(Math.random()*PALETTE.length)];used.add(col[id])});
  v.classes.forEach(c=>{if(col[c.id])c.color=col[c.id]})}

/* ================= 명부 가져오기 ================= */
function parseRoster(buf){
  let txt=new TextDecoder('euc-kr').decode(buf);
  if(/charset\s*=\s*["']?utf-?8/i.test(txt.slice(0,600)))txt=new TextDecoder('utf-8').decode(buf);
  const doc=new DOMParser().parseFromString(txt,'text/html');
  const tables=[...doc.querySelectorAll('table')];
  let tb=null,hdrRow=-1;
  for(const t of tables){const rows=[...t.rows];const i=rows.findIndex(r=>[...r.cells].some(c=>c.textContent.trim()==='학생')&&[...r.cells].some(c=>c.textContent.trim()==='반'));if(i>=0&&(!tb||rows.length<tb.rows.length||true)){tb=t;hdrRow=i}}
  if(!tb)throw new Error('명부 표(학생·반 칸)를 찾지 못했어요');
  const rows=[...tb.rows];const grid=[];const pend=[];
  rows.forEach((r,ri)=>{const line=[];let ci=0;
    const fill=()=>{while(pend[ci]&&pend[ci].left>0){line[ci]=pend[ci].v;pend[ci].left--;ci++}};
    fill();[...r.cells].forEach(c=>{fill();const v=c.textContent.replace(/ /g,' ').trim();const cs=+c.colSpan||1,rs=+c.rowSpan||1;for(let k=0;k<cs;k++){line[ci]=v;if(rs>1)pend[ci]={v,left:rs-1};ci++}});fill();grid.push(line)});
  const hd=grid[hdrRow];const ix=n=>hd.findIndex(x=>x===n);
  const I={no:ix('No'),name:ix('학생'),school:ix('학교'),grade:ix('학년'),cls:ix('반'),from:hd.findIndex(x=>/^(입학일|입학일자|입학 일자|입원일|등록일)$/.test(String(x||'').trim()))};
  const dt=v=>{const m=/(\d{4})[.\-/년\s]*(\d{1,2})[.\-/월\s]*(\d{1,2})/.exec(String(v||''));if(!m)return '';const d=`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;return +m[2]>=1&&+m[2]<=12&&+m[3]>=1&&+m[3]<=31?d:''};
  /* 연락처 칸: 머리에 연락처·전화·휴대폰 등이 있으면 — 학부모·보호자·어머니·아버지 말이 있으면 학부모, 아니면 학생 */
  const PH=/연락처|전화|휴대|핸드폰|HP|폰/i,PAR=/학부모|보호자|부모|어머니|엄마|아버지|아빠|모친|부친|\(모\)|\(부\)|^모|^부/;
  const phCols=hd.map((h,i)=>({h:String(h||'').trim(),i})).filter(x=>PH.test(x.h)&&x.i!==I.name);
  const parCols=phCols.filter(x=>PAR.test(x.h)).map(x=>({i:x.i,l:(x.h.replace(PH,'').replace(/[()\s·_-]|번호|연락/g,'').trim()||'학부모').replace(/^부$/,'아버지').replace(/^모$/,'어머니')}));
  /* 학생 번호 칸: 핸드폰·휴대폰을 먼저, 없으면 연락처·전화번호 (집 전화가 '--'로 비어 있어도 핸드폰 칸에서 읽음) */
  const pri=h=>/핸드폰|휴대|HP|폰/i.test(h)?0:/연락처/.test(h)?1:2;
  const stuCols=phCols.filter(x=>!PAR.test(x.h)).sort((a,z)=>pri(a.h)-pri(z.h)).map(x=>x.i);

function applyRoster(list,skip){
  const res={total:list.length,added:[],changed:[],missing:[],ph:list.filter(r=>r.ph||(r.pa&&r.pa.length)).length,from:0,hasFrom:list.some(r=>r.from)};

  commit(()=>{const b=B();const seen=new Set();
    rosterMatch(b,list,skip).forEach(({r,s})=>{
      if(s){seen.add(s.id);const ch=s.school!==r.school||s.grade!==r.grade||offS(s);if(isOut(s)){s.hist=s.hist||[];s.hist.push({in:s.from||s.at||'',out:s.out||''});s.re=1;s.status='재원';delete s.out;(res.re=res.re||[]).push(r.name)}if(s.status==='예정'&&!isPre(s))s.status='재원';s.school=r.school;s.grade=r.grade;s.rosterClasses=r.classes;delete s.quick;if(s.status==='휴원')s.status='재원';
        if(r.ph)s.ph=r.ph;if(r.pa&&r.pa.length)s.pa=r.pa;setFrom(s,r);if(ch)res.changed.push(r.name)}
      else{const s={id:uid('s'),name:r.name,school:r.school,grade:r.grade,status:'재원',rosterClasses:r.classes,...(r.ph?{ph:r.ph}:{}),...(r.pa&&r.pa.length?{pa:r.pa}:{})};setFrom(s,r);b.students.push(s);seen.add(s.id);res.added.push(r.name)}
    });
    b.students.forEach(s=>{if(!seen.has(s.id)&&!offS(s)&&s.status!=='예정')res.missing.push(s.id)});
    if(typeof iqCloseStudents==='function')res.iqDone=iqCloseStudents(b); /* 3.73.6: 학생이 된 입학 문의는 입학 완료로 */
    if(res.hasFrom){const L=b.students.filter(s=>seen.has(s.id));res.nNew=L.filter(isNewS).map(s=>s.name);res.nPre=L.filter(isPre).map(s=>s.name);res.nCs=L.filter(s=>csTgt(s)&&!s.cs).length}
  },`명부 ${list.length}명을 반영했어요`);
  UI.importRes=res;render();
}

function pgBranch(){

  return groups.map(days=>{const cols=[];days.forEach(d=>{const ts=b.teachers.filter(t=>!(t.off||[]).includes(d)||v.sessions.some(o=>o.d===d&&o.t===t.id));ts.forEach((t,i)=>cols.push({d,t,first:i===0,n:ts.length}))});

      cols.forEach(c=>{if(p>=per(c.d).length){h+='<td class="x"></td>';return}const oss=sessionsAt(c.d,p,c.t.id);const o=oss[0];
        if(!o){h+=`<td${(c.t.off||[]).includes(c.d)?' class="x"':''}>${c.first&&/[토일]/.test(c.d)?`<span class="hint">${esc(ptime(c.d,p))}</span>`:''}</td>`;return}

  const slots=[];DAYS.forEach(d=>per(d).forEach((_,p)=>slots.push({d,p,k:d+'|'+p,early:isEarly(d,p),grp:'월수금일'.includes(d)?0:1})));

  const tIdx={};B().teachers.forEach((t,k)=>tIdx[t.id]=k);const NT=B().teachers.length+1;const TI=targets.map(x=>tIdx[x.t]??NT-1);

  const gain=targets.map((x,i)=>{const g=new Float32Array(NS),pc=new Int16Array(NS);slots.forEach((sl,si)=>{let v=0,c=0;for(const id of M[i]){if(av(id,sl.d,sl.p)==='pref'){v+=opt.wPref;c++}}
      if(sl.early&&!M[i].every(id=>/^초/.test((S(id)||{}).grade||'')))v-=1;if(opt.wKeep&&x.orig===sl.k)v+=opt.wKeep;g[si]=v;pc[si]=c});return {g,pc}});
  const fixMask=new Int32Array(NSt*ND);fixed.forEach(o=>activeMembers(o).forEach(id=>{if(sid[id]!==undefined)fixMask[sid[id]*ND+DAYS.indexOf(o.d)]|=1<<o.p}));
  const cIdx={};targets.forEach(x=>{if(cIdx[x.cls]===undefined)cIdx[x.cls]=Object.keys(cIdx).length});const NC=Object.keys(cIdx).length;const CI=targets.map(x=>cIdx[x.cls]);
  const tslot=new Int32Array(NS*NT),mask=new Int32Array(NSt*ND),ctd=new Int32Array(NC*NT*ND),cg=new Int32Array(NC*2);let stamp=0;
  const pc=x=>{x=x-((x>>1)&0x55555555);x=(x&0x33333333)+((x>>2)&0x33333333);return(((x+(x>>4))&0xF0F0F0F)*0x1010101)>>24};
  function score(a){let hard=0,soft=0,pref=0,gap=0;stamp++;mask.set(fixMask);ctd.fill(0);cg.fill(0);
    for(let i=0;i<N;i++){const si=a[i];if(si<0)continue;const k=si*NT+TI[i];if(tslot[k]===stamp)hard++;else tslot[k]=stamp;
      soft+=gain[i].g[si];pref+=gain[i].pc[si];const d=sD[si],bit=1<<sP[si],mi=MI[i];
      for(let q=0;q<mi.length;q++){const z=mi[q]*ND+d;if(mask[z]&bit)hard++;mask[z]|=bit}
      const cz=(CI[i]*NT+TI[i])*ND+d;if(ctd[cz])soft-=4;ctd[cz]=1;cg[CI[i]*2+sG[si]]++}
    for(let z=0;z<NSt*ND;z++){const m=mask[z];if(!m||!(m&(m-1)))continue;const lo=31-Math.clz32(m&-m),hi=31-Math.clz32(m);const n=pc(m);const sp=hi-lo+1-n;if(sp>0){gap+=sp;soft-=opt.wGap*sp}else soft+=opt.wNear*(n-1)}

    function one(){

      for(const i of order){if(!dom[i].length){a[i]=-1;continue}const cand=dom[i].slice().sort(()=>Math.random()-.5);let pick=cand[0];

        let j=-1,old=a[i],oldj;
        if(Math.random()<0.3){j=Math.floor(Math.random()*N);if(j===i||targets[j].t!==targets[i].t||!dom[j].includes(a[i])||!dom[i].includes(a[j]))j=-1}

        const nx=score(a);const dlt=nx.total-cur.total;
        if(dlt>=0||Math.random()<Math.exp(dlt/T0)){cur=nx;if(nx.total>best.sc.total)best={a:a.slice(),sc:nx}}else{a[i]=old;if(j>=0)a[j]=oldj}}
      const sig=best.a.join(',');if(!found.has(sig))found.set(sig,best);

    function finish(){
      const all=[...found.values()].sort((x,y)=>y.sc.total-x.sc.total);const list=[];
      for(const s of all){const diff=list.every(o=>o.a.filter((v,i)=>v!==s.a[i]).length>=Math.max(1,Math.round(N*0.12)));if(diff)list.push(s);if(list.length>=5)break}
      resolve({targets,slots,list:list.map(s=>({a:s.a,sc:s.sc,moved:s.a.filter((v,i)=>v>=0&&targets[i].orig!==slots[v].k).length})),bad})}
    setTimeout(one,0)})
}

<script>/* ================= 학원 관리 프로그램 주간 시간표 가져오기 (AI 없이 규칙으로만) =================
   파일: 강사별 주간 시간표 .xls(HTML) — 행 = 시간("17:00시"), 열 = 일~토, 칸 = "반이름(완)[강사]" + 학생 줄(○/X/- 표시 + 이름)

const XI={files:[],res:null};
function parseWeekly(buf,fname){

  if(!t){if([...doc.querySelectorAll('td')].some(c=>/^(일|월)$/.test(c.textContent.trim())))throw new Error(`${fname}: 월간 달력이에요. 주간 시간표로 뽑아 주세요`);throw new Error(`${fname}: 주간 시간표 표를 찾지 못했어요`)}
  const hd=[...t.rows[0].cells].map(c=>c.textContent.trim());const out=[];
  [...t.rows].slice(1).forEach(r=>{const m=/(\d{1,2}):(\d{2})/.exec(r.cells[0]?.textContent||'');if(!m)return;const time=m[1].padStart(2,'0')+':'+m[2];
    [...r.cells].slice(1).forEach((c,ci)=>{const d=hd[ci+1];if(!DAYS.includes(d))return;let cur=null;

        if(cm&&el.querySelector('small')){cur={d,time,label:cm[1].trim(),tname:cm[2].trim(),names:[]};out.push(cur);return}
        if(cur){const nm=line.replace(/^[-○XxＸ△◎●◇◆□■☆★✓✔·]+\s*/,'').trim();if(nm)cur.names.push(nm)}})})});
  return out}

<script>/* ================= 구글 시트(엑셀) 시간표 가져오기 — AI 없이 규칙으로만 =================

async function readSheet(z,path){const ssx=await z.text('xl/sharedStrings.xml');const ss=ssx?tagsNS(xmlDoc(ssx),'si').map(si=>tagsNS(si,'t').map(t=>t.textContent).join('')):[];

    if(t==='s'&&v)val=ss[+v.textContent];else if(t==='inlineStr')val=tagsNS(c,'t').map(x=>x.textContent).join('');else if(v)val=t==='str'?v.textContent:(isNaN(+v.textContent)?v.textContent:+v.textContent);

async function siParse(){SI.busy=true;renderSI();try{const cells=await readSheet(SI.z,SI.sheet);const g=parseGridSheet(cells);SI.res=siResolve(g)}catch(e){SI.res={err:e.message}}SI.busy=false;renderSI()}
function siResolve(g){const b=B();const res={g,dup:{},unknown:{},newT:[],choice:{},keepUnknown:{}};
  const byName={};b.students.forEach(s=>(byName[s.name]=byName[s.name]||[]).push(s));

function renderSI(){const R=SI.res;let h=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="siTitle" style="width:min(920px,100%)"><h2 id="siTitle">시트 시간표 가져오기 · ${esc(B().name)}</h2>

async function syJoin(){const code=$('sjCode').value.trim(),name=$('sjName').value.trim();if(!code){toast('코드를 붙여넣어 주세요');return}if(!name){toast('이름을 넣어 주세요');return}
  if(UI.edit){toast('수정 모드를 먼저 끝내 주세요');return}toast('연결하는 중…');
  const r=await bridge.syncJoin(code,name);if(!r.ok){toast(r.err,5000);return}SYNC.info=r.info;if(isStaff()||SYNC.info.role==='branch')DB.currentBranch=myBr();
  try{await bridge.backupNamed(JSON.stringify(DB),'연동전')}catch(e){}
  const p=await bridge.syncPull({});if(!p.ok){toast('받지 못했어요: '+p.err,5000);return}
  const bs=p.changed.filter(c=>!c.err&&c.data).map(c=>c.data);if(!bs.length){toast('저장소에 지점이 없어요 · 프로그램 관리자 PC에서 연동을 먼저 켜야 해요',5000);return}
  DB.branches=bs;DB.syncKnown={};p.changed.forEach(c=>{if(!c.err)DB.syncKnown[c.id]=c.sha});SYNC.locks=p.locks||{};
  DB.currentBranch=SYNC.info.branch&&bs.some(b=>b.id===SYNC.info.branch)?SYNC.info.branch:bs[0].id;HIST=[];histSave();
  // 이 PC에서 따로 해 둔 수정 초안은 학원 시간표와 섞이지 않게 정리 (백업 '연동전'에 남아 있음)
  UI._draft=null;try{await bridge.clearDraft()}catch(e){}const db=$('draftBar');if(db)db.hidden=true;
  await bridge.save(JSON.stringify(DB),{quiet:true});$('modal').hidden=true;syncStartTimer();render();
  toast(SYNC.info.role==='owner'?'프로그램 관리자로 연결했어요':SYNC.info.role==='staff'?`${syBName(SYNC.info.branch)} 행정 선생님 PC로 연결했어요`:`${syBName(SYNC.info.branch)} 관리자로 연결했어요`,4000)}
async function syEnable(){const name=($('syName')&&$('syName').value.trim())||'부원장';const r=await bridge.syncEnable({name});if(!r.ok){toast(r.err,5000);return}SYNC.info=r.info;
  toast('연동을 켜는 중… 지점을 올려요');const p=await bridge.syncPull({});if(!p.ok){toast(p.err,5000);return}
  const known=DB.syncKnown=DB.syncKnown||{};const present=new Set(p.present.map(x=>x.id));
  if(p.present.length&&!p.changed.every(c=>c.err))syMerge(DB,p,known);p.changed.forEach(c=>{if(!c.err)known[c.id]=c.sha});
  const items=DB.branches.filter(b=>!present.has(b.id)).map(b=>({id:b.id,data:b}));
  if(items.length){const r2=await bridge.syncPush(items);Object.assign(known,r2.shas||{});if(!r2.ok){toast(r2.err,5000)}}
  await bridge.save(JSON.stringify(DB),{quiet:true});syncStartTimer();render();toast('지점 연동을 켰어요 · 지점 코드를 만들 수 있어요')}
function syncStartTimer(){clearInterval(SYNC.timer);if(syOn())SYNC.timer=setInterval(()=>{const al=()=>{try{if(typeof ckAlign==='function')ckAlign()}catch(e){}};if(!document.hidden)syncPull({silent:false}).then(al);else if(realOwner())syncPull({silent:true}).then(al) /* 3.78.4: 부원장님 PC는 최소화돼 있어도 받아서 코드 맞추기 */;updTick()},120000)}
async function syncInit(){if(!bridge||!bridge.syncInfo){SYNC.ready=true;render();return}try{SYNC.info=await bridge.syncInfo()}catch(e){SYNC.ready=true;render();return}SYNC.ready=true;if(!syOn()){render();return}render();if(admLocked()||isStaff()||SYNC.info.role==='branch'){const mb=myBr();if(mb&&DB.branches.some(b=>b.id===mb)&&DB.currentBranch!==mb&&!UI.edit){DB.currentBranch=mb;render()}} /* 켜면 내 지점부터 (지점장·행정·잠근 관리자 PC) */

/* ---- 자동 업데이트 ----
   단추가 없어요: 프로그램 관리자 PC는 켜진 뒤 3초·2분마다 자기 버전이 올려 둔 버전보다 새로우면 저절로 올리고(updPublish),
   모든 PC는 2분마다 받아요(updCheck). 3.78.1: 관리자 탭 [연결된 PC]에 '올려 둔 버전 · 마지막 확인' 상태 줄 */
const UPD={pub:null,at:0,chk:0,busy:false,err:''};
const vcmpR=(a,b)=>{const x=String(a||'').split('.').map(Number),y=String(b||'').split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)-(y[i]||0)}return 0};
async function updTick(){if(!syOn()||!bridge.updCheck||UPD.busy)return;UPD.busy=true;UPD.err='';
  if(SYNC.info.role==='owner'){try{const r=await bridge.updPublish(APPVER);if(r&&r.published){UPD.pub=r.published;UPD.at=Date.now();toast(`다른 PC들에 새 버전 ${r.published}을(를) 보냈어요 · 2분 안에 자동으로 바뀌어요`,5000)}else if(r&&r.skipped)UPD.pub=r.remote;else if(r&&r.err)UPD.err=r.err;else if(r&&r.nokey)UPD.err='서명 키가 없어 올리지 못해요'}catch(e){}}
  try{const r=await bridge.updCheck(APPVER);if(r&&r.updated){if(r.restart){updBanner(r.updated)}else toast(`새 버전 ${r.updated}을(를) 받았어요 · 곧 화면이 새로 바뀌어요`)}
    else if(r&&r.err){console.warn(r.err);UPD.err=UPD.err||r.err}}catch(e){}
  UPD.chk=Date.now();UPD.busy=false;updStRender();staleCheck()}
/* 상태 줄: 올려 둔 버전(저장소 version.json) · 이 PC 버전 · 마지막 확인 */
function updStHTML(){const p=UPD.pub,c=p?vcmpR(APPVER,p):0;
  const st=UPD.busy?'<span class="hint">확인하는 중…</span>':!p?'<span class="hint">아직 올린 버전이 없어요 · 켜 두면 저절로 올라가요</span>':c>0?`<span class="rqw">이 PC가 더 새 버전(${esc(APPVER)}) · 2분 안에 저절로 올라가요</span>`:c<0?`<span class="rqw">이 PC(${esc(APPVER)})가 더 옛 버전 · 받으면 다시 켜야 할 수 있어요</span>`:'<span class="hint">이 PC와 같아요</span>';
  return `<div class="updst" id="updSt"><span>올려 둔 버전 <b class="mono">${p?esc(p):'—'}</b>${UPD.at?` <span class="hint">· ${fmtT(UPD.at)} 올림</span>`:''}</span><span class="sep">·</span>${st}<span class="sp"></span><span class="hint">${UPD.chk?'마지막 확인 '+fmtT(UPD.chk):''}</span><button class="btn sm" data-act="updChk" ${UPD.busy?'disabled':''}>지금 확인</button>${UPD.err?`<div class="rqw" style="flex-basis:100%">${esc(UPD.err)}</div>`:''}</div>`}
function updStRender(){const el=$('updSt');if(el)el.outerHTML=updStHTML()}
async function updChk(){if(UPD.busy)return;const p=updTick();updStRender();await p;toast(UPD.err?'확인했지만 올리지 못했어요 · '+UPD.err:'확인했어요',3500);syDevsLoad()}

  const keys=[];if(g&&g.on&&g.exp)keys.push({n:'GitHub 연결 키',exp:g.exp,where:'[설정 → 폰으로 보기 → 연결 키]에 넣으면 지점 PC들도 자동으로 바뀌어요',how:'keyHow'});
  if(q&&q.on&&q.exp)keys.push({n:'보강 등록 키',exp:q.exp,where:'[설정 → 선생님 보강 등록 → 보강 등록 키]에 넣으면 돼요 (Issues 권한만)',how:'rqKeyGo'});
  const el=$('keyBar');const soon=keys.map(k=>Object.assign(k,{days:Math.ceil((k.exp-Date.now())/86400000)})).filter(k=>k.days<=14).sort((a,b)=>a.days-b.days)[0];

  <label class="chk" style="margin:12px 0 4px"><input type="checkbox" id="lgData" checked> 이 PC의 시간표·학생 연락처·백업도 지우기 <span class="hint">(추천 · 처음 화면으로 돌아가요)</span></label>
  ${UI.edit?'<div class="box warn"><span>수정 중인 초안은 올라가지 않고 사라져요. 먼저 [적용]하는 게 좋아요.</span></div>':''}
  <div class="hint">다른 PC와 선생님 폰의 시간표는 그대로예요.</div>
  <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-act="closeModal">취소</button><button class="btn danger" data-act="lgoGo">로그아웃</button></div></div>`}
async function lgoGo(el){if(!armed(el,'lgo','한 번 더 누르면 로그아웃'))return;const data=!!($('lgData')||{}).checked;el.disabled=true;el.textContent='지우는 중…';
  try{clearTimeout(typeof saveTimer!=='undefined'?saveTimer:0)}catch(e){}window.__lgo=true;const r=await bridge.syncLogout({data});if(!r||!r.ok){el.disabled=false;el.textContent='로그아웃';toast((r&&r.err)||'로그아웃하지 못했어요',4000)}}
