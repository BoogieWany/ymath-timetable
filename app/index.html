<script>/* ================= 방학 특강 =================
   특강 = 정규 교시표와 별개로 요일·시작 시간·길이·기간(시작~끝 날짜)을 갖는 수업. 지점(b.specials)에 저장.
   지점 시간표에는 교시 줄 위 "특강" 줄에 강사 칸별 카드로 보이고, 기간 안에 있을 때만(자동) 보임. 정규 수업과 시간이 겹치면 점검에 뜸. */
const SPS=()=>B().specials||[];
const SPC=id=>SPS().find(s=>s.id===id);
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function spStatus(s){const t=todayStr();if(s.from&&t<s.from)return 'soon';if(s.to&&t>s.to)return 'past';return 'on'}
const spStatusLabel=s=>({on:'진행 중',soon:'예정',past:'지남'})[spStatus(s)];
function spShown(){const m=UI.spMode||'auto';if(m==='none')return [];return SPS().filter(s=>m==='all'||(m==='soon'?spStatus(s)!=='past':spStatus(s)==='on'))}
const vacationNow=()=>SPS().some(s=>spStatus(s)==='on');
const toMin=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(String(t||'').trim());return m?+m[1]*60+ +m[2]:null};
const fromMin=x=>`${String(Math.floor(x/60)%24).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`;
// 정규 교시 시간 범위: 다음 교시 시작 전까지(최대 90분)
function slotRange(d,p){const ps=per(d);const a=toMin(ps[p]&&ps[p].time);if(a===null)return null;const n=ps[p+1]?toMin(ps[p+1].time):null;const dur=n!==null&&n>a?Math.min(n-a,90):90;return [a,a+dur]}
function spRange(s){const a=toMin(s.start);return a===null?null:[a,a+(+s.dur||120)]}
const ovl=(r1,r2)=>!!(r1&&r2&&r1[0]<r2[1]&&r2[0]<r1[1]);
function spTimeLabel(s){const r=spRange(s);return r?`${fromMin(r[0])}–${fromMin(r[1])}`:''}
const md=x=>x?String(x).slice(5).replace('-','/'):'';
function spDateLabel(s){return s.from||s.to?`${md(s.from)}~${md(s.to)}`:'기간 없음'}
const spDaysLabel=s=>(s.days||[]).join('');
function spMembers(s){return (s.members||[]).filter(id=>S(id))}
function spActive(s){return spMembers(s).filter(active)}
const spDurLabel=m=>{m=+m||0;const h=Math.floor(m/60),r=m%60;return (h?h+'시간':'')+(r?' '+r+'분':'')||'0분'};
function firstFreeSp(){const u=usedColors();const su=new Set(SPS().map(s=>String(s.color||'').toUpperCase()));return PALETTE.find(c=>!u.has(c.toUpperCase())&&!su.has(c.toUpperCase()))||PALETTE[Math.floor(Math.random()*PALETTE.length)]}

/* ---- 카드 ---- */
function spChip(s,opt={}){const bg=s.color||'#9aa3b5',fg=txtColor(bg);const act=spActive(s);const st=spStatus(s);
  const cl=['chip','sp'];if(UI.hl.size)cl.push(UI.hl.has(s.id)?'hl':'dim');if(opt.bad&&opt.bad.has(s.id))cl.push('bad');if(UI.sel&&UI.sel.type==='sp'&&UI.sel.id===s.id)cl.push('picked');
  const ed=UI.edit&&UI.view==='grid'&&opt.drag!==false;
  const nm=opt.names?`<span class="nm">${spMembers(s).map(id=>{const n=active(id)?esc(sname(id)):`<s>${esc(sname(id))}</s>`;return ed?`<span class="snm sn" draggable="true" data-snm="${id}" data-from="sp:${s.id}" title="끌어서 다른 카드에 놓으면 그 반·특강에 추가">${n}<i class="sx" data-sx="${id}|sp:${s.id}" title="이 특강에서 빼기">×</i></span>`:`<span class="sn">${n}</span>`}).join('')}</span>`:'';
  return `<button class="${cl.join(' ')}" ${ed?'draggable="true"':''} data-spid="${s.id}" style="background:${bg};color:${fg}" title="${esc(s.name)} 특강 · ${esc(tn(s.t))}T · ${esc(spDaysLabel(s))} ${spTimeLabel(s)} · ${esc(spDateLabel(s))} · ${esc(act.map(sname).join(' '))}"><b>${esc(s.name)}</b><small>${esc(opt.sub??`${spTimeLabel(s)} · ${act.length}명`)}</small><i class="spdt ${st}">${spStatusLabel(s)} ${esc(spDateLabel(s))}</i>${nm}</button>`}
function spRowHTML(days,cols,bad){const shown=spShown();if(!shown.length)return '';const any=shown.some(s=>days.some(d=>(s.days||[]).includes(d)));if(!any&&!UI.edit)return '';
  let h=`<tr class="sprow"><th class="per"><b>특강</b><span>방학</span></th>`;
  cols.forEach(c=>{if(c.first&&typeof wkTime==='function'&&wkTime(days,c.d))h+='<th class="wtl"></th>';const list=shown.filter(s=>s.t===c.t.id&&(s.days||[]).includes(c.d)).sort((a,b)=>(toMin(a.start)||0)-(toMin(b.start)||0));
    h+=`<td class="slot spcell${c.end?' end':''}" data-d="${c.d}" data-t="${c.t.id}" data-sp="1" title="${esc(c.d+' '+c.t.name+'T 특강')}">${list.map(s=>spChip(s,{bad,names:true})).join('')}${UI.edit?`<button class="spadd" data-spadd="${c.d}|${c.t.id}" title="${esc(c.d+'요일 '+c.t.name+'T 특강 추가')}" aria-label="특강 추가">+</button>`:''}</td>`});
  return h+'</tr>'}
function spToolbarHTML(){const n=SPS().length,on=SPS().filter(s=>spStatus(s)==='on').length;const m=UI.spMode||'auto';
  return `<span class="spsel"><label for="spMode" class="hint">특강</label><select id="spMode" title="방학 특강 줄 보이기"><option value="auto" ${m==='auto'?'selected':''}>진행 중만 (자동)</option><option value="soon" ${m==='soon'?'selected':''}>예정도 보기</option><option value="all" ${m==='all'?'selected':''}>지난 것까지</option><option value="none" ${m==='none'?'selected':''}>숨기기</option></select><button class="btn" data-act="spList" title="방학 특강 추가·수정·복사">특강 관리${n?` <small>(${on?on+' 진행 중':n+'개'})</small>`:''}</button></span>`}
function spPersonList(list,opt={}){if(!list.length)return '';return `<div class="splist"><b>특강</b>${list.map(s=>`<button class="cchip" data-spsel="${s.id}" style="--c:${esc(s.color||'#9aa3b5')}"><i></i>${esc(s.name)} <small>${esc(spDaysLabel(s))} ${spTimeLabel(s)} · ${esc(spDateLabel(s))} · ${spStatusLabel(s)}${opt.t?'':' · '+esc(tn(s.t))+'T'}</small></button>`).join('')}</div>`}
function spDetailHTML(s){const mem=spMembers(s);return `<div><span class="sw" style="background:${esc(s.color||'#9aa3b5')};vertical-align:-2px"></span> <b>${esc(s.name)}</b> 특강 · ${esc(tn(s.t))}T</div><div class="hint">${esc(spDaysLabel(s))} ${spTimeLabel(s)} (${spDurLabel(s.dur)}) · ${esc(spDateLabel(s))} · ${spStatusLabel(s)} · ${spActive(s).length}명</div>
  <div class="names">${mem.map(id=>`<button class="nmb${active(id)?'':' away'}" data-stu="${id}">${esc(sname(id))} <small>${esc((S(id)||{}).grade||'')}</small></button>`).join('')||'<span class="hint">명단 없음</span>'}</div>
  <div class="row"><button class="btn" data-spedit="${s.id}">수정</button><button class="btn" data-spcopy="${s.id}">복사해서 새로</button><button class="btn danger" data-spdel="${s.id}">삭제</button></div>`}
function renderPopSp(pe,s){const ch=document.querySelector(`#gridScroll .chip[data-spid="${s.id}"]`);if(!ch){pe.hidden=true;UI.pop=null;return false}
  const mem=spMembers(s),act=mem.filter(active),bg=s.color||'#9aa3b5',ed=UI.edit;
  pe.innerHTML=`<div class="cp-h" style="background:${bg};color:${txtColor(bg)}"><b>${esc(s.name)} <small>특강</small></b><span>${esc(tn(s.t))}T · ${esc(spDaysLabel(s))} ${spTimeLabel(s)} · ${esc(spDateLabel(s))} · ${act.length}명</span><button class="cp-x" data-act="closePop" aria-label="닫기">×</button></div>
    <div class="cp-nm">${mem.length?mem.map(id=>{const n=active(id)?esc(sname(id)):`<s>${esc(sname(id))}</s>`;return ed?`<span class="snm sn" draggable="true" data-snm="${id}" data-from="sp:${s.id}" title="끌어서 다른 카드에 놓기">${n}<i class="sx" data-sx="${id}|sp:${s.id}" title="이 특강에서 빼기">×</i></span>`:`<span class="sn">${n}</span>`}).join(''):'<span class="hint">명단이 비어 있어요</span>'}</div>
    <div class="cp-tip">${ed?`<button class="btn" data-spedit="${s.id}">특강 수정</button> 이름을 끌어서 다른 카드에 놓으면 그 반·특강에 추가돼요`:'수정 모드에서 명단·시간을 고칠 수 있어요'}</div>`;
  pe.hidden=false;const r=ch.getBoundingClientRect(),w=pe.offsetWidth,h=pe.offsetHeight;
  let x=r.right+8;if(x+w>window.innerWidth-8)x=r.left-w-8;if(x<8)x=Math.min(window.innerWidth-w-8,r.left);
  let y=r.top;if(y+h>window.innerHeight-8)y=Math.max(8,window.innerHeight-h-8);
  pe.style.left=(x+window.scrollX)+'px';pe.style.top=(y+window.scrollY)+'px';return true}

/* ---- 점검 ---- */
function spIssues(out,v){const shown=spShown();
  shown.forEach(s=>{const r=spRange(s);const act=spActive(s);const t=T(s.t);
    if(!r)out.push({lv:'warn',k:'특강 시간',m:`${s.name} 특강의 시작 시간이 비어 있어요`,ids:[s.id],sp:s.id});
    (s.days||[]).forEach(d=>{if(!r)return;
      const tcl=v.sessions.filter(o=>o.t===s.t&&o.d===d&&ovl(r,slotRange(d,o.p)));
      if(tcl.length)out.push({lv:'err',k:'특강 겹침',m:`${s.name} 특강(${d} ${spTimeLabel(s)})이 ${tn(s.t)}T ${tcl.map(o=>C(o.cls).name+' '+ptime(o.d,o.p)).join(', ')} 수업과 시간이 겹쳐요`,ids:[s.id,...tcl.map(o=>o.id)],sp:s.id});
      const scl={};v.sessions.filter(o=>o.d===d&&ovl(r,slotRange(d,o.p))).forEach(o=>activeMembers(o).forEach(id=>{if(act.includes(id))(scl[id]=scl[id]||[]).push(o)}));
      Object.entries(scl).forEach(([id,os])=>out.push({lv:'err',k:'특강 학생 겹침',m:`${sname(id)} · ${d} ${s.name} 특강(${spTimeLabel(s)})과 ${os.map(o=>C(o.cls).name+' '+ptime(o.d,o.p)).join(', ')} 시간이 겹쳐요`,ids:[s.id,...os.map(o=>o.id)],stu:id,sp:s.id}));
      if(t&&(t.off||[]).includes(d))out.push({lv:'warn',k:'강사 휴무일',m:`${t.name}T 휴무 요일(${d})에 ${s.name} 특강`,ids:[s.id],sp:s.id})});
    if(!t)out.push({lv:'err',k:'특강 강사',m:`${s.name} 특강의 강사가 비어 있어요`,ids:[s.id],sp:s.id});
    if(!(s.days||[]).length)out.push({lv:'warn',k:'특강 요일',m:`${s.name} 특강의 요일이 비어 있어요`,ids:[s.id],sp:s.id});
    if(!act.length)out.push({lv:'warn',k:'명단 없음',m:`${s.name} 특강에 학생 명단이 없어요`,ids:[s.id],sp:s.id})});
  for(let i=0;i<shown.length;i++)for(let j=i+1;j<shown.length;j++){const a=shown[i],b=shown[j];if(!ovl(spRange(a),spRange(b)))continue;const dd=(a.days||[]).filter(d=>(b.days||[]).includes(d));if(!dd.length)continue;
    if((a.from&&b.to&&a.from>b.to)||(b.from&&a.to&&b.from>a.to))continue;
    if(a.t===b.t)out.push({lv:'err',k:'특강 겹침',m:`${tn(a.t)}T · ${dd.join('')} ${a.name}(${spTimeLabel(a)})과 ${b.name}(${spTimeLabel(b)}) 특강 시간이 겹쳐요`,ids:[a.id,b.id],sp:a.id});
    const both=spActive(a).filter(id=>spActive(b).includes(id));if(both.length)out.push({lv:'err',k:'특강 학생 겹침',m:`${both.map(sname).join(', ')} · ${dd.join('')} ${a.name}과 ${b.name} 특강 시간이 겹쳐요`,ids:[a.id,b.id],stu:both[0],sp:a.id})}}

/* ---- 고치기 ---- */
function spAddMember(spId,stuId){const s=SPC(spId);if(!s||!S(stuId))return;if((s.members||[]).includes(stuId)){toast(`${sname(stuId)}은(는) 이미 ${s.name} 특강에 있어요`);return}
  commit(()=>{const x=SPC(spId);x.members=x.members||[];x.members.push(stuId)},`${sname(stuId)} → ${s.name} 특강에 넣었어요`)}
function spRemoveMember(spId,stuId){const s=SPC(spId);if(!s)return;commit(()=>{const x=SPC(spId);x.members=(x.members||[]).filter(i=>i!==stuId)},`${sname(stuId)}을(를) ${s.name} 특강에서 뺐어요`)}
function spSetTeacher(spId,tid){const s=SPC(spId);if(!s||s.t===tid)return;commit(()=>{SPC(spId).t=tid},`${s.name} 특강 → ${tn(tid)}T 담당으로`)}
function spDelete(id){const s=SPC(id);if(!s)return;commit(()=>{B().specials=SPS().filter(x=>x.id!==id)},`${s.name} 특강을 지웠어요 · 되돌리기 가능`);if(UI.sel&&UI.sel.type==='sp'&&UI.sel.id===id)UI.sel=null;if(UI.pop==='sp:'+id)closePop();if(UI.spListOpen)spListDlg();else $('modal').hidden=true}
function spOpen(id,preset){if(!UI.edit){toast('수정 모드를 켜야 특강을 만들거나 고칠 수 있어요');return}
  const base=id?SPC(id):null;if(id&&!base)return;
  const s=base?JSON.parse(JSON.stringify(base)):{id:null,name:'',color:firstFreeSp(),t:(preset&&preset.t)||(B().teachers[0]||{}).id||'',days:(preset&&preset.d)?[preset.d]:['월','수','금'],start:'12:00',dur:120,from:'',to:'',members:[]};
  if(preset&&preset.copy){s.id=null;s.name=s.name+' 복사';s.from='';s.to='';s.color=firstFreeSp()}
  UI.spd=s;UI.spq='';UI.spListOpen=false;$('modal').hidden=false;renderSpDlg();setTimeout(()=>{const i=$('spName');if(i)i.focus()},30)}
function renderSpDlg(){const s=UI.spd;if(!s)return;const b=B();
  $('modal').innerHTML=`<div class="dlg spdlg" role="dialog" aria-modal="true" aria-labelledby="spT" style="width:min(760px,100%)"><h2 id="spT">${s.id?'특강 수정':'새 특강'}</h2>
  <div class="row"><label for="spName">특강 이름</label><input id="spName" value="${esc(s.name)}" placeholder="예: 고1 여름특강 A" style="width:240px"><label for="spT2">강사</label><select id="spT2">${b.teachers.map(t=>`<option value="${t.id}" ${t.id===s.t?'selected':''}>${esc(t.name)}T</option>`).join('')}</select></div>
  <div class="row"><label>색</label><div class="pal">${PALETTE.map(c=>`<button data-spcolor="${c}" class="${c.toUpperCase()===String(s.color).toUpperCase()?'on':''}" style="background:${c}" aria-label="색 ${c}"></button>`).join('')}</div></div>
  <div class="row"><label>요일</label>${DAYS.map(d=>`<button class="dbtn" data-spday="${d}" aria-pressed="${(s.days||[]).includes(d)}">${d}</button>`).join(' ')}<span class="hint">예: 월수금 · 화목 · 토일</span></div>
  <div class="row"><label for="spStart">시작</label><input id="spStart" value="${esc(s.start||'')}" placeholder="12:00" style="width:72px" inputmode="numeric"><label for="spDur">길이</label><select id="spDur">${[60,90,120,150,180,210,240].map(m=>`<option value="${m}" ${+s.dur===m?'selected':''}>${spDurLabel(m)}</option>`).join('')}</select><span class="hint" id="spEnd">${spTimeLabel(s)||''}</span></div>
  <div class="row"><label for="spFrom">기간</label><input type="date" id="spFrom" value="${esc(s.from||'')}"> ~ <input type="date" id="spTo" value="${esc(s.to||'')}"><span class="hint">이 기간에만 시간표·폰에 보여요 · 비워 두면 늘 보여요</span></div>
  <div class="row"><label>학생</label><input id="spQ" placeholder="이름 찾기" style="width:130px" autocomplete="off"><select id="spFromCls"><option value="">반 명단 넣기…</option>${V().classes.slice().sort((a,c)=>sortKo(a.name,c.name)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><span class="hint" id="spCnt">${(s.members||[]).length}명 선택</span><span class="sp"></span><button class="btn" data-act="spClearStu">선택 비우기</button></div>
  <div class="spstu" id="spStu">${spStuListHTML()}</div>
  <div class="row" style="justify-content:flex-end">${s.id?`<button class="btn danger" data-spdel="${s.id}">삭제</button><span class="sp"></span>`:''}<button class="btn" data-act="spCancel">취소</button><button class="btn pri" data-act="spSave">저장</button></div></div>`}
function spStuListHTML(){const s=UI.spd;const q=(UI.spq||'').trim();const list=B().students.filter(x=>!offS(x)||(s.members||[]).includes(x.id)).filter(x=>!q||x.name.includes(q)||(x.school||'').includes(q)).sort((a,c)=>GRADE_ORDER(a.grade)-GRADE_ORDER(c.grade)||sortKo(a.name,c.name));
  if(!list.length)return '<span class="hint">맞는 학생이 없어요</span>';
  let last='';return list.map(x=>{const g=x.grade||'';const hd=g!==last?`<div class="spg">${esc(g||'학년 없음')}</div>`:'';last=g;return hd+`<label class="chk"><input type="checkbox" data-spstu="${x.id}" ${(s.members||[]).includes(x.id)?'checked':''}> ${esc(x.name)}<small class="hint"> ${esc(x.school||'')}${x.status==='휴원'?' · 휴원':''}</small></label>`}).join('')}
function spSave(){const s=UI.spd;if(!s)return;const name=($('spName').value||'').trim();if(!name){toast('특강 이름을 넣어 주세요');$('spName').focus();return}

function gradeNext(g){const m=/^(초|중|고)\s*(\d)$/.exec(String(g||'').trim());if(!m)return null;const lv=m[1],n=+m[2];
  if(lv==='초')return n<6?`초${n+1}`:'중1';if(lv==='중')return n<3?`중${n+1}`:'고1';return n<3?`고${n+1}`:'졸업'}
function gradePlan(b,opt){const rows={},keep={};let n=0;
  b.students.forEach(s=>{if(!opt.away&&s.status==='휴원'){keep['휴원']=(keep['휴원']||0)+1;return}const g=String(s.grade||'').trim();let to=gradeNext(g);
    if(to==='졸업'&&!opt.grad)to=null;if(!to){const k=g||'(비어 있음)';keep[k]=(keep[k]||0)+1;return}const k=g+'→'+to;rows[k]=rows[k]||{from:g,to,n:0};rows[k].n++;n++});
  return {rows:Object.values(rows).sort((a,z)=>GRADE_ORDER(a.from)-GRADE_ORDER(z.from)),keep,n}}
function gradeUpDlg(){const b=B();const opt=UI.gu||(UI.gu={grad:true,away:true});const P=gradePlan(b,opt);const last=b.gradeUpAt||'';const recent=last&&(Date.now()-new Date(last).getTime())<300*86400e3;

  return t.ck?`<span class="ckc mono">${esc(t.ck)}</span>${diff?'<span class="hint" title="같은 이름 선생님인데 지점마다 코드가 달라요 · [바꾸기]를 누르면 전 지점이 같은 코드가 돼요"> · 지점마다 달라요</span>':''} <button class="btn sm" data-ckcopy="${t.id}" title="주소와 이 선생님 개인 코드를 복사 · 카톡 1:1로 보내 주세요">복사</button>${ed?` <button class="btn sm" data-cknew="${t.id}" data-label="바꾸기" title="새 코드로 바꾸면 그 선생님은 새 코드로 다시 로그인해야 해요">바꾸기</button>`:''}`:(ed?`<button class="btn sm" data-cknew="${t.id}" data-label="만들기">만들기</button>`:'<span class="hint">없음</span>')}
/* 로그인 코드: 6자리 · 전 지점에서 겹치지 않게 · 다른 지점에 같은 이름 선생님 코드가 있으면 처음 만들 땐 그 코드를 그대로(한 사람 = 한 코드) */
async function ckNew(tid){const t0=B().teachers.find(x=>x.id===tid);if(!t0)return;const me=sameT(t0.name),ed=sameTEd(t0.name);
  const self=me.length>ed.length&&t0.ck&&ckSelfMgr(t0);
  if(me.length>ed.length&&t0.ck&&!self){toast('다른 지점에도 등록된 선생님이에요 · 코드 바꾸기는 관리자 모드에서 해 주세요 (전 지점이 같은 코드여야 해요)',5000);return}
  const mine=new Set(me.map(x=>x.t));const used=new Set(DB.branches.flatMap(b=>(b.teachers||[]).concat(b.staff||[])).filter(x=>!mine.has(x)&&x.ck).map(x=>x.ck));
  const have=!t0.ck&&me.find(x=>x.t.ck);let c=have?have.t.ck:'';   // 처음 만들 땐 다른 지점에 이미 있는 그 사람 코드를 그대로
  while(!c||used.has(c))c=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);
  const bids=[...new Set(ed.map(x=>x.b.id))];
  const at=Date.now(),by=(typeof SYNC!=='undefined'&&SYNC.info&&SYNC.info.name)||'';const others=[...new Set(me.filter(x=>!bids.includes(x.b.id)).map(x=>x.b.name))];
  await quickChange(()=>{sameT(t0.name).forEach(x=>{if(bids.includes(x.b.id)){x.t.ck=c;x.t.ckAt=at;if(by)x.t.ckBy=by}})},self?`내 로그인 코드: ${c} · 이 지점은 바로 바뀌었고, ${others.join('·')}은(는) 부원장님 PC가 켜져 있으면 2분 안에 같은 코드로 맞춰져요 (새 코드로 바로 로그인돼요)`:`${tn(tid)} 선생님 로그인 코드: ${c}${bids.length>1?` (${bids.length}개 지점 공통)`:''} · [복사]로 1:1로 보내 주세요`,bids)}
/* 3.78.4: 지점장 PC는 다른 지점에도 등록된 '자기' 코드를 바꿀 수 있음(연결할 때 넣은 이름 = 그 지점 지점장 선생님) · 다른 지점은 부원장님 PC가 받아 같은 코드로 맞춤(ckAlign) */
function ckSelfMgr(t){if(typeof syOn!=='function'||!syOn()||SYNC.info.role!=='branch')return false;const b=B();return b.id===myBr()&&(b.mgr||[]).includes(t.id)&&!!tnm(SYNC.info.name)&&tnm(SYNC.info.name)===tnm(t.name)}
/* 부원장님 PC: 같은 이름 선생님 코드가 지점마다 다르고 한쪽이 더 나중에 바뀌었으면(ckAt) 나머지 지점도 그 코드로 — 받을 때마다 확인 · 잠긴 지점은 다음에 */
async function ckAlign(){if(typeof syOn!=='function'||!syOn()||!realOwner()||UI.edit||UI.peek||UI.stale||SYNC.ckBusy)return;
  const G={};DB.branches.forEach(b=>{(b.teachers||[]).forEach(t=>{const k=tnm(t.name);if(k)(G['T'+k]=G['T'+k]||[]).push({b,t})});(b.staff||[]).forEach(t=>{const k=tnm(t.name);if(k)(G['S'+k]=G['S'+k]||[]).push({b,t})})});const todo=[]; /* 강사·행정 따로 */
  Object.values(G).forEach(L=>{if(L.length<2)return;const tg=L.filter(x=>x.t.ck&&x.t.ckAt).sort((a,z)=>z.t.ckAt-a.t.ckAt)[0];if(!tg)return;L.forEach(x=>{if(x.t.ck!==tg.t.ck&&(x.t.ckAt||0)<tg.t.ckAt)todo.push({b:x.b,t:x.t,ck:tg.t.ck,at:tg.t.ckAt,by:tg.t.ckBy||'',nm:tg.t.name})})});
  if(!todo.length)return;SYNC.ckBusy=true;
  try{const bids=[...new Set(todo.map(x=>x.b.id))];const ok=[];for(const id of bids){try{const l=await bridge.syncLock(id);if(l.ok){ok.push(id);SYNC.mine.add(id)}}catch(e){}}
    const T=todo.filter(x=>ok.includes(x.b.id));if(!T.length)return;
    T.forEach(x=>{x.t.ck=x.ck;x.t.ckAt=x.at;if(x.by)x.t.ckBy=x.by});DB.updated=new Date().toISOString();await saveNow();await syncAfterApply();render();
    const nm=[...new Set(T.map(x=>x.nm))];toast(`${nm.join('·')} 선생님이 바꾼 로그인 코드를 ${[...new Set(T.map(x=>x.b.name))].join('·')}에도 맞췄어요`,5000)}
  finally{SYNC.ckBusy=false}}

  if(c.per===1)w.push({k:'M'+td.slice(0,7),from:f(y,m,1),to:f(y,m,ld(y,m)),lab:`${m}월`});
  if(c.per===2){const s=m%2?m:m-1;w.push({k:'B'+f(y,s,1).slice(0,7),from:f(y,s,1),to:f(y,s+1,ld(y,s+1)),lab:`${s}~${s+1}월`})}
  if(c.exam&&exam){const EX=exam.중||exam.고?[['중',exam.중],['고',exam.고]]:[['',exam]];EX.forEach(([kd,x])=>{if(!x||!x.from||!x.to)return;const f2=x.mf||x.from,to2=x.mt||dPlus(x.to,7);if(td>=f2&&td<=to2)w.push({k:'E'+kd+x.from,from:f2,to:to2,lab:kd?`${kd}등 시험`:'시험 기간',kind:kd})})}

  ${F.length?`<table class="tbl rdt"><thead><tr><th class="l">신입</th><th>학교·학년</th><th>첫 수업</th><th>상태</th><th class="l">소개</th></tr></thead><tbody>${F.map(s=>{const r=R.find(x=>x.sid===s.id);const bs=r&&r.by?SS(r.by):null;return `<tr class="rdnew" data-rdnew="${esc(s.id)}" title="학생 정보 창 열기"><td class="l"><b>${esc(s.name)}</b></td><td>${esc([s.school,s.grade].filter(Boolean).join(' '))}</td><td>${s.from?mdS(s.from):`<span class="hint" title="첫 수업일이 없어 프로그램에 넣은 날로 묶었어요 · 학생 정보 창 [상태·정보 고치기]에서 첫 수업일을 넣으면 정확해져요">${s.at?mdS(s.at)+' 넣음':'—'}</span>`}</td><td>${isOut(s)?'<span class="rfwait">퇴원</span>':isPre(s)?'<span class="rfwait">입학 예정</span>':esc(s.status||'재원')}</td><td class="l">${r?`<b>${esc(bs?bs.name:r.byNm||'')}</b> <small class="hint">${r.pd?'지급 '+mdS(r.pd):'미지급'}</small>`:'<span class="hint">—</span>'}</td></tr>`}).join('')}</tbody></table>`:`<div class="hint rfemp">${L.length?'조건에 맞는 학생이 없어요':'이 달에 들어온 학생이 없어요'}</div>`}`}
</script>
<script>/* ===== 내 폰 관리 모드 (프로그램 관리자 전용) =====
   b.own={ck:10자리 코드, ak:서명 키, nm, at} — 모든 지점에 같은 값으로 둠(어느 PC가 시간표를 올려도 같은 묶음이 나가게)
   강사용에서 이 코드로 로그인하면 '관리' 탭 · 폰에서 바꾼 것은 서명된 요청(kind 'ad')으로 오고,
   그 지점을 고칠 수 있는 PC(지점장·관리자)가 서명을 확인한 뒤 바로 반영 */
function ownCfg(){const b=DB.branches.find(x=>x.own&&x.own.ck);return b?b.own:null}
function ownHTML(){const o=ownCfg();
  return `<div class="sec ownbox" id="ownBox">

  <div class="row" style="margin-top:8px">${o?`<span class="ownon">켜져 있어요${o.at?' · '+esc(mdS(o.at))+' 만듦':''}</span><span class="sp"></span><button class="btn" data-act="ownShow">코드 보기</button><button class="btn" data-act="ownNew" data-label="새 코드로 바꾸기" title="지금 코드로 로그인한 폰은 끊겨요">새 코드로 바꾸기</button><button class="btn danger" data-act="ownOff" data-label="끄기">끄기</button>`:`<span class="sp"></span><button class="btn pri" data-act="ownNew">폰 코드 만들기</button>`}</div></div>`}
function ownCode(){const a=crypto.getRandomValues(new Uint32Array(10));return Array.from(a,x=>x%10).join('').replace(/^0/,'1')}
function ownKey(){const a=crypto.getRandomValues(new Uint8Array(32));return btoa(String.fromCharCode(...a))}
async function ownNew(){if(!isOwner())return;const ck=ownCode(),ak=ownKey();const nm=(typeof SYNC!=='undefined'&&SYNC.info&&SYNC.info.name)||'';const had=!!ownCfg();
  const ok=await quickChange(()=>{DB.branches.forEach(b=>{b.own={ck,ak,nm,at:todayStr()}})},had?'새 폰 코드로 바꿨어요 · 예전 코드로 로그인한 폰은 끊겨요':'폰 코드를 만들었어요',DB.branches.map(b=>b.id));if(ok)ownShow()}
async function ownOff(){if(!isOwner())return;await quickChange(()=>{DB.branches.forEach(b=>{delete b.own})},'폰 관리 모드를 껐어요 · 그 코드로 로그인한 폰은 끊겨요',DB.branches.map(b=>b.id))}
function ownShow(){const o=ownCfg();if(!o)return;$('modal').hidden=false;$('modal').innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="owT" style="width:min(420px,100%)"><h2 id="owT">내 폰 관리 코드</h2>
  <div class="owncode mono" id="ownCk">${esc(o.ck.slice(0,5))} ${esc(o.ck.slice(5))}</div>
  <div class="hint">강사용 주소를 폰에서 열고 로그인 화면에 이 <b>10자리</b>를 넣어요. 지금 선생님 코드로 로그인돼 있으면 맨 아래 [로그아웃] 뒤에 넣으면 돼요.<br>시간표가 올라간 뒤(1~2분) 로그인돼요.</div>
  <div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">닫기</button><button class="btn pri" data-act="ownCopy">복사</button></div></div>`}

/* ---- 폰에서 온 관리 요청 반영 ---- */
function adCur(b){return (b.versions||[]).find(v=>v.id===b.current)||(b.versions||[])[0]}
function adSV(b){const sv=b.sched&&(b.versions||[]).find(v=>v.id===b.sched.ver);return sv&&sv.id!==b.current?sv:null}
function adTwin(b,c){const sv=adSV(b);return sv&&c?{sv,tw:sv.classes.find(x=>tnm(x.name)===tnm(c.name))||null}:null}
const adS=v=>String(v==null?'':v).trim();
const adD=v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||''))?String(v):'';
/* 한 요청(ops 여러 개)을 지점 b에 적용 · 못 한 것은 이유를 돌려줌 */
function adOps(b,x){const out=[];const td=todayStr();const by=x.mgr?(String(x.by||'지점장').slice(0,20)):(ownCfg()||{}).nm||'관리자';
  const stu=id=>(b.students||[]).find(s=>s.id===id);let lastSid=null;
  for(const o of (x.ops||[]).slice(0,12)){const a=o.a||{};try{switch(o.op){
    case 'stAdd':{const name=adS(a.name).replace(/\s+/g,'').slice(0,20);if(!name)throw '이름 없음';const school=adS(a.school).slice(0,20),grade=adS(a.grade).slice(0,10);
      const dup=(b.students||[]).find(s=>!isOut(s)&&tnm(s.name)===tnm(name)&&tnm(s.school)===tnm(school));if(dup){lastSid=dup.id;out.push(name+' 이미 있음');break}
      const fd=adD(a.from);const pre=a.st==='예정'&&fd>td;const id=uid('s');b.students.push({id,name,school,grade,status:pre?'예정':'재원',...(fd?{from:fd}:{}),...(!school||!grade?{quick:1}:{}),at:td});lastSid=id;break}
    case 'stEd':{const s=stu(a.sid);if(!s)throw '학생 없음';const n=adS(a.name).replace(/\s+/g,'').slice(0,20);if(n)s.name=n;if(a.school!=null)s.school=adS(a.school).slice(0,20);if(a.grade!=null)s.grade=adS(a.grade).slice(0,10);if(s.school&&s.grade)delete s.quick;break}
    case 'stCt':{const s=stu(a.sid);if(!s)throw '학생 없음';const dg=v=>String(v||'').replace(/\D/g,'');const ok=v=>/^0\d{8,10}$/.test(v);const ph=dg(a.ph);
      if(ph&&!ok(ph))throw '번호 확인';if(ph)s.ph=ph;else delete s.ph;const pa=(Array.isArray(a.pa)?a.pa:[]).slice(0,4).map(x=>({l:adS(x.l).slice(0,10)||'보호자',n:dg(x.n)})).filter(x=>ok(x.n));if(pa.length)s.pa=pa;else delete s.pa;break}
    case 'stSt':{const s=stu(a.sid);if(!s)throw '학생 없음';const st=a.st;const d=adD(a.date);
      if(st==='퇴원'){s.status='퇴원';s.out=d||td;stOutApply(b,s.id)}
      else if(st==='예정'){if(!d)throw '첫 수업일 필요';s.status=d>td?'예정':'재원';s.from=d;delete s.out} /* 3.75.3: 지난 날짜면 그날부터 재원 */
      else if(st==='재원'||st==='휴원'){s.status=st;delete s.out;if(d&&st==='재원')s.from=d}
      else throw '상태 모름';break}
    case 'mAdd':{const sid=a.sid==='$new'?lastSid:a.sid;const s=stu(sid);if(!s)throw '학생 없음';const v=adCur(b);const c=v&&v.classes.find(i=>i.id===a.cls);if(!c)throw '반 없음';
      const t=a.t;if(!(b.teachers||[]).some(i=>i.id===t))throw '선생님 없음';const m=c.members=c.members||{};m[t]=m[t]||[];if(!m[t].includes(sid))m[t].push(sid);
      const r=adTwin(b,c);if(r&&r.tw){const mm=r.tw.members=r.tw.members||{};const key=(mm[t]!==undefined||r.sv.sessions.some(q=>q.cls===r.tw.id&&q.t===t))?t:Object.keys(mm)[0];if(key){mm[key]=mm[key]||[];if(!mm[key].includes(sid))mm[key].push(sid)}}break}
    case 'mDel':{const v=adCur(b);const c=v&&v.classes.find(i=>i.id===a.cls);if(!c)throw '반 없음';const sid=a.sid;Object.keys(c.members||{}).forEach(k=>{if(a.t&&k!==a.t)return;c.members[k]=c.members[k].filter(i=>i!==sid)});
      const r=adTwin(b,c);if(r&&r.tw)Object.keys(r.tw.members||{}).forEach(k=>{if(a.t&&k!==a.t&&r.tw.members[a.t]!==undefined)return;r.tw.members[k]=r.tw.members[k].filter(i=>i!==sid)});break}
    case 'cnSet':{const c=b.cns=b.cns||{};const per=+a.per;c.per=[0,1,2].includes(per)?per:0;if(a.kper!==undefined){const k=+a.kper;if(k===1||k===2)c.kper=k;else delete c.kper}c.exam=!!a.exam;if(/^\d{4}-\d{2}$/.test(a.start||''))c.start=a.start;else delete c.start;
      const ef=adD(a.ef),et=adD(a.et);if(ef&&et&&et>=ef)b.exam={from:ef,to:et};else if(a.exClear)delete b.exam;break}
    case 'cnAsg':{const s=stu(a.sid);if(!s)throw '학생 없음';const c=b.cns=b.cns||{};c.asg=c.asg||[];c.asg.push({id:uid('g'),sid:s.id,t:(b.teachers||[]).some(i=>i.id===a.t)?a.t:'',note:adS(a.note).slice(0,120),by,at:td});break}
    case 'cnAsgX':{const c=b.cns||{};c.asg=(c.asg||[]).filter(g=>g.id!==a.id);break}
    case 'stKey':{const s=stu(a.sid);if(!s)throw '학생 없음';if(a.on)s.key=1;else delete s.key;break}
    case 'cnHoldG':{const L=cnGrpStu(b,a.grade);if(!L.length)throw '그 학년 학생 없음';L.forEach(st=>cnHoldOne(b,st.id,!!a.on,adS(a.why).slice(0,40),by,td,a.grade));break}
    case 'cnAsgG':{const L=cnGrpStu(b,a.grade);if(!L.length)throw '그 학년 학생 없음';const t=(b.teachers||[]).some(i=>i.id===a.t)?a.t:'';cnAsgMany(b,L,t,adS(a.note).slice(0,120),by,td);break}
    case 'cnHold':{const s=stu(a.sid);if(!s)throw '학생 없음';const c=b.cns=b.cns||{};c.hold=c.hold||{};c.holdLog=c.holdLog||[];
      if(a.on){if(!c.hold[s.id]){const why=adS(a.why).slice(0,40);c.hold[s.id]={by,at:td,why};c.holdLog.push({sid:s.id,from:td,why,by})}}
      else if(c.hold[s.id]){const h=c.hold[s.id];const L=c.holdLog.filter(q=>q.sid===s.id&&!q.to);if(L.length)L.forEach(q=>q.to=td);else c.holdLog.push({sid:s.id,from:h.at||td,to:td,why:h.why||'',by:h.by||''});delete c.hold[s.id]}break}
    case 'iqAdd':{const n=adS(a.name).replace(/\s+/g,'').slice(0,20);if(!n)throw '이름 없음';const ph=String(a.ph||'').replace(/\D/g,'');
      b.inq=(b.inq||[]).concat([{id:uid('q'),st:'open',at:td,reg:td,name:n,school:adS(a.school).slice(0,20),grade:adS(a.grade).slice(0,10),ph:'',pa:/^0\d{8,10}$/.test(ph)?[{l:'보호자',n:ph}]:[],want:adD(a.want),src:'폰에서 입력'}]);break}
    case 'iqReg':{const q=(b.inq||[]).find(i=>i.id===a.id);if(!q||q.st!=='open')throw '문의 없음';const fd=adD(a.from);const pre=fd&&fd>td;const sid=uid('s');
      b.students.push({id:sid,name:q.name,school:q.school||'',grade:q.grade||'',status:pre?'예정':'재원',...(fd?{from:fd}:{}),...(q.ph?{ph:q.ph}:{}),...(q.pa&&q.pa.length?{pa:q.pa.map(p=>({l:p.l||'보호자',n:p.n}))}:{}),...(!q.school||!q.grade?{quick:1}:{}),at:td});q.st='done';q.sid=sid;q.doneAt=td;lastSid=sid;break}
    case 'iqX':{const q=(b.inq||[]).find(i=>i.id===a.id);if(!q)throw '문의 없음';if(a.back){q.st='open';delete q.cancelAt}else{q.st='cancel';q.cancelAt=td}break}
    case 'iqNote':{const q=(b.inq||[]).find(i=>i.id===a.id);if(!q)throw '문의 없음';const tx=adS(a.tx).slice(0,300);if(!tx)throw '내용 없음';q.notes=(q.notes||[]).concat([{id:uid('n'),at:td,by,tx}]);break} /* 입학 문의 메모(통화 내용 등) */
    case 'iqNoteDel':{const q=(b.inq||[]).find(i=>i.id===a.id);if(!q)throw '문의 없음';q.notes=(q.notes||[]).filter(n=>n.id!==a.nid);break}
    case 'anAdd':{const tx=adS(a.tx).slice(0,300);if(!tx)throw '내용 없음';b.ann=annLive(b);b.ann.push({id:uid('a'),tx,until:adD(a.until),at:Date.now()});break}
    case 'anDel':{b.ann=annLive(b).filter(i=>i.id!==a.id);break}
    default:throw '모르는 요청'}}catch(e){out.push(typeof e==='string'?e:'오류')}}
  return out}
async function adApply(){const L=(RQS.ad||[]);if(!L.length||RQS.adBusy||UI.edit||UI.peek||(typeof AUTO!=='undefined'&&AUTO.prev)||UI.stale)return;RQS.adBusy=true;
  try{const bad=L.filter(x=>x.adBad||!x.ops);for(const x of bad){try{await bridge.rqClose(x.num,false)}catch(e){}}
    const ok=L.filter(x=>!x.adBad&&x.ops).sort((a,z)=>(a.pat||a.at)-(z.pat||z.at));
    for(const br of [...new Set(ok.map(x=>x.br))]){const b0=DB.branches.find(i=>i.id===br);if(!b0)continue;const xs=ok.filter(x=>x.br===br);
      const seen=new Set(b0.adLog||[]);const old=Date.now()-7*864e5;const live=xs.filter(x=>!seen.has(x.n)&&(x.pat||x.at)>=old);
      if(live.length){let fails=[];const done=await quickChange(()=>{const bb=DB.branches.find(i=>i.id===br);fails=[];live.forEach(x=>{const f=adOps(bb,x);if(f.length)fails.push((x.lb||'요청')+': '+f.join(', '))});bb.adLog=(bb.adLog||[]).concat(live.map(x=>x.n)).slice(-300)},
        `폰에서 바꾼 것 반영 · ${live.map(x=>x.lb||'요청').slice(0,3).join(' · ')}${live.length>3?` 외 ${live.length-3}건`:''}`,br);if(!done)continue;if(fails.length)setTimeout(()=>toast('폰 요청 중 못 한 것: '+fails.join(' / '),6000),4200)}
      for(const x of xs){try{await bridge.rqClose(x.num,true)}catch(e){}}}
    RQS.ad=[]}finally{RQS.adBusy=false}}

/* ---- PC 상태 확인·원격 다시 시작 (관리자 폰 → kind 'pc', 서명) ----
   켜져 있는 PC는 요청을 보면 자기 상태(이름·역할·지점·버전·다시 시작 필요·수정 중)를 암호화한 댓글로 남김 · 관리자 PC는 연결된 PC 목록과 보낸 업데이트 버전도
   [다시 시작]은 그 PC만: 수정 중이면 안 하고 '수정 중'으로 답함 */
const PCS={done:new Set()};
function pcMe(){const i=(typeof SYNC!=='undefined'&&SYNC.info)||{};return {dev:i.dev||'',name:i.name||'',role:typeof isStaff==='function'&&isStaff()?'staff':i.on?(i.role||'owner'):'solo',branch:i.branch||'',brName:i.branch?syBName(i.branch):'',ver:APPVER,stale:!!UI.stale,edit:!!UI.edit,at:Date.now()}}
async function pcHandle(L){if(!bridge||!bridge.rqComment)return;
  for(const x of L){if(x.adBad||!x.ops){if(typeof isOwner==='function'&&isOwner())try{await bridge.rqClose(x.num,false)}catch(e){}continue}
    const age=Date.now()-(x.pat||x.at||0);if(age>10*60000){if(typeof isOwner==='function'&&isOwner()&&age>15*60000)try{await bridge.rqClose(x.num,true)}catch(e){}continue}
    if(PCS.done.has(x.num))continue;const o=x.ops[0]||{};const me=pcMe();
    if(o.op==='pcPing'){PCS.done.add(x.num);if(me.role==='owner'){try{const d=await bridge.syncDevices();me.devs=((d&&d.list)||[]).map(v=>({dev:v.dev,name:v.name||'',role:v.role||'',branch:v.branch||'',brName:v.branch?syBName(v.branch):'',ver:v.ver||'',day:v.day||'',stale:!!v.stale}))}catch(e){}try{me.pub=await bridge.updRemoteVer()}catch(e){}}
      try{await bridge.rqComment(x.num,me)}catch(e){}}
    else if(o.op==='pcPub'){PCS.done.add(x.num);if(!bridge.ghNow)continue;let r=null;try{r=await bridge.ghNow()}catch(e){}const g=r&&r.gh;if(!g||!g.on)continue; /* 올리기를 켠 PC만 */
      if(typeof MOBI!=='undefined'&&MOBI)MOBI.gh=g;try{await bridge.rqComment(x.num,Object.assign(me,{pub2:g.err?'err':'ok',err:g.err||'',last:g.last||0}))}catch(e){}}
    else if(o.op==='pcRestart'){if(!me.dev||(o.a||{}).dev!==me.dev)continue;PCS.done.add(x.num);
      if(UI.edit){try{await bridge.rqComment(x.num,Object.assign(me,{restart:'edit'}))}catch(e){}continue}

/* 이 PC: 윈도우를 켜면 프로그램 자동 실행 */

  {const lim=dPlus(td,21);const L=[];ks.forEach(k=>{const rng=schGet(k).rng||{};const seen=new Set();schExams(k).filter(x=>x.to>=td&&x.from<=lim).forEach(x=>{const gs=[...new Set(schStudents(k,b).filter(s=>!offS(s)&&exFor(s.grade,x)).map(s=>s.grade).filter(Boolean))].sort((a,z)=>GRADE_ORDER(a)-GRADE_ORDER(z)); /* 3.79.2: 3주 안 시험마다 그 시험을 치는 학년만(중3 따로 기간 포함) */
      gs.forEach(g=>{if(seen.has(x.ek+g))return;seen.add(x.ek+g);if(!Object.keys(rng).some(r=>r.startsWith(`${x.ek}|${g}|`)&&rng[r]&&(rng[r].a||rng[r].free||rng[r].memo)))L.push({k,g,d:x.from})})})});
    if(L.length)out.push({lv:'info',k:'시험 범위 비어 있음',m:`${L.slice(0,6).map(x=>`${schName(x.k)} ${x.g}(${mdS(x.d)})`).join(', ')}${L.length>6?` 외 ${L.length-6}곳`:''} · 3주 안 시험인데 범위가 없어요`,ids:[],go:{view:'school',sch:L[0].k}})}
  /* 3. 고2·3 선택과목 미정 (성적을 못 적음) */
  {const ek=typeof ekNow==='function'?ekNow(td):'';const L=act.filter(s=>/^고[23]$/.test(s.grade||'')&&!stuSubj(s,ek).length);
    if(L.length)out.push({lv:'info',k:'선택과목 미정',m:`${L.slice(0,8).map(s=>s.name).join(', ')}${L.length>8?` 외 ${L.length-8}명`:''} · 고2·3 선택과목을 정해야 성적을 적을 수 있어요`,ids:[],go:{view:'school',sch:schNorm(L[0].school)}})}
  /* 4. 첫 수업 2주 지났는데 상담 전인 신입 */
  {const L=act.filter(s=>csTgt(s)&&!s.cs&&s.from<=dPlus(td,-14));if(L.length)out.push({lv:'warn',k:'상담 전 신입',m:`${L.map(s=>`${s.name}(${mdS(s.from)}~)`).join(', ')} · 첫 수업 2주가 지났는데 아직 신입 상담 전이에요`,ids:[],go:{view:'students'}})}
  /* 5. 시험 끝나고 2주 지났는데 확정 점수가 빠진 학생 (학교별) */
  if(typeof grRec==='function'){const L=[];ks.forEach(k=>{const x=schExams(k).filter(e=>e.to<=dPlus(td,-14)&&e.to>=dPlus(td,-60)).pop();if(!x)return;
      const n=schStudents(k,b).filter(s=>!offS(s)&&!isPre(s)&&!(s.from&&s.from>x.from)).filter(s=>{const sj=grSubjects(s,x.ek).filter(j=>j||!/^고[23]/.test(s.grade||''));return sj.length&&sj.some(j=>{const r=grRec(s,x.ek,j);return !r||r.fin==null})}).length;if(n)L.push({k,n,ek:x.ek})});
    if(L.length)out.push({lv:'info',k:'확정 점수 빠짐',m:`${L.map(x=>`${schName(x.k)} ${x.n}명`).join(', ')} · 시험 끝나고 2주가 지났어요`,ids:[],go:{view:'grades',ek:L[0].ek}})}
  /* 6. 기한 지난 업무 (모든 지점 공유) */
  if(typeof tkAll==='function'){const L=tkAll().filter(t=>!t.done&&t.due&&t.due<td);if(L.length)out.push({lv:'info',k:'기한 지난 업무',m:`${L.slice(0,5).map(t=>`${t.title||t.kind}(${tkWho(t.who)||'담당 미정'})`).join(', ')}${L.length>5?` 외 ${L.length-5}개`:''}`,ids:[],go:{view:'tasks'}})}
  /* 7. 문의 온 지 1주 지난 입학 문의 */
  {const L=(b.inq||[]).filter(q=>q.st==='open'&&(q.reg||q.at)&&(q.reg||q.at)<=dPlus(td,-7));if(L.length)out.push({lv:'warn',k:'입학 문의 1주 지남',m:`${L.map(q=>`${q.name}(${mdS(q.reg||q.at)} 문의)`).join(', ')} · 문의 온 지 1주가 지났어요`,ids:[],go:{view:'students'}})}
  /* 8. 보호자 번호가 하나도 없는 재원생 */
  {const dg=x=>String(x||'').replace(/\D/g,'');const L=act.filter(s=>!dg(s.ph)&&!(s.pa||[]).some(p=>dg(p.n)));if(L.length)out.push({lv:'info',k:'연락처 없음',m:`${L.slice(0,8).map(s=>s.name).join(', ')}${L.length>8?` 외 ${L.length-8}명`:''} · 학생·보호자 번호가 하나도 없어요`,ids:[],go:{view:'students'}})}
}
/* ===== 3.75.0 시험 날짜별 학생 달력 (벽 달력처럼) — 날마다 "학교+학년(중등) / 학교+과목(고등) · 몇 명" 띠, '학생 이름' 스위치로 이름 펼침, A4 가로 인쇄
   과목→학생: 고1 공통수학은 학년, 고2·고3은 학생 카드 선택과목(s.subj['학년-학기']) — 없으면 과목 기본 학년(대수·미적1 고2 · 미적2 고3 · 확통·기하 고2·3)으로
   지점 학생만(지점장·행정·관리자 PC · 다른 지점은 시간표만이라 못 엶) */
const XC_G={'공통수학1':['고1'],'공통수학2':['고1'],'대수':['고2'],'미적분Ⅰ':['고2'],'확률과 통계':['고2','고3'],'기하':['고2','고3'],'미적분Ⅱ':['고3']};
function xcTokens(t){return String(t||'').split(/[,\/·\n]+|\s+/).map(x=>x.trim()).filter(Boolean)}
/* 한 학교의 그날 시험 글자(t) → [{lab, sj, sts}] */
function xcGroups(b,k,x,t){const kd=schKindOf(k);const sem=x.mk[1];const S=schStudents(k,b).filter(s=>!isPre(s)&&stuKind(s)===kd&&exFor(s.grade,x)).sort((a,z)=>sortKo(a.name,z.name));if(!S.length)return [];const nm=schName(k);const out=[];const tk=xcTokens(t);
  const byG=gs=>gs.map(g=>({lab:nm+(kd==='중'?g.slice(1):' '+g),sj:'',g,sts:S.filter(s=>s.grade===g)})).filter(o=>o.sts.length);
  const gTok=[...new Set(tk.flatMap(w=>{const m=/^(?:(중|고))?([123])(?:학년)?$/.exec(w)||/^(중|고)([123])$/.exec(w);return m?[kd+m[2]]:[]}))];
  if(kd==='중'){return byG(gTok.length?gTok:['중1','중2','중3'])}
  const sjs=[...new Set(tk.map(subjNorm).filter(s=>HS_SUBJ.includes(s)))];
  sjs.forEach(sj=>{const sts=S.filter(s=>{const gn=(/^고([123])$/.exec(s.grade||'')||[])[1];if(!gn)return false;if(gn==='1')return XC_G[sj].includes('고1');const L=(s.subj||{})[`${gn}-${sem}`];return L&&L.length?L.map(subjNorm).includes(sj):XC_G[sj].includes(s.grade)});if(sts.length)out.push({lab:nm,sj:subjShort(sj),sts})});
  if(!sjs.length)out.push(...byG(gTok.length?gTok:['고1','고2','고3']));return out}
/* 그 달의 날짜별 시험 */
function xcMonth(b,ym){const ks=new Set((b.students||[]).filter(s=>!offS(s)).map(s=>schNorm(s.school)).filter(k=>k&&['중','고'].includes(schKindOf(k))));const ev={};
  ks.forEach(k=>schExams(k).forEach(x=>{if(x.to.slice(0,7)<ym||x.from.slice(0,7)>ym)return;const kd=schKindOf(k);
    if(x.dm.length)x.dm.forEach(({d,t})=>{if(d.slice(0,7)!==ym)return;xcGroups(b,k,x,t).forEach(o=>(ev[d]=ev[d]||[]).push(Object.assign({k,kd},o)))});
    else if(x.from.slice(0,7)===ym)xcGroups(b,k,x,'').forEach(o=>(ev[x.from]=ev[x.from]||[]).push(Object.assign({k,kd,per:`${annMD(x.from)}~${annMD(x.to)}`},o)))}));
  Object.values(ev).forEach(L=>L.sort((a,z)=>({중:0,고:1}[a.kd]-{중:0,고:1}[z.kd])||sortKo(a.lab,z.lab)||sortKo(a.sj,z.sj)));return ev}
/* 처음 열 달: 지금 시험 중이거나 다음 시험이 있는 달 */
function xcStartYm(b){const td=todayStr();const L=schUpcoming(b,120);const x=L.find(x=>x.to>=td);return x?(x.from<=td?td:x.from).slice(0,7):td.slice(0,7)}
function xcCells(ym){const [y,m]=ym.split('-').map(Number);const ld=new Date(y,m,0).getDate();const fd=new Date(y,m-1,1).getDay();const c=[];for(let i=0;i<fd;i++)c.push('');for(let d=1;d<=ld;d++)c.push(`${ym}-${String(d).padStart(2,'0')}`);while(c.length%7)c.push('');return c}
const XC_EN=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
function xcGridHTML(b,ym,names,pr){const ev=xcMonth(b,ym);const td=todayStr();const W=['일','월','화','수','목','금','토'];const [y,m]=ym.split('-').map(Number);
  const chip=o=>`<div class="xce k${o.kd}"><div class="xch"><b>${esc(o.lab)}</b>${o.sj?`<span>${esc(o.sj)}</span>`:''}<em>${o.sts.length}</em></div>${o.per?`<div class="xcp" title="과목별 시험 날짜가 없어서 첫날에 기간으로 보여요">기간 ${esc(o.per)}</div>`:''}<div class="xcn">${o.sts.map(s=>`<span>${esc(s.name)}</span>`).join('')}</div></div>`;
  return `<div class="xcal${names?' on':''}${pr?' pr':''}"><div class="xct"><b>${m}월</b><small>${XC_EN[m-1]} ${y}</small><span>${esc(b.name)} 시험 일정</span></div>
    <div class="xcg">${W.map((w,i)=>`<div class="xcw${i===0?' su':i===6?' sa':''}">${w}</div>`).join('')}${xcCells(ym).map((d,i)=>{if(!d)return '<div class="xcd e"></div>';const L=ev[d]||[];return `<div class="xcd${d===td&&!pr?' td':''}${i%7===0?' su':i%7===6?' sa':''}${L.length?' has':''}"><i>${+d.slice(8)}</i>${L.map(chip).join('')}</div>`}).join('')}</div>
    <div class="xcl"><span class="k중">중등</span><span class="k고">고등</span><small>고2·고3은 학생 카드의 선택과목 기준(안 넣었으면 과목 기본 학년) · 과목별 날짜가 없는 학교는 첫날에 기간으로</small></div></div>`}
function xcOpen(){const b=B();if(typeof pcViewOnly==='function'&&pcViewOnly(b)){toast('다른 지점은 시간표만 볼 수 있어요');return}UI.xc=UI.xc&&UI.xc.b===b.id?UI.xc:{b:b.id,ym:xcStartYm(b),names:false};$('modal').hidden=false;xcRender()}
function xcRender(){const X=UI.xc;if(!X)return;const b=B();const [y,m]=X.ym.split('-').map(Number);
  $('modal').innerHTML=`<div class="dlg statdlg xcdlg" role="dialog" aria-modal="true" aria-labelledby="xcT" style="width:min(1240px,97vw)"><div class="sp-head"><h2 id="xcT">시험 달력</h2><span class="hint">날마다 누가 무슨 시험을 치는지 · ${esc(b.name)} 학생</span><span class="sp"></span>
    <button class="btn sm" data-act="xcMv" data-n="-1" aria-label="지난달">‹</button><b class="xcym">${y}년 ${m}월</b><button class="btn sm" data-act="xcMv" data-n="1" aria-label="다음 달">›</button>
    <span class="nmt"><button class="tgl" id="xcNm" role="switch" aria-checked="${X.names}"></button><label for="xcNm">학생 이름</label></span>
    <button class="btn" data-act="xcPrint">인쇄 · PDF</button><button class="btn" data-act="xcClose">닫기</button></div><div class="sp-body xcbody">${xcGridHTML(b,X.ym,X.names)}</div></div>`}
function xcMv(n){const X=UI.xc;const [y,m]=X.ym.split('-').map(Number);const d=new Date(y,m-1+n,1);X.ym=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;xcRender()}
function xcNames(){const X=UI.xc;X.names=!X.names;const c=document.querySelector('.xcdlg .xcal');if(c)c.classList.toggle('on',X.names);const t=$('xcNm');if(t)t.setAttribute('aria-checked',X.names)}
async function xcPrint(){const X=UI.xc;const b=B();$('print').innerHTML=`<div class="pg xcpg">${xcGridHTML(b,X.ym,X.names,true)}</div>`;document.body.classList.add('printing');
  /* A4 가로 한 장에 맞춤: 폭을 인쇄 폭(1075px)으로 두고 높이가 넘치면 그만큼 줄임 */{const pg=document.querySelector('#print .xcpg');let z=1;for(let i=0;i<3;i++){pg.style.width=(1075/z)+'px';pg.style.zoom='';const h=pg.scrollHeight;const nz=Math.min(1,735/h);if(Math.abs(nz-z)<0.01)break;z=nz}pg.style.width=(1075/z)+'px';pg.style.zoom=z.toFixed(3)}
  try{if(bridge){const r=await bridge.pdf({name:`${b.name}_시험달력_${X.ym}`.replace(/[\\/:*?"<>|~]/g,'_'),landscape:true,pageSize:'A4'});if(r&&r.saved)toast('PDF 저장: '+r.path)}else window.print()}catch(e){toast('PDF를 만들지 못했어요: '+e.message)}
  finally{document.body.classList.remove('printing');$('print').innerHTML=''}}
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('#xcNm,[data-act="xcMv"],[data-act="xcPrint"],[data-act="xcClose"],[data-act="xcOpen"]');if(!t)return;e.stopPropagation();
  if(t.id==='xcNm')xcNames();else if(t.dataset.act==='xcMv')xcMv(+t.dataset.n);else if(t.dataset.act==='xcPrint')xcPrint();else if(t.dataset.act==='xcOpen')xcOpen();else{UI.xc&&(UI.xc.open=false);$('modal').hidden=true}},true);

/* 3.75.6 시험 범위 과목 추가·지우기 (고등) — 추가는 빈 범위 줄을 만들고, 지우기는 지운 표시(del)를 남겨 다른 PC와 맞춤 */
/* 3.82.5 기출 수거 과목 줄 넣기·지우기 */
document.addEventListener('change',async e=>{const t=e.target;if(!t||!t.dataset||!t.dataset.gotadd||!t.value)return;const [k,g]=t.dataset.gotadd.split('|');const sj=t.value;
  await schSave((S,at)=>{const o=S.list[k]=S.list[k]||{};o.gotsj=o.gotsj||{};o.gotsj[`${g}|${sj}`]={v:1,at}},`기출 수거에 ${g} ${subjShort(sj)} 줄을 넣었어요`)});
document.addEventListener('click',async e=>{const b=e.target.closest&&e.target.closest('[data-act="gotSjDel"]');if(!b)return;e.stopPropagation();if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='지울까요?';clearTimeout(b._t);b._t=setTimeout(()=>{b.classList.remove('arm');b.textContent='×'},2500);return}
  const {k,g,sj}=b.dataset;await schSave((S,at)=>{const o=S.list[k]=S.list[k]||{};o.gotsj=o.gotsj||{};o.gotsj[`${g}|${sj}`]={v:0,at}},'과목 줄을 지웠어요')},true);
document.addEventListener('change',async e=>{const t=e.target;if(!t||!t.dataset||!t.dataset.rngadd||!t.value)return;const [k,y,sem,mf,g]=t.dataset.rngadd.split('|');const sj=t.value;const rk=`${y}|${sem}|${mf}|${g}|${sj}`;
  await schSave((S,at)=>{const o=S.list[k]=S.list[k]||{};o.rng=o.rng||{};const cur=o.rng[rk];if(cur&&!cur.del&&(cur.a||cur.z||cur.free||cur.memo))return;o.rng[rk]={a:null,z:null,memo:'',free:'',at}},`${g} ${subjShort(sj)} 줄을 넣었어요 · [범위 넣기]로 단원을 골라요`)});
document.addEventListener('click',async e=>{const b=e.target.closest&&e.target.closest('[data-act="rngSjDel"]');if(!b)return;e.stopPropagation();if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='지울까요?';clearTimeout(b._t);b._t=setTimeout(()=>{b.classList.remove('arm');b.textContent='×'},2500);return}
  const k=b.dataset.k,rk=b.dataset.rk;await schSave((S,at)=>{const o=S.list[k]=S.list[k]||{};o.rng=o.rng||{};o.rng[rk]={a:null,z:null,memo:'',free:'',del:1,at}},'과목 줄을 지웠어요')},true);

/* ===== 성적 관리 (PC) — 잠금 없는 공유 자료 sync/shared/grades.json (학교 정보·업무와 같은 방식)
   DB.grades={rec:{학생id:{'연도|학기|중간/기말|과목':{exp,fin,gr,at}}}, tests:{시험id:{id,br,name,grade,date,max,cut,at,del}}, tres:{시험id:{학생id:{sc,d,s,at}}}, mig:{지점id:1}}
   칸마다 at 큰 쪽이 남음 · 값이 하나도 없는 칸은 지운 것으로 봄(다른 PC에도 전해짐) · 지점장·행정 PC가 수정 모드와 상관없이 바로 저장
   s.note(특이사항)·s.hist(입·퇴원 이력)·s.re(재입학)는 학생 자료에 그대로 · 예전 s.grades·b.tests는 처음 한 번 옮기고(mig) 그 뒤엔 안 봄
   등락은 저장하지 않고 '같은 과목의 바로 전 시험 확정 점수'에서 계산 · 퇴원해도 기록은 남음 · 고2·3은 선택과목(학교 정보)을 정해야 적을 수 있음(과목 미정 줄엔 칸 없음) ===== */
const GR=()=>{if(!DB.grades||typeof DB.grades!=='object')DB.grades={rec:{},tests:{},tres:{},mig:{}};const G=DB.grades;G.rec=G.rec||{};G.tests=G.tests||{};G.tres=G.tres||{};G.mig=G.mig||{};return G};
function grMergeInto(dst,src){let ch=false;if(!src||typeof src!=='object')return false;const take=(o,k,v)=>{if(!v||typeof v!=='object')return;if(!o[k]||(v.at||0)>(o[k].at||0)){o[k]=v;ch=true}};
  dst.rec=dst.rec||{};Object.entries(src.rec||{}).forEach(([sid,m])=>{if(!m||typeof m!=='object')return;const d=dst.rec[sid]=dst.rec[sid]||{};Object.entries(m).forEach(([k,v])=>take(d,k,v))});
  dst.tests=dst.tests||{};Object.entries(src.tests||{}).forEach(([id,v])=>take(dst.tests,id,v));
  dst.tres=dst.tres||{};Object.entries(src.tres||{}).forEach(([tid,m])=>{if(!m||typeof m!=='object')return;const d=dst.tres[tid]=dst.tres[tid]||{};Object.entries(m).forEach(([sid,v])=>take(d,sid,v))});
  dst.mig=dst.mig||{};Object.keys(src.mig||{}).forEach(b=>{if(!dst.mig[b]){dst.mig[b]=1;ch=true}});return ch}
const grPull=opt=>shPull('grades',opt);
const grSave=(fn,msg)=>shSave('grades',fn,msg);

function tstTrendSVG(b,x,sid){const P=x.L.map(t=>({t,r:tstRes(t,sid)})).filter(o=>o.r.sc!=null).map(o=>({no:o.t.no||0,v:Math.round(o.r.sc/(o.t.max||100)*1000)/10,sc:o.r.sc,t:o.t}));if(P.length<2)return '';
  const W=500,H=120,l=28,r=10,tp=12,bt=18;const cut=(x.L[x.L.length-1]||{}).cut,cmx=(x.L[x.L.length-1]||{}).max||100;const cv=cut!=null?cut/cmx*100:null;
  let lo=Math.min(...P.map(p=>p.v),cv??101),hi=Math.max(...P.map(p=>p.v),cv??-1);lo=Math.max(0,Math.floor((lo-8)/10)*10);hi=Math.min(100,Math.ceil((hi+5)/10)*10);if(hi-lo<20){lo=Math.max(0,hi-20)}
  const n0=P[0].no,n1=P[P.length-1].no;const X=no=>l+(n1===n0?0:(no-n0)/(n1-n0)*(W-l-r)),Y=v=>tp+(hi-v)/(hi-lo)*(H-tp-bt);
  const d=P.map((p,i)=>`${i?'L':'M'}${X(p.no).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');const area=d+` L${X(n1).toFixed(1)} ${H-bt} L${X(n0).toFixed(1)} ${H-bt} Z`;const last=P[P.length-1],first=P[0];const ch=Math.round((last.v-first.v)*10)/10;
  return `<div class="ttr"><div class="ttrh"><b>${esc(x.name)}</b><span>${P.length}회 · ${n0}회 ${first.v}점 → ${n1}회 ${last.v}점</span>${tstDlHTML(ch)}</div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(x.name)} 점수 흐름"><g class="ax">${[lo,hi].map(v=>`<text x="${l-5}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${v}</text><line x1="${l}" x2="${W-r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>`).join('')}<text x="${X(n0).toFixed(1)}" y="${H-4}" text-anchor="start">${n0}회</text><text x="${X(n1).toFixed(1)}" y="${H-4}" text-anchor="end">${n1}회</text></g>
  ${cv!=null&&cv>=lo&&cv<=hi?`<line class="cut" x1="${l}" x2="${W-r}" y1="${Y(cv).toFixed(1)}" y2="${Y(cv).toFixed(1)}"/><text class="cutl" x="${l+4}" y="${(Y(cv)-3).toFixed(1)}">기준 ${cut}</text>`:''}
  <path class="ar" d="${area}"/><path class="ln" d="${d}"/>${P.map(p=>`<circle class="${cv!=null&&p.v<cv?'lo':''}" cx="${X(p.no).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${p===last?3.6:2.6}"><title>${p.no}회 ${esc(p.t.name)} · ${p.sc}${(p.t.max||100)!==100?'/'+p.t.max:''}점</title></circle>`).join('')}</svg></div>`}

function tstHistHTML(b,s){const DD={};[...new Set(tstList(b).map(t=>t.grade))].forEach(g=>{const x=tstDeltas(b,g);Object.assign(DD,Object.fromEntries(Object.entries(x.D).map(([k,v])=>[k,{v,c:x.C}])))});const L=tstList(b).filter(t=>{const r=tstRes(t,s.id);return r.sc!=null||r.d||r.s}).sort((a,z)=>(z.date||'').localeCompare(a.date||''));if(!L.length)return '';
  const hasD=L.some(t=>t.date);const TR=[...new Set(L.map(t=>t.grade))].flatMap(g=>tstSeries(b,g)).map(x=>tstTrendSVG(b,x,s.id)).filter(Boolean).join('');
  return `<div class="qal" style="margin-top:10px">자체시험 <span class="hint">${L.length}회</span></div>${TR?`<div class="ttrs">${TR}</div>`:''}<div class="scroll" style="max-height:160px"><table class="tbl grh"><thead><tr><th class="l">시험</th>${hasD?'<th>날짜</th>':''}<th>점수</th><th>지난 회 대비</th><th>풀이완료</th><th>발송완료</th></tr></thead><tbody>${L.map(t=>{const r=tstRes(t,s.id);return `<tr><td class="l">${t.ser&&t.sn&&!t.name.startsWith(t.sn)?`<small class="hint">${esc(t.sn)} · </small>`:''}${esc(t.name)} <small class="hint">${esc(t.grade)}</small></td>${hasD?`<td class="num">${t.date?esc(annMD(t.date)):''}</td>`:''}<td class="num"><b${t.cut&&r.sc!=null&&r.sc<t.cut?' class="bad"':''}>${r.sc??''}</b>${t.max&&t.max!==100?`<small>/${t.max}</small>`:''}</td><td class="num">${r.sc!=null&&DD[t.id]?tstDlHTML(DD[t.id].v[s.id],DD[t.id].c[t.id+'|'+s.id]):''}</td><td class="num">${r.d?'✓':''}</td><td class="num">${r.s?'✓':''}</td></tr>`}).join('')}</tbody></table></div>`}

async function tkImpParse(buf){const {z,sheets}=await readWorkbook(buf);const out=[];

 {id:'start',t:'처음 시작',b:`
