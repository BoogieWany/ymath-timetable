<script>
/* 데이터 주소: PC 프로그램에서는 같은 주소의 view.json. 나중에 인터넷 서버로 옮겨도 이 파일과 view.json만 있으면 됨 */
const SRC='view.json';
/* 글꼴이 준비될 때까지(최대 0.9초) 화면을 가렸다가 살며시 — 기본 글꼴로 떴다 바뀌는 번쩍임이 없게 */
document.documentElement.classList.add('fx');
(async()=>{try{await Promise.race([Promise.all(['400 1em "IBM Plex Sans KR"','600 1em "IBM Plex Sans KR"','700 1em "IBM Plex Sans KR"','500 1em "IBM Plex Mono"'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,900))])}catch(e){}document.documentElement.classList.remove('fx')})();
let GEST=null; /* 지금 진행 중인 손짓: 'ptr'(당겨 새로 받기) · 'tab'(탭 끌기) · 'sh'(창 끌어 닫기) — 서로 겹치지 않게 */
const DAYS=['월','화','수','목','금','토','일'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
/* 넓은 화면(PC 브라우저)이면 프로그램처럼 지점 시간표 격자 */
const DESK=/YMT-Desk/.test(navigator.userAgent); /* 강사용 PC 프로그램(전용 창) */
const WQ=matchMedia(DESK?'(min-width:900px)':'(min-width:1000px)'); /* 3.78.2: PC 프로그램은 창을 반쪽(960)으로 붙여도 PC 화면 유지 */let wide=WQ.matches;document.body.classList.toggle('wide',wide);
let lastCt=null;let D=null,ST={cnAll:ls.get('m_cnall','1')!=='0',br:ls.get('m_br',''),tab:wide?'grid':'today',day:null,t:ls.get('m_t',''),q:'',stu:null,open:new Set(),gm:ls.get('m_gm','week'),gz:0,fit:true,nm:ls.get('m_nm2','0')==='1',gt:'',nt:ls.get('m_nt','1')==='1'},lastOk=0;
const todayD=()=>DAYS[(new Date().getDay()+6)%7];
if(ls.get('m_mzv','')!=='2'){ls.set('m_mz','1');ls.set('m_mzv','2')} // 화면 전체 확대로 바뀌면서 예전 글씨 배율은 한 번 100%로
let MZ=+ls.get('m_mz','1')||1;
const GK=()=>wide?'m_gz':'m_pgz',FK=()=>wide?'m_fit':'m_pfit';
function loadGz(){ST.gz=wide?(+ls.get(GK(),'12.5')||12.5):11;ST.fit=wide?ls.get(FK(),'1')==='1':true}loadGz();
/* 화면 크기(−/+): 전체 표 말고는 글자만이 아니라 카드·버튼·간격까지 같은 비율로 (main 전체를 zoom) · 위쪽 바·아래 창은 예전처럼 글자만 */
function applyMz(){const r=document.documentElement.style;r.setProperty('--mz',wide?1:MZ);r.setProperty('--mzz',MZ)}applyMz();
const ME=()=>{if(D&&D.v2){const m=D.me||[];return m.find(x=>x.br===ST.br)||m[0]||null}try{return JSON.parse(ls.get('m_me','null'))}catch(e){return null}};
/* ===== 개인 코드 로그인(v2): 코드 → 키(PBKDF2) → 내 '열쇠 묶음'을 찾아 풂 → 내가 볼 수 있는 지점만 풀림 ===== */
const LK=()=>{try{return JSON.parse(ls.get('m_lk','null'))}catch(e){return null}};
async function lgDerive(code,j){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(j.salt),iterations:j.it,hash:'SHA-256'},km,256))}
async function lgH(k,s){const key=await crypto.subtle.importKey('raw',k,{name:'HMAC',hash:'SHA-256'},false,['sign']);return new Uint8Array(await crypto.subtle.sign('HMAC',key,new TextEncoder().encode(s)))}
async function lgOpen(kRaw,o){const k=await crypto.subtle.importKey('raw',kRaw,'AES-GCM',false,['decrypt']);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(o.iv)},k,b64(o.ct))))}
async function dec2(j,dk){const id=u8b64((await lgH(dk,'ymath-id')).slice(0,12));const es=(j.u||[]).filter(x=>x.id===id);if(!es.length)throw new Error('nocode');
  const wk=await lgH(dk,'ymath-wrap');let P=null;for(const e of es){try{P=await lgOpen(wk,e);break}catch(err){}}if(!P)throw new Error('nocode');
  const com=await lgOpen(b64(P.kc),j.com);const branches=[];
  for(const id of Object.keys(j.br||{})){const k=(P.kb||{})[id];if(!k)continue;const b=await lgOpen(b64(k),j.br[id]);b.ctm=(P.ct||{})[id]||null;b.tsm=(P.ts||{})[id]||null;branches.push(b)}
  if(!branches.length)throw new Error('nobr');
  return Object.assign({app:'ymath-view'},com,{v2:1,branches,me:P.me||[],myName:P.nm||'',all:!!P.all,role:P.role||'',home:P.home||'',...(P.sb?{sb:P.sb}:{}),...(P.tka?{tka:P.tka}:{}),...(P.role==='owner'&&P.ak?{ak:P.ak,ox:P.ox||{}}:{}),...(P.mk?{mk:P.mk}:{}),...(P.mq?{mq:P.mq}:{})})}
const isAdm=()=>!!(D&&D.v2&&D.role==='admin'); // 행정 선생님: 내 수업 없음 · 전 지점 · 학생 전체 연락처
/* 예전 방식(공용 번호)으로 저장된 것은 처음 한 번 지움 */
function legacyWipe(){if(!ls.get('m_pin','')&&!ls.get('m_key',''))return;['m_pin','m_key','m_me','m_noMe','m_cache'].forEach(k=>ls.set(k,''));try{Object.keys(localStorage).filter(k=>k.startsWith('m_ck_')).forEach(k=>localStorage.removeItem(k))}catch(e){}}
async function load(pin){
  const p=pin??ls.get('m_pin','');
  try{const r=await fetch(SRC+'?t='+Date.now(),{headers:{'x-pin':p},cache:'no-store'});
    if(r.status===401){showPin(pin!==undefined?'번호가 맞지 않아요':'');return}
    if(r.status===429){showPin('여러 번 틀려서 30초 뒤에 다시 해 주세요');return}
    if(!r.ok)throw new Error(r.status);
    const raw=await r.text();let j=JSON.parse(raw);
    if(j.enc===2){if(!(window.crypto&&crypto.subtle)){ST.mh='';$('main').innerHTML='<div class="off"><b>https 주소로 열어 주세요</b>보안 때문에 http 주소에서는 시간표를 풀 수 없어요. 주소 앞을 https:// 로 바꿔서 열어 주세요.</div>';return}
      if(pin===undefined&&D&&D.v2&&lastCt===j.h){ls.set('m_ofail','');lastOk=Date.now();meta(false);tick();rqFetch();return}
      const lk=LK();let dk=null;
      if(pin!==undefined)dk=await lgDerive(pin,j);else if(lk&&lk.salt===j.salt&&lk.it===j.it)dk=b64(lk.k);
      if(!dk){D=null;showPin(lk?'로그인이 풀렸어요 · 코드를 다시 넣어 주세요':'');return}
      try{j=await dec2(j,dk)}catch(e){if(pin!==undefined){showPin('코드가 맞지 않아요');return}
        if(D&&D.v2&&((D._o&&D._o.role)||D.role)==='owner'){const f0=+ls.get('m_ofail','0')||Date.now();ls.set('m_ofail',String(f0));if(Date.now()-f0<2*864e5){lastOk=Date.now();meta(true);if(!ST.ofT){ST.ofT=1;fzToast('예전 버전 PC가 시간표를 올려 관리자 정보가 잠깐 빠졌어요 · 그 PC가 업데이트되면 돌아와요',4200)}return}}
        ls.set('m_lk','');ls.set('m_cache','');D=null;lastCt=null;showPin('코드가 바뀌었거나 없어졌어요 · 부원장님께 새 코드를 받아 주세요');return}
      const j0=JSON.parse(raw);ls.set('m_ofail','');ST.ofT=0;if(pin!==undefined){ls.set('m_lk',JSON.stringify({salt:j0.salt,it:j0.it,k:u8b64(dk)}));pin=undefined}lastCt=j0.h}
    else if(j.enc&&D&&D.v2){lastOk=Date.now();meta(true);return}
    else if(j.enc===1&&!p){D=null;showPin(pin!==undefined?'시간표가 아직 새 로그인 방식으로 올라오지 않았어요 · 잠시 뒤 다시 해 주세요':'');return}
    else if(j.enc){if(!p){showPin('');return}
      if(!(window.crypto&&crypto.subtle)){ST.mh='';$('main').innerHTML='<div class="off"><b>https 주소로 열어 주세요</b>보안 때문에 http 주소에서는 시간표를 풀 수 없어요. 주소 앞을 https:// 로 바꿔서 열어 주세요.</div>';return}
      if(D&&lastCt===j.ct){lastOk=Date.now();meta(false);tick();rqFetch();return}
      try{j=await dec(j,p);lastCt=JSON.parse(raw).ct}catch(e){KC.k=null;ls.set('m_pin','');ls.set('m_key','');showPin(pin!==undefined?'번호가 맞지 않아요':'');return}}
    const first=!D;if(!first){nextApply(j);const m=viewDiff(D,j);CHG.m=Object.keys(m).length?m:null;CHG.m0=CHG.m}D=j;if(pin!==undefined)ls.set('m_pin',pin);lastOk=Date.now();ls.set('m_cache',raw);if(first)initBr();render();if(first)fadeIn();else chgToast(CHG.m0||null);rqFetch(true)}
  catch(e){if(!D){const c=ls.get('m_cache','');const lk=LK();if(c&&(p||lk)){try{let j=JSON.parse(c);if(j.enc===2)j=await dec2(j,b64(lk.k));else if(j.enc)j=await dec(j,p);D=j;initBr();render();fadeIn();meta(true);return}catch(err){}}
      ST.mh='';$('main').innerHTML='<div class="off"><b>시간표를 받지 못했어요</b>인터넷 연결을 확인해 주세요. 학원 PC 주소로 연 경우에는 PC 프로그램이 켜져 있고 폰이 학원 와이파이에 있어야 해요.<br><br><button class="btn" onclick="load()">다시 연결</button></div>'}else meta(true)}}

  ${gone.length?`<div class="sec">${wait?'아직 답 없음':'응답 없음'} <small>${wait?'1분쯤 더 기다려 보세요':'꺼져 있거나 인터넷이 끊겼어요'}</small></div>${gone.map(d=>`<div class="apc"><i></i><div><b>${esc(d.name||'(이름 없음)')}</b><small>${esc(pcRole(d))}${d.brName?' · '+esc(d.brName):''} · 마지막 v${esc(d.ver)}${d.day?' · '+mdA(d.day):''}</small></div></div>`).join('')}`:''}
  <div class="acard"><div class="acardh"><b>이 폰 화면</b><button class="ambtn sm" data-act="verChk">새 버전 불러오기</button></div><div class="hint">지금 이 폰은 <b>v${esc(MVER)}</b> · PC에서 업데이트한 뒤 누르면 새 화면으로 바로 바꿔요(선생님 폰은 저절로 바뀌어요)</div></div>
  <div class="hint" style="margin:12px 2px">꺼져 있는 프로그램은 폰에서 켤 수 없어요. 학원 PC마다 [설정 → 이 PC → 윈도우를 켜면 프로그램 자동 실행]을 켜 두면, PC만 켜져 있으면 프로그램도 열려 있어요.</div>`}

/* 3.78.0 폰 [+ 학생]: 학년을 적으면 그 학년 반이 위로(고른 반은 유지) */
document.addEventListener('input',e=>{const t=e.target;if(!t||t.id!=='anG')return;const box=$('anC');if(!box)return;const g=t.value.trim().replace(/\s+/g,'');if(box.dataset.pkg===g)return;const on=new Set([...box.querySelectorAll('.pk[aria-pressed="true"]')].map(x=>x.dataset.pk));
  box.outerHTML=pairChips(B0(),'anC',g);$('anC').querySelectorAll('.pk').forEach(x=>{if(on.has(x.dataset.pk))x.setAttribute('aria-pressed','true')});if(on.size){const r=$('anC').querySelector('.pkrest');if(r&&[...r.querySelectorAll('.pk[aria-pressed="true"]')].length){r.hidden=false;r.style.display='contents';const m=$('anC').querySelector('[data-pkmore]');if(m)m.remove()}}});

boot();
</script>
